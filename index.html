<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doctor &amp; Missy 的厨房</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="狗狗厨房">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}</style>
<style>
/* 布局：手机单列。顶部日期条，中间一屏一个任务，底部四个标签。克数用秤读数式的窄体数字。 */
:root{
  --bg:#eef1ec; --card:#fbfcfa; --sunk:#e3e8e1; --line:#cfd8cd;
  --ink:#1d2620; --ink2:#55625a; --ink3:#7d887f;
  --accent:#2d5a4a; --accent-ink:#ffffff; --accent-soft:#d9e6df;
  --doc:#9a5b14; --doc-soft:#f3e4cf;       /* Doctor：喜乐蒂的貂色 */
  --mis:#3b5875; --mis-soft:#dbe4ee;       /* Missy：边牧的石板蓝 */
  --ok:#2f7a45; --ok-soft:#dcefe1; --warn:#a2650b; --warn-soft:#f6e7c9; --bad:#b23a2e; --bad-soft:#f6dcd8;
  --num:"SF Pro Display","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --txt:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --card:#1c2420; --sunk:#232d28; --line:#33403a;
  --ink:#e6ece8; --ink2:#a9b6ae; --ink3:#7f8c85;
  --accent:#7fbfa4; --accent-ink:#0f1a15; --accent-soft:#24392f;
  --doc:#e2a85c; --doc-soft:#3a2c1a; --mis:#97b5d4; --mis-soft:#223040;
  --ok:#7ccf93; --ok-soft:#1f3527; --warn:#e8b45a; --warn-soft:#3a2f17; --bad:#f08e82; --bad-soft:#40211d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --card:#1c2420; --sunk:#232d28; --line:#33403a;
  --ink:#e6ece8; --ink2:#a9b6ae; --ink3:#7f8c85;
  --accent:#7fbfa4; --accent-ink:#0f1a15; --accent-soft:#24392f;
  --doc:#e2a85c; --doc-soft:#3a2c1a; --mis:#97b5d4; --mis-soft:#223040;
  --ok:#7ccf93; --ok-soft:#1f3527; --warn:#e8b45a; --warn-soft:#3a2f17; --bad:#f08e82; --bad-soft:#40211d;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--txt);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}

/* 顶部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:-16px;padding:10px 16px 9px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.top .sub{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--ink2);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.chicken{background:var(--warn-soft);color:var(--warn)}
.pill.pork{background:var(--bad-soft);color:var(--bad)}
.sync{margin-left:auto;font-size:12px;color:var(--ink3)}

/* 标签栏 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:10px 0 11px;font-size:14px;color:var(--ink3);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .dot{position:absolute;top:7px;margin-left:2px;width:7px;height:7px;border-radius:50%;background:var(--bad)}

section{margin-top:18px}
h2{font-size:13px;letter-spacing:.08em;color:var(--ink2);font-weight:600;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.note{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink3)}
.stack{display:grid;gap:10px}

/* 提醒 */
.alert{display:grid;grid-template-columns:4px 1fr;gap:0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 0;overflow:hidden}
.alert::before{content:"";border-radius:0 3px 3px 0;background:var(--warn)}
.alert.bad::before{background:var(--bad)} .alert.info::before{background:var(--accent)}
.alert b{font-weight:700}
.alert .act{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}

/* 秤读数 */
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
.big{font-size:26px;line-height:1}
.unit{font-size:13px;color:var(--ink2);margin-left:2px;font-family:var(--txt);font-weight:400}

/* 一起做 */
.cook{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cook .cell{background:var(--sunk);border-radius:10px;padding:10px 12px}
.cook .lbl{font-size:12px;color:var(--ink2)}
.cook select{max-width:100%}

/* 狗卡片 */
.dogs{display:grid;gap:12px}
@media (min-width:640px){.dogs{grid-template-columns:1fr 1fr}}
.dog{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.dog header{display:flex;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dog.doctor header{background:var(--doc-soft)} .dog.missy header{background:var(--mis-soft)}
.dog header .name{font-weight:700;font-size:16px}
.dog.doctor .name{color:var(--doc)} .dog.missy .name{color:var(--mis)}
.dog header .kc{margin-left:auto;font-size:13px;color:var(--ink2)}
.rows{list-style:none;margin:0;padding:4px 14px}
.rows li{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rows li:last-child{border-bottom:0}
.rows .what{min-width:0}
.rows .how{font-size:12px;color:var(--ink3);display:block}
.rows .amt{text-align:right;white-space:nowrap}
.rows .amt .num{font-size:20px}
.rows .per{display:block;font-size:12px;color:var(--ink3);text-align:right}
.box{margin:0 14px 12px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--sunk)}
.box .t{font-size:12px;color:var(--ink2);margin-bottom:4px}
.box .items{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 9px;border-radius:7px;background:var(--card);border:1px solid var(--line);font-size:13px}
.tag.key{border-color:var(--accent);color:var(--accent);font-weight:600}
.dog footer{display:flex;gap:8px;padding:0 14px 14px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%;min-height:50px;font-size:16px}
.btn.small{min-height:32px;padding:5px 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn:focus-visible,.tabs button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.done{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600}

/* 表单 */
select,input[type=number],input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:38px}
input[type=number]{width:96px;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .l{min-width:0}
.field .l small{display:block;color:var(--ink3);font-size:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* 检查 */
.meter{display:grid;grid-template-columns:5.2em 1fr 4.6em;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.meter:last-child{border-bottom:0}
.meter .nm{font-size:14px}
.meter .bar{position:relative;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.meter .fill.thin{background:var(--warn)} .meter .fill.low{background:var(--bad)} .meter .fill.high{background:var(--bad)}
.meter .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.meter .v{text-align:right}
.meter .v small{display:block;font-size:11px;color:var(--ink3);font-family:var(--txt);font-weight:400;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink3);margin-top:8px}
.st{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.thin,.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.low,.st.high,.st.bad{background:var(--bad-soft);color:var(--bad)}
table.qt{width:100%;border-collapse:collapse;font-size:13px}
table.qt th{font-weight:600;color:var(--ink2);text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
table.qt td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.qt td.num{text-align:right;white-space:nowrap} table.qt th:nth-child(2),table.qt th:nth-child(3){text-align:right}
table.qt tr.sug td{color:var(--ink2);font-size:12px;border-bottom:1px solid var(--line);padding-top:0} .st.info{background:var(--sunk);color:var(--ink2)}
.days{list-style:none;margin:0;padding:0}
.days li{display:grid;grid-template-columns:4.2em 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.days li:last-child{border-bottom:0}

/* 做块 */
.batch h3{margin:0;font-size:16px}
.batch .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.recipe{list-style:none;margin:8px 0;padding:0;display:grid;gap:2px}
.recipe li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.recipe li:last-child{border-bottom:0}
.steps{margin:8px 0 0;padding-left:1.3em;font-size:14px;color:var(--ink2)}
.steps li{margin:3px 0}
.rec{border-color:var(--accent)}
.mealh{display:flex;justify-content:space-between;align-items:baseline;margin:10px 14px 0;padding-top:8px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.mealh .kc{font-weight:400;font-size:12px;color:var(--ink3)}
.pre{margin:8px 14px 0;font-size:13px;color:var(--ink2)}
.treat{margin:0 14px 10px;padding:9px 11px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.ratio{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.status{list-style:none;margin:0;padding:0}
.status li{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.status li:last-child{border-bottom:0}
.status .nm{font-weight:700}
.status .tx{font-size:14px;color:var(--ink2);min-width:0}
.shop{margin:0;padding-left:1.2em;columns:2;column-gap:20px}
.shop li{padding:2px 0;break-inside:avoid}
@media (max-width:420px){.shop{columns:1}}
details.fold>summary{cursor:pointer;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::after{content:"展开";font-size:12px;font-weight:400;color:var(--ink3)}
details.fold[open]>summary::after{content:"收起"}
details.fold>summary::-webkit-details-marker{display:none}
details.fold[open]>summary{border-radius:12px 12px 0 0;border-bottom:0}
details.fold>.card,details.fold>section.card{border-radius:0 0 12px 12px;margin:0}
details.mini{border-top:1px solid var(--line);padding:9px 0 0;margin-top:4px}
details.mini>summary{cursor:pointer;font-size:14px;color:var(--ink2)}
details.mini+details.mini{margin-top:8px}
.recsteps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.recsteps li{display:grid;grid-template-columns:1.4em 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink3)}
.recsteps li:last-child{border-bottom:0}
.recsteps li b{font-weight:600}
.recsteps li small{display:block;font-size:12px}
.recsteps li.done{color:var(--ink)} .recsteps li.done .mk{color:var(--ok)}
.recsteps li.cur{color:var(--ink)} .recsteps li.cur .mk{color:var(--accent);font-weight:700}
.recsteps .when{font-size:12px;color:var(--ink3);white-space:nowrap}
.pbox{width:100%;border-collapse:collapse;font-size:14px;min-width:300px}
.pbox th,.pbox td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.pbox thead th{font-size:13px;font-weight:700;border-bottom:2px solid var(--line)}
.pbox thead .d{color:var(--doc)} .pbox thead .m{color:var(--mis)}
.pbox tbody th{white-space:nowrap;font-weight:700;width:4.5em}
.pbox tbody th small{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.pbox tr.now{background:var(--accent-soft)}
.pbox b{color:var(--accent)}
.stock{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;background:var(--sunk);border-radius:10px;padding:9px 12px;margin:8px 0}
.stock .btn{white-space:nowrap}
.stock .gauge{grid-column:1 / -1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.stock .gauge i{display:block;height:100%;background:var(--accent)}

/* 底部抽屉 */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .bar{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.err{background:var(--bad-soft);color:var(--bad);padding:10px;border-radius:10px;font-size:13px;margin-top:10px}
/* 我的食材 */
textarea.code{width:100%;min-height:120px;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);resize:vertical}
.flist{list-style:none;margin:6px 0 0;padding:0}
.flist li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.flist li:last-child{border-bottom:0}
.flist .nm{font-weight:600}
.flist small{display:block;color:var(--ink3);font-size:12px}
.fprev{margin-top:10px;overflow-x:auto}
.fprev table{min-width:460px}
.fwarn{margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
/* 营养缺口 */
.gchip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin:2px 4px 2px 0;white-space:nowrap}
.gchip.bad{background:var(--bad-soft);color:var(--bad)} .gchip.warn{background:var(--warn-soft);color:var(--warn)}
.gchip.sm{font-size:11px;padding:0 6px} .gchip i{font-style:normal;font-weight:400;opacity:.75;margin-left:4px}
.grow{margin-top:6px;line-height:1.9} .grow .who,.gby .who{font-weight:600;margin-right:6px;font-size:13px}
.gfoods{margin:4px 0 0;padding-left:20px;display:flex;flex-wrap:wrap;gap:2px 22px} .gfoods li{margin:2px 0;font-weight:600}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <h1>Doctor &amp; Missy 的厨房</h1>
    <div class="sub" id="hdr"><span>正在准备…</span></div>
  </header>
  <main id="view">
    <section><div class="card note">正在计算今天的饭量…</div></section>
  </main>
</div>
<nav class="tabs" id="tabs" aria-label="页面">
  <button type="button" data-tab="today">今天吃什么</button>
  <button type="button" data-tab="prep">做饭</button>
  <button type="button" data-tab="dogs">两只狗</button>
</nav>

// ───────────────────────── 日期工具 ─────────────────────────
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function weekStart(s){const d=pd(s);d.setDate(d.getDate()-((d.getDay()+1)%7));return ds(d)}   // 周六
function monthStart(s){return s.slice(0,8)+'01'}
function monthEnd(s){const d=pd(monthStart(s));d.setMonth(d.getMonth()+1);d.setDate(0);return ds(d)}
function range(a,b){const r=[];for(let x=a;x<=b;x=addDays(x,1))r.push(x);return r}
function weekdayOf(s){return pd(s).getDay()}

// ───────────────────────── 营养累加 ─────────────────────────
const zero = () => { const t={kcal:0, kmod:0, dm:0}; NUT.forEach(k=>t[k]=0); return t; };
// 热量按 NRC 2006：总能 × 按整天纤维占干物质比例算的消化率 − 尿能损失
//   GE = 5.7×蛋白 + 9.4×脂肪 + 4.1×(碳水+纤维)   消化率% = 91.2 − 1.43×纤维%DM   ME = GE×消化率 − 1.04×蛋白
// 食材库的纤维是总膳食纤维（比粗纤维高），算出的消化率略偏低，结果偏保守。
// kmod 是改良 Atwater（3.5/8.5/3.5）热量，只用来算三大营养素占比（%ME）。
const digest = t => t.dm>0 ? Math.max(0.5,(91.2 - 1.43*(t.fiber/t.dm*100))/100) : 0.9;
const geOf = t => 5.7*t.p + 9.4*t.f + 4.1*(t.c + t.fiber);
function nrcKcal(t){ return geOf(t)*digest(t) - 1.04*t.p; }
function finalize(t){ t.kcal = nrcKcal(t); return t; }
const ME = d => d.p*3.5 + d.f*8.5 + d.c*3.5;
function addFood(t, F, name, g){
  const d = F[name]; if(!d || !g) return t;
  NUT.forEach(k=>{
    if((k==='fe'||k==='vita_retinol') && PLANT.has(d.cat)) return;
    const av = AVAIL[name] && AVAIL[name][k]!==undefined ? AVAIL[name][k] : 1;
    const R = retOf(d), rt = R && R[k]!=null ? R[k] : 1;
    t[k] += (d[k]||0)*g/100*av*rt;
  });
  t.kmod += ME(d)*g/100;
  t.dm += (d.dm||0.25)*g;
  return t;
}
function addSupp(t, s){
  if(!s) return t;
  if(s.caG)   t.ca   += s.caG*SUPP.ca.mgPerG;
  if(s.iTab)  { t.i += s.iTab*SUPP.i.ugPerTab; t.k += s.iTab*SUPP.i.kPerTab; }
  if(s.znTab) t.zn   += s.znTab*SUPP.zn.mgPerTab;
  if(s.znMg)  t.zn   += s.znMg*ZN_AVAIL_MIX;
  if(s.saltG){ t.na += s.saltG*SUPP.salt.naPerG; t.cl += s.saltG*SUPP.salt.clPerG; t.i += s.saltG*SUPP.salt.iPerG; }
  if(s.vbTab) for(const k of ['b1','b2','b6','nia','pa']) t[k] += s.vbTab*SUPP.vb[k];
  if(s.veCap) t.vite += s.veCap*SUPP.ve.iuPerCap;
  if(s.vdCap) t.vitd += s.vdCap*SUPP.vd.iuPerCap;
  if(s.tauCap) t.taurine += s.tauCap*SUPP.tau.mgPerCap;
  if(s.mgG) t.mg += s.mgG*SUPP.mg.mgPerG;
  if(s.foCap){ t.f += s.foCap*SUPP.fo.gPerCap; t.kmod += s.foCap*SUPP.fo.gPerCap*8.5; t.dm += s.foCap*SUPP.fo.gPerCap;
               t.epadha += s.foCap*SUPP.fo.epadhaPerCap; }
  return t;
}

// 不含磷（全部来自肉，肉里的磷吸收好）、钙（单独处理，见 CAP_MBW_MAX）、亚油酸等脂肪酸（油整锅一个比例，Missy 对油敏感）
const RA_MBW = {mg:19.7,k:140,na:26.2,cl:40,fe:1.0,zn:2.0,cu:0.2,mn:0.16,se:11.8,i:29.6,vita_retinol:167,vitd:18,vite:1.45,

function mbwDay(dog, k){ const w = dog && +dog.wkg; if(k==='cu' && dog && dog.cuSoft) return 0; return (w>0 && RA_MBW[k]!=null) ? RA_MBW[k]*Math.pow(w,0.75)/tgt(k) : 0; }

// 某自然周做哪种内脏块：从 anchor 起逐周交替
function organTypeOfWeek(cfg, wsDate){
  const a = cfg.organ.anchor.week || wsDate;
  const n = Math.round((pd(wsDate)-pd(a))/(7*864e5));
  const flip = ((n%2)+2)%2===1;
  const t = cfg.organ.anchor.type;
  return flip ? (t==='chicken'?'pork':'chicken') : t;
}

// 一种内脏配方每100g（生重）的营养
function per100(F, recipe){
  const tot = Object.values(recipe).reduce((a,b)=>a+b,0);
  const t = zero(); for(const n in recipe) addFood(t,F,n,recipe[n]);
  const r = {}; Object.keys(t).forEach(k=>r[k]=t[k]/tot*100);   // dm 也按每100g
  return {per100:r, raw:tot};
}

// ───────────────────────── 碳水：一种或两种 ─────────────────────────
// carbSplit = 第二种碳水占碳水热量的比例。返回 [[食材, 质量占比], ...] 和等效的“混合碳水”每100g
function carbParts(F, cfg){
  const c1=cfg.carb, c2=cfg.carb2;
  if(!c2 || c2===c1 || !F[c2]) return [[c1,1]];
  const w = cfg.carbSplit==null ? 0.5 : cfg.carbSplit;
  const n1=(1-w)/ME(F[c1]), n2=w/ME(F[c2]), t=n1+n2;
  return [[c1,n1/t],[c2,n2/t]];
}
function carbMix(F, cfg){
  const parts = carbParts(F,cfg);
  if(parts.length===1) return F[parts[0][0]];
  const m={p:0,f:0,c:0,fiber:0,dm:0};
  for(const [n,fr] of parts){ const d=F[n]; m.p+=d.p*fr; m.f+=d.f*fr; m.c+=d.c*fr; m.fiber+=(d.fiber||0)*fr; m.dm+=(d.dm||0.25)*fr; }
  return m;
}
function addCarbs(t, F, cfg, g){ for(const [n,fr] of carbParts(F,cfg)) addFood(t,F,n,g*fr); return t; }

const TREAT_KCAL_PER_G = 4.5;   // 鸡胸脆片（生鸡胸烘干）约 4.5 kcal/g
function treatKcal(cfg, dogKey, d){
  const tr = cfg.train; if(!tr || !tr.days || !tr.days[d]) return 0;
  const pct = (tr.pct && tr.pct[dogKey]!=null) ? tr.pct[dogKey] : 0.10;
  return cfg.dogs[dogKey].kcal * pct;
}
function mealKcal(cfg, dogKey, d){ return cfg.dogs[dogKey].kcal - (d ? treatKcal(cfg,dogKey,d) : 0); }
// 脂肪上限（每只狗可设，%ME，改良 Atwater）：按设定的蛋白比例算出来脂肪超了，
// 就把这只狗的蛋白比例往下调（少肉多米），最低 P_FLOOR；还超就只能提示换肉。
const P_FLOOR = 30;
// 蛋白目标：每只狗按身体情况定一次（体检有变化时再改），没设就用全局
function pTarget(cfg, k){ const d = cfg.dogs[k]; return (d && d.pctP!=null) ? d.pctP : cfg.pctP; }
function fatPctOf(F, cfg, fx, sol){
  const M=F[cfg.meat], Cm=carbMix(F,cfg);
  const f = fx.f + sol.gM*M.f/100 + sol.gC*Cm.f/100, km = fx.kmod + sol.gM*ME(M)/100 + sol.gC*ME(Cm)/100;
  return km>0 ? f*8.5/km*100 : 0;
}
// 脂肪克数（每 1000 kcal）
function fatGOf(F, cfg, fx, sol, kc){
  const M=F[cfg.meat], Cm=carbMix(F,cfg);
  return (fx.f + sol.gM*M.f/100 + sol.gC*Cm.f/100)/kc*1000;
}
function solveMain(F, cfg, dogKey, fixedT, kcOverride){
  const dog = cfg.dogs[dogKey], kc = kcOverride!=null ? kcOverride : dog.kcal;
  const P0 = pTarget(cfg, dogKey);
  // 超上限：脂肪供能比（fatMax，%）或每 1000 kcal 脂肪克数（fatMaxG，兽医给的范围）
  const over = s2 => (dog.fatMax && fatPctOf(F,cfg,fixedT,s2) > dog.fatMax + 1e-6) || (dog.fatMaxG && fatGOf(F,cfg,fixedT,s2,kc) > dog.fatMaxG + 1e-6);
  const fin = (s2, p) => { s2.pctP = p; s2.fatPct = fatPctOf(F,cfg,fixedT,s2); s2.fatG = fatGOf(F,cfg,fixedT,s2,kc); return s2; };
  let sol = fin(solveAt(F, cfg, dogKey, fixedT, kcOverride, P0), P0);
  if(!over(sol)) return sol;
  const lowSol = fin(solveAt(F, cfg, dogKey, fixedT, kcOverride, P_FLOOR), P_FLOOR);
  if(over(lowSol) || !lowSol.ok){ lowSol.fatOver = true; return lowSol; }
  let lo = P_FLOOR, hi = P0;
  for(let i=0;i<30;i++){ const mid=(lo+hi)/2, s2=solveAt(F,cfg,dogKey,fixedT,kcOverride,mid); if(over(s2)) hi=mid; else lo=mid; }
  return fin(solveAt(F, cfg, dogKey, fixedT, kcOverride, lo), lo);
}
function solveAt(F, cfg, dogKey, fixedT, kcOverride, pctP){
  const dog = cfg.dogs[dogKey], M=F[cfg.meat], Cm=carbMix(F,cfg);
  const kc = kcOverride!=null ? kcOverride : dog.kcal, share = pctP/100;
  const per = d => ({p:d.p/100, f:d.f/100, c:d.c/100, fib:(d.fiber||0)/100, dm:(d.dm||0.25)});
  const m = per(M), cc = per(Cm), fx = fixedT;
  let gM = 0, gC = 0, dg = digest(fx);
  for(let it=0; it<8; it++){
    const e = x => (5.7*x.p + 9.4*x.f + 4.1*(x.c+x.fib))*dg - 1.04*x.p;     // 每克 ME
    const eFix = geOf(fx)*dg - 1.04*fx.p;
    // ① NRC 热量 = 目标   ② 蛋白占改良 Atwater 热量的比例 = 目标
    const a1=e(m), b1=e(cc), c1=kc-eFix;
    const km = x => 3.5*x.p + 8.5*x.f + 3.5*x.c;
    const a2=3.5*m.p - share*km(m), b2=3.5*cc.p - share*km(cc), c2=share*fx.kmod - 3.5*fx.p;
    const det=a1*b2-a2*b1;
    gM=(c1*b2-c2*b1)/det; gC=(a1*c2-a2*c1)/det;
    const tot = {fiber: fx.fiber + gM*m.fib + gC*cc.fib, dm: fx.dm + gM*m.dm + gC*cc.dm};
    dg = digest(tot);
  }
  return {gM, gC, ok: gM>0 && gC>0};
}

// 当天某只狗的“块”目标（生重等价克数）
function blockTargets(F, cfg, dogKey, type, others){
  const dog = cfg.dogs[dogKey];
  const ratio = dog.kcal/(cfg.dogs.doctor.kcal+cfg.dogs.missy.kcal);
  // 内脏：两种周每天总量相同 = 一套鸡内脏 400g ÷ 14天；猪肝周再受 Missy 铜关注线封顶
  const chickenRaw = Object.values(cfg.organ.chicken).reduce((a,b)=>a+b,0);
  let organDayBoth = chickenRaw/14;
  let organG = organDayBoth*ratio;
  const rec = type==='pork' ? cfg.organ.pork : cfg.organ.chicken;
  const P = per100(F, rec).per100;
  if(type==='pork'){
    // 按 Missy 的关注线算出两只狗共同的封顶，再按热量比分
    const m = cfg.dogs.missy, mRatio = m.kcal/(cfg.dogs.doctor.kcal+m.kcal);
    const cuCap = cuLim(m)*m.kcal/1000;
    const V = vegPer100(F,cfg.veg), vegMax = m.vegMaxG||0;
    const cuOther = others.missyCuOther + V.cu*vegMax/100;   // Missy 当天来自肉、碳水、鱼、蛋、菜的铜（菜按上限估）
    const missyMax = Math.max(0,(cuCap - cuOther)/P.cu*100);
    const bothMax = missyMax/mRatio;
    organDayBoth = Math.min(organDayBoth, bothMax);
    organG = organDayBoth*ratio;
  }
  return {organG, organType:type, organPer100:P};
}

// 鸡蛋：单独给时按指定的星期几；和菜泥一起打时每天都吃，一周总量不变
function eggPlan(cfg, key){
  if(cfg.dogs[key] && cfg.dogs[key].noEgg) return {days:new Set(), g:0};
  const days = cfg.egg.days[key]||[], g = cfg.egg.g[key]||0;
  if(cfg.eggInVeg) return {days:new Set([0,1,2,3,4,5,6]), g: g*days.length/7};
  return {days:new Set(days), g};
}

// 鸡蛋：恢复期可以只给蛋白、或蛋白加一部分蛋黄（cfg.eggParts = {white, yolk}，按计划蛋量的比例）
const EGG_WHITE='蛋白(熟)', EGG_YOLK='蛋黄(熟)', EGG_WF=0.64, EGG_YF=0.36;
function eggPut(cfg, g, fn){
  if(!(g>0)) return;
  const P = cfg.eggParts;
  if(!P) return fn(cfg.egg.name, g);
  if(P.white>0) fn(EGG_WHITE, g*EGG_WF*P.white);
  if(P.yolk>0)  fn(EGG_YOLK,  g*EGG_YF*P.yolk);
}

// 菜泥轮换：一批吃 2 天，一批以一种菜为主，5 批（10 天）一轮。
// 黄瓜、南瓜纤维太少，单独做两天要 400 g，超过辅食机；按 4:1 搭一点菠菜（镁多、纤维多），量降到 240 g 左右。
const VEG_ROTATION = [
  {'西葫芦(生)':1},
  {'南瓜(生)':1,'菠菜(生)':0.25},
  {'丝瓜(生)':1},
  {'黄瓜(生)':1,'菠菜(生)':0.25},
  {'娃娃菜(生)':1},
];
const VEG_DAYS = 2, VEG_MAX_RAW = 300;
const VEG_MEALS = 1;           // 菜泥只在晚餐给一次：纤维上限按一餐算
const vegKey = mix => Object.keys(mix||{}).filter(n=>mix[n]>0).sort().join('|');
function vegRotIndex(mix){ const k=vegKey(mix); return k ? VEG_ROTATION.findIndex(m=>vegKey(m)===k) : -1; }
// 上一批之后的 n 批；上一批不在轮换里（或没有）就从第一组开始
function vegRotNext(lastMix, n){
  const i = vegRotIndex(lastMix), L = VEG_ROTATION.length, out = [];
  for(let j=0;j<(n||1);j++) out.push(Object.assign({}, VEG_ROTATION[(i<0 ? j : i+1+j)%L]));
  return out;
}

// 菜泥配比每100g（含吸收率折算）
function vegPer100(F, mix){
  const tot=Object.values(mix).reduce((a,b)=>a+b,0)||1, t=zero();
  for(const n in mix) addFood(t,F,n,mix[n]/tot*100);
  return t;
}

// 鱼：按维D 达到 1.3 倍定克数（扣掉蛋、肉、内脏已有的维D）
function fishGrams(F, cfg, dogKey, vdOtherWeek){
  const dog=cfg.dogs[dogKey], need = needFor('vitd', dog.kcal*7, dog)*MARGIN;
  const gWeek = Math.max(0,(need - vdOtherWeek))/F[cfg.fish].vitd*100;
  return gWeek/7;
}

// 碘片（整片）：至少够需要量；目标 1.3 倍时取最接近的整片，不向上凑——一般落在 300–400 μg/1000 kcal
function iodineTabs(need, have, perK){
  const gap = x => Math.max(0, need*x - have)/SUPP.i.ugPerTab;
  const mult = (perK!=null && need > perK*1.0001) ? Math.max(1, perK*MARGIN/need) : MARGIN;   // 按体重口径已是保守值，不再乘 1.3
  return Math.max(Math.ceil(gap(1)-1e-9), Math.round(gap(mult)));
}
// ───────────────────────── 周计划 ─────────────────────────
// 返回该自然周每天、每只狗的计划克数 + 本周药盒
// 冻干内脏模式：每天给冻干牛肝（铜、维A、B12）+ 冻干兔血（铁），克数按缺口算
// 冻干内脏模式：每天给冻干牛肝（铜、维A、B12）+ 冻干兔血（铁），可选蒸鸡肝（胆碱；铜很少）
// 鸡肝按生重算：胆碱补到 1.1 倍；再按扣掉鸡肝后的缺口算冻干牛肝（铜受 Missy 上限约束）；最后兔血补铁
const CLIVER = '鸡肝(生)';
const CL_KCAL_MAX = 0.10;      // 鸡肝最多占当天热量的 10%
function fdDoses(F, cfg, P0){
  const L = F[cfg.organ.fd], B = F[cfg.organ.blood], out = {liver:{}, blood:{}, cliver:{}};
  const r05 = x => Math.round(x*2)/2, f05 = x => Math.floor(x*2+1e-9)/2;
  const per = n => F[n] ? addFood(zero(), F, n, 100) : null;      // 每 100 g（含损失系数）
  const Lp = per(cfg.organ.fd), Bp = per(cfg.organ.blood), Cp = per(CLIVER);
  for(const k of ['doctor','missy']){
    const dog = cfg.dogs[k], kc = dog.kcal, ds = Object.values(P0.dogs[k].days).map(r=>r.tAll);
    const avg = n => ds.reduce((a,t)=>a+t[n],0)/ds.length, mx = n => Math.max(...ds.map(t=>t[n]));
    const need = n => needFor(n, kc, dog, 1);
    const capCu0 = (dog.cuSoft ? cuLim(dog) : 2*CU_SOFT)*kc/1000 - mx('cu');
    const want = !cfg.noOrgan && Cp ? (dog.cliver||0) : 0;
    // 铜关注线收紧的狗（cuRA<1.5，Missy 1.2）：铜目标 1.05 倍，按预期值卡上限（不再留 35% 的最坏余量，否则会低于推荐量）
    const tight = dog.cuSoft && dog.cuRA && dog.cuRA < 1.5;
    let gL = 0, gC = 0;
    for(let it=0; it<3; it++){
      // 冻干牛肝：扣掉鸡肝已经给的
      if(L && !cfg.noOrgan){
        const g = n => Lp[n]>0 ? Math.max(0, (n==='cu' && tight ? 1.05 : MARGIN)*need(n) - avg(n) - (Cp?Cp[n]*gC/100:0))/Lp[n]*100 : 0;
        let x = Math.max(g('cu'), g('vita_retinol'), g('b12'));
        const gCap = Math.max(0, capCu0 - (Cp?Cp.cu*gC/100:0))/(Lp.cu*(tight ? 1 : FD_LIVER_CU_WORST))*100;
        gL = Math.min(tight ? Math.ceil(x*2-1e-9)/2 : r05(x), f05(gCap));   // 铜收紧的狗目标只有 1.05 倍，向上取到 0.5 g，免得四舍五入后低于推荐量
        if(cfg.organScale!=null && cfg.organScale<1) gL = r05(gL*cfg.organScale);
      }
      // 蒸鸡肝：胆碱补到 1.1 倍；维A 不超过上限的一半
      if(want>0){
        let x = Math.max(0, 1.1*need('cho') - avg('cho') - Lp.cho*gL/100)/Cp.cho*100;
        const aCap = Math.max(0, 0.5*AAMAX.vita_retinol*kc/1000 - mx('vita_retinol') - Lp.vita_retinol*gL/100)/Cp.vita_retinol*100;
        gC = Math.round(Math.min(x, aCap, CL_KCAL_MAX*kc/F[CLIVER].kcal*100)*want);
      }
    }
    let gB = 0;
    if(B && !cfg.noBlood){
      const fe1 = avg('fe') + Lp.fe*gL/100 + (Cp?Cp.fe*gC/100:0);
      gB = Math.max(0, MARGIN*need('fe') - fe1)/Bp.fe*100;
      gB = Math.min(r05(gB), f05(0.05*kc/B.kcal*100));
      if(cfg.bloodScale!=null && cfg.bloodScale<1) gB = r05(gB*cfg.bloodScale);
    }
    out.liver[k] = gL; out.blood[k] = gB; out.cliver[k] = gC;
  }
  return out;
}
// 每只狗单独的状态：正常 / 拉稀恢复期（热量 −20% 或 −10%，碳水只用大米；其他照常）
const STATUS = {normal:{f:1, n:'正常'}, r20:{f:0.8, n:'恢复期 −20%'}, r10:{f:0.9, n:'恢复期 −10%'}};
function applyStatus(cfg){
  const c = JSON.parse(JSON.stringify(cfg));
  for(const k of ['doctor','missy']){
    const d = c.dogs[k], st = STATUS[d.status] || STATUS.normal;
    d.kcalNormal = d.kcal;
    if(st.f!==1){ d.kcal = d.kcal*st.f; d.riceOnly = true; }
  }
  return c;
}
// 某只狗用的配置：恢复期只用大米
function dogCfg(cfg, key){ return cfg.dogs[key].riceOnly ? Object.assign({}, cfg, {carb:'大米(干)', carb2:''}) : cfg; }
// 换成某种肉时，这只狗一周吃到多少（其他东西按 rows 不变，肉和碳水重新解）。药盒、拌饭的油都按“哪种肉都够”定
function weekWithMeat(F, cfg, rows, key, meat, days){
  const dog = cfg.dogs[key], cK = dogCfg(cfg, key), parts = carbParts(F, cK);
  const dryFr = parts.filter(([n])=>F[n] && F[n].basis==='dry').reduce((a,[,fr])=>a+fr, 0);
  let wk = zero(), dry = 0, caNeed = 0;
  days.forEach((d,i)=>{
    const g = rows[d].g, t = zero();
    for(const n in g){ const c = F[n]&&F[n].cat; if(c!=='protein' && c!=='carb') addFood(t,F,n,g[n]); }
    addSupp(t,{foCap:foOnIdx(dog,i)});
    const cM = Object.assign({}, cK, {meat}), sol = solveMain(F,cM,key,t,mealKcal(cfg,key,d));
    addFood(t,F,meat,sol.gM); addCarbs(t,F,cK,sol.gC);
    dry += sol.gC*dryFr;
    caNeed += Math.max(AAFCO.ca*dog.kcal/1000, t.ph*CAP_TARGET, Math.min(RA_CA_MBW*Math.pow(+dog.wkg||0,0.75), t.ph*CAP_MBW_MAX)) - t.ca;
    wk = sumT(wk, t);
  });
  return {wk, dry, caNeed};
}
function suppMeats(F, cfg){ return [...new Set([cfg.meat].concat(cfg.caMeats || Object.keys(F).filter(n=>F[n].cat==='protein')))].filter(n=>F[n]); }
function planWeek(F, cfg, wsDate, opt){
  opt = opt||{}; setFo(cfg);
  if(!opt.boxFrom && cfg.boxLock && cfg.boxLock[wsDate]) return planWeek(F, cfg, wsDate, Object.assign({}, opt, {boxFrom:cfg.boxLock[wsDate]}));
  // 恢复期：药盒是按周提前装好的，所以整格照常给——补充剂按正常热量那份算
  if(!opt.boxFrom && ['doctor','missy'].some(k=>cfg.dogs[k].riceOnly)){
    const cn = JSON.parse(JSON.stringify(cfg));
    for(const k of ['doctor','missy']){ const d=cn.dogs[k]; if(d.riceOnly){ d.kcal = d.kcalNormal||d.kcal; d.riceOnly=false; } }
    const Pn = planWeek(F, cn, wsDate, opt), boxFrom = {};
    for(const k of ['doctor','missy']) if(cfg.dogs[k].riceOnly) boxFrom[k] = {box:Pn.dogs[k].box, suppWeek:Pn.dogs[k].suppWeek};
    return planWeek(F, cfg, wsDate, Object.assign({}, opt, {boxFrom}));
  }
  // 葡萄籽油（拌在米饭里）。整锅一个比例（每克干碳水几克油），比例取下面两者较大的：
  //  ① 亚油酸：每种肉都算缺口，取平均（身体能存，轮换吃几周平均够），乘分档（¼/½/全量）
  //  ② “跟锅走”的狗（oilExtra 不为 true）的脂肪下限 fatMinG：按这周的肉算差多少油（Missy 分步提到 15、18 g）
  // 单独加油的狗（oilExtra:true，Doctor）：米饭里吃到的油之外，脂肪还差的单独加（同样乘分档）
  const stage = OIL_STAGE[cfg.oilStage||0] || 0;
  if(!opt.oilFixed && F[OIL]){
    const anyPotFat = ['doctor','missy'].some(k=>cfg.dogs[k].fatMinG && !cfg.dogs[k].oilExtra);
    if(!stage && !anyPotFat){ return planWeek(F, cfg, wsDate, Object.assign({}, opt, {oilFixed:{doctor:0,missy:0}})); }
    const P0 = planWeek(F, cfg, wsDate, Object.assign({}, opt, {oilFixed:{doctor:0,missy:0}}));
    const oi = F[OIL], days7 = range(wsDate, addDays(wsDate,6)), meats = suppMeats(F, cfg);
    const dryIn = (P,k) => { const r = P.dogs[k].days[wsDate]; return r ? Object.entries(r.g).filter(([n])=>F[n] && F[n].cat==='carb' && F[n].basis==='dry').reduce((a,[,g])=>a+g,0) : 0; };
    const avgF = (P,k) => { const ds = Object.values(P.dogs[k].days).map(r=>r.tAll); return ds.reduce((a,t)=>a+t.f,0)/ds.length; };
    let ratioLA = 0; const noDry = {doctor:0, missy:0};
    for(const k of ['doctor','missy']){ const kc = cfg.dogs[k].kcal; let sumR = 0, nR = 0;
      for(const m of meats){ const W = weekWithMeat(F, cfg, P0.dogs[k].days, k, m, days7);
        const gap = Math.max(0, AAFCO.la*kc/1000*7*LA_TARGET - W.wk.la)/(oi.la/100);
        if(W.dry > 0){ sumR += gap/W.dry; nR++; } else noDry[k] = Math.max(noDry[k], gap/7); }
      if(nR) ratioLA = Math.max(ratioLA, sumR/nR); }
    let ratio = ratioLA*stage, potFat = false;
    for(const k of ['doctor','missy']){ const dog = cfg.dogs[k]; if(!dog.fatMinG || dog.oilExtra) continue;
      const d0 = dryIn(P0,k); if(!(d0>0)) continue;
      const g = Math.max(0, dog.fatMinG*dog.kcal/1000 - avgF(P0,k))/(oi.f/100)*1.04;
      if(g/d0 > ratio){ ratio = g/d0; potFat = true; } }
    const inRice = {}, extra = {doctor:0, missy:0}, O = {};
    const drop = cfg.oilMode==='drop';
    for(const k of ['doctor','missy']){ const d0 = dryIn(P0,k), rK = (drop && cfg.dogs[k].oilExtra) ? ratioLA*stage : ratio; inRice[k] = Math.round((d0>0 ? rK*d0 : noDry[k]*stage)*100)/100; }
    // 单独加油的狗：米饭里的油之外还差的脂肪
    if(['doctor','missy'].some(k=>cfg.dogs[k].fatMinG && cfg.dogs[k].oilExtra)){
      const P1 = planWeek(F, cfg, wsDate, Object.assign({}, opt, {oilFixed:inRice}));
      for(const k of ['doctor','missy']){ const dog = cfg.dogs[k]; if(!dog.fatMinG || !dog.oilExtra) continue;
        const ds = Object.values(P1.dogs[k].days).map(r=>r.tAll), kc = dog.kcal;
        let g = Math.max(0, dog.fatMinG*kc/1000 - avgF(P1,k))/(oi.f/100);
        if(dog.fatMaxG) g = Math.min(g, Math.max(0, (dog.fatMaxG*kc/1000 - Math.max(...ds.map(t=>t.f)))/(oi.f/100)));
        extra[k] = Math.ceil(g*Math.max(stage, potFat?1:0)/0.05 - 1e-9)*0.05; } }
    for(const k of ['doctor','missy']) O[k] = Math.round((inRice[k] + extra[k])*100)/100;
    const P = planWeek(F, cfg, wsDate, Object.assign({}, opt, {oilFixed:O}));
    // 整锅比例按最终计划算（油有热量，米饭会少一点点）：以只吃米饭里油的狗为准
    const plain = ['doctor','missy'].filter(k=>!(cfg.dogs[k].fatMinG && cfg.dogs[k].oilExtra) && dryIn(P,k)>0);
    const perG = plain.length ? Math.max(...plain.map(k=>O[k]/dryIn(P,k))) : ratio;
    for(const k of ['doctor','missy']){
      if(!(cfg.dogs[k].fatMinG && cfg.dogs[k].oilExtra) || !(dryIn(P,k)>0)){ inRice[k] = O[k]; extra[k] = 0; continue; }
      inRice[k] = Math.min(O[k], perG*dryIn(P,k)); extra[k] = Math.max(0, O[k]-inRice[k]); if(extra[k]<0.03){ inRice[k] = O[k]; extra[k] = 0; } }
    if(drop){ for(const k of ['doctor','missy']){ extra[k] = O[k]; inRice[k] = 0; } }
    P.oil = {perDay:O, stage:cfg.oilStage||0, perGramDryCarb: drop ? 0 : perG, drop, inRice, extra, potFat, laRatio: ratioLA*stage}; return P;
  }
  if(cfg.organMode==='fd' && !opt.fdFixed){
    const zero2 = {liver:{doctor:0,missy:0}, blood:{doctor:0,missy:0}, cliver:{doctor:0,missy:0}};
    const P0 = planWeek(F, cfg, wsDate, Object.assign({}, opt, {fdFixed:zero2}));
    // 鸡肝半量 = 全量（含补足）的一半：先都按全量算
    const cfgFull = JSON.parse(JSON.stringify(cfg));
    for(const k of ['doctor','missy']) if((cfg.dogs[k].cliver||0)>0) cfgFull.dogs[k].cliver = 1;
    const D = fdDoses(F, cfgFull, P0);
    let P = planWeek(F, cfgFull, wsDate, Object.assign({}, opt, {fdFixed:D}));
    // 鸡肝本身有热量，会挤掉一部分肉（控脂的狗挤得更多），胆碱可能又不够了：按实际结果补一两轮
    const Cp = F[CLIVER] ? addFood(zero(), F, CLIVER, 100) : null;
    for(let it=0; it<3 && Cp; it++){
      let changed = false;
      for(const k of ['doctor','missy']){
        const want = cfgFull.noOrgan ? 0 : (cfgFull.dogs[k].cliver||0); if(!(want>0)) continue;
        const ds = Object.values(P.dogs[k].days).map(r=>r.tAll), kc = cfg.dogs[k].kcal;
        const avgN = n => ds.reduce((a,t)=>a+t[n],0)/ds.length, needN = n => needFor(n, kc, cfg.dogs[k], 1);
        const add = Math.max(0, (needN('cho')*1.1 - avgN('cho'))/Cp.cho, (needN('fol')*MARGIN - avgN('fol'))/Cp.fol, (needN('b12')*MARGIN - avgN('b12'))/Cp.b12)*100;
        if(add < 0.5) continue;
        const aRoom = Math.max(0, 0.5*AAMAX.vita_retinol*kc/1000 - Math.max(...ds.map(t=>t.vita_retinol)))/Cp.vita_retinol*100;
        const g2 = Math.min(D.cliver[k] + Math.ceil(Math.min(add, aRoom)), Math.max(D.cliver[k], Math.floor(CL_KCAL_MAX*kc/F[CLIVER].kcal*100)));
        if(g2 !== D.cliver[k]){ D.cliver[k] = g2; changed = true; }
      }
      if(!changed) break;
      P = planWeek(F, cfgFull, wsDate, Object.assign({}, opt, {fdFixed:D}));
    }
    let partial = false;
    for(const k of ['doctor','missy']){ const w = cfg.dogs[k].cliver||0; if(w>0 && w<1){ D.cliver[k] = Math.round(D.cliver[k]*w); partial = true; } }
    if(partial) P = planWeek(F, cfg, wsDate, Object.assign({}, opt, {fdFixed:D}));
    P.fd = D; return P;
  }
  const days = range(wsDate, addDays(wsDate,6));
  const fdMode = !!opt.fdFixed;
  const type = fdMode ? 'fd' : (opt.type || organTypeOfWeek(cfg, wsDate));
  const fdG = fdMode ? opt.fdFixed.liver : (type==='chicken' && !opt.noFd && !cfg.noFd && !cfg.noOrgan) ? fdPerDay(F,cfg,wsDate) : {doctor:0,missy:0};
  const bloodG = fdMode ? opt.fdFixed.blood : {doctor:0,missy:0};
  const clG = fdMode && opt.fdFixed.cliver ? opt.fdFixed.cliver : {doctor:0,missy:0};
  const oilG = opt.oilFixed || {doctor:0,missy:0};
  const elmOf = k => F[ELM] ? (cfg.dogs[k].elmG||0) : 0;      // 滑榆皮：饭前给，计入热量和纤维
  const V = vegPer100(F,cfg.veg), vegTot=Object.values(cfg.veg).reduce((a,b)=>a+b,0)||1;
  const out = {weekStart:wsDate, organType:type, dogs:{}};

  for(const key of ['doctor','missy']){
    const dog = cfg.dogs[key], cK = dogCfg(cfg, key);
    const foG = foWeek(dog)/7*SUPP.fo.gPerCap;     // 平均每天的鱼油克数
    const foOn = d => foOnIdx(dog, days.indexOf(d));
    out.dogs[key] = {days:{}};

    // 第一遍：不含鱼、不含猪肝封顶，先估肉碳水 → 得到维D、铜的“其他来源”
    const EP = eggPlan(cfg, key), eggDays = EP.days, eggG = EP.g;
    const draft = (fishG, organG, organP) => days.map(d=>{
      const t = zero();
      if(eggDays.has(weekdayOf(d))) eggPut(cfg, eggG, (n,x)=>addFood(t,F,n,x));
      addFood(t,F,cfg.fish,fishG);
      if(organG){ for(const k in organP) if(k!=='kcal') t[k]+=organP[k]*organG/100; }
      addFood(t,F,cfg.organ.fd,fdG[key]);
      if(bloodG[key]) addFood(t,F,cfg.organ.blood,bloodG[key]);
      if(clG[key]) addFood(t,F,CLIVER,clG[key]);
      if(oilG[key]) addFood(t,F,OIL,oilG[key]);
      if(elmOf(key)) addFood(t,F,ELM,elmOf(key));
      addSupp(t,{foCap:foOn(d)});
      // 菜泥按纤维余量（先假设碳水贡献，下面迭代）
      return {d,t};
    });

    // 迭代：鱼量依赖维D，肉碳水依赖固定项，菜泥依赖碳水纤维
    let fishG = 0, organ = blockTargets(F,cfg,key,'chicken',{missyCuOther:0});
    for(let it=0; it<6; it++){
      // Missy 的铜其他来源：按上一轮估计
      let missyCuOther = 0;
      if(type==='pork' && !fdMode){
        const m='missy', mFish = it===0?0:(out._fishMissy||0);
        // 有蛋、没蛋的天都算一遍，取铜较高的那天（没蛋的天肉更多）
        const EM = eggPlan(cfg,'missy');
        for(const eg of (EM.days.size===7 ? [EM.g] : [EM.g, 0])){
          const t=zero(); addFood(t,F,cfg.fish,mFish); eggPut(cfg, eg, (n,x)=>addFood(t,F,n,x));
          const cM = dogCfg(cfg,m), sol = solveMain(F,cM,m,t);
          addFood(t,F,cfg.meat,sol.gM); addCarbs(t,F,cM,sol.gC);
          missyCuOther = Math.max(missyCuOther, t.cu);
        }
      }
      organ = blockTargets(F,cfg,key,type,{missyCuOther});
      if(cfg.noOrgan || fdMode) organ = Object.assign({}, organ, {organG:0});
      else if(cfg.organScale!=null && cfg.organScale<1) organ = Object.assign({}, organ, {organG:organ.organG*cfg.organScale});
      const rows = draft(fishG, organ.organG, organ.organPer100);
      let vdOther = 0;
      rows.forEach(r=>{ const sol=solveMain(F,cK,key,r.t);
        const t2=Object.assign(zero(),r.t); addFood(t2,F,cfg.meat,sol.gM); addCarbs(t2,F,cK,sol.gC);
        vdOther += t2.vitd - (F[cfg.fish].vitd*fishG/100); });
      fishG = (cfg.noFish || dog.noFish) ? 0 : fishGrams(F,cfg,key,vdOther)*(cfg.fishScale!=null ? cfg.fishScale : 1);
      if(key==='missy') out._fishMissy = fishG;
    }

    // 定稿每天：菜泥按“本周镁达到目标”定量，每天一样；受纤维上限约束
    const build = (vegG) => {
      let wk = zero(); const rows={};
      days.forEach(d=>{
        const t = zero(), g = {};
        const put=(n,x)=>{ if(x>0){ g[n]=(g[n]||0)+x; addFood(t,F,n,x);} };
        if(eggDays.has(weekdayOf(d))) eggPut(cfg, eggG, put);
        // 鱼块一块 = Doctor 两天的量：Doctor 周六、周一、周三、周五各一块，Missy 每天按块
        if(key==='doctor' && cfg.fishAlt===true) put(cfg.fish, FISH_DAYS.has(weekdayOf(d)) ? 2*fishG : 0);
        else put(cfg.fish, fishG);
        const rec = type==='pork'?cfg.organ.pork:cfg.organ.chicken;
        const rawTot = Object.values(rec).reduce((a,b)=>a+b,0);
        for(const n in rec) put(n, organ.organG*rec[n]/rawTot);
        put(cfg.organ.fd, fdG[key]);
        if(bloodG[key]) put(cfg.organ.blood, bloodG[key]);
        if(clG[key]) put(CLIVER, clG[key]);
        if(oilG[key]) put(OIL, oilG[key]);
        if(elmOf(key)) put(ELM, elmOf(key));
        for(const n in cfg.veg) put(n, vegG*cfg.veg[n]/vegTot);
        addSupp(t,{foCap:foOn(d)});
        const sol = solveMain(F,cK,key,t,mealKcal(cfg,key,d));
        // 健身日：正餐少的热量全部从晚餐扣，所以另算一份“不健身”的肉和碳水，早餐按它给
        const trK = treatKcal(cfg,key,d), sol0 = trK>0 ? solveMain(F,cK,key,t,dog.kcal) : null;
        const parts = carbParts(F,cK);
        put(cfg.meat, sol.gM); for(const [n,fr] of parts) put(n, sol.gC*fr);
        finalize(t);
        const base = sol0 ? Object.assign({[cfg.meat]:sol0.gM}, Object.fromEntries(parts.map(([n,fr])=>[n,sol0.gC*fr]))) : null;
        rows[d] = {g, t, ok:sol.ok, organG:organ.organG, fishG, vegG, fdG:fdG[key], base, pctP:sol.pctP, fatPct:sol.fatPct, fatG:sol.fatG, fatOver:!!sol.fatOver, oilG:oilG[key]};
        wk = sumT(wk,t);
      });
      return {rows, wk};
    };
    const vegCap = dog.noVeg ? 0 : (dog.vegMaxG||0);
    let vegG = 0, B = build(0);
    for(let it=0; it<4; it++){
      const gap = (needFor('mg',dog.kcal*7,dog)*(tgt('mg')+0.02) - (B.wk.mg - V.mg*vegG/100*7))/7;
      vegG = Math.min(vegCap, Math.max(0, gap/V.mg*100));
      B = build(vegG);
    }
    const scale = cfg.vegScale==null ? 1 : cfg.vegScale;   // 菜泥适应期：先给一部分
    if(scale!==1) B = build(vegG*scale);
    out.dogs[key].days = B.rows;
    out.dogs[key].vegCapped = !dog.noVeg && vegG>=vegCap-1e-9 && vegCap<Infinity;
    out.dogs[key].vegFull = vegG;
    const wk = B.wk;
    // ── 本周补充剂（整数片/粒，定位到具体哪天） ──
    const kcW = dog.kcal*7;
    // 钙粉：药盒一周提前装好，但每天的肉可能不一样（磷不同）。
    // 按常用的几种肉逐一算一遍，取需要最多的那个量 → 换哪种肉都够，钙磷比约 1.3–1.6（AAFCO 允许 1–2）
    // 其他补充剂也一样：每种肉都算一遍一周吃到多少，取最缺的那种 → 周中换肉不用动药盒
    const WM = suppMeats(F, cfg).map(m=>weekWithMeat(F, cfg, B.rows, key, m, days));
    const caNeed = Math.max(...WM.map(x=>x.caNeed));
    const maxOver = f => Math.max(0, ...WM.map(x=>f(x.wk)));
    const caPerDay = Math.ceil(Math.max(0,caNeed)/7/SUPP.ca.mgPerG*20)/20;     // 0.05g 一档
    const so = cfg.suppOff ? 0 : 1;
    // 锌：胶囊拆开和这一周的钙粉混匀，平均分 7 天；吸收按七成算
    const znCaps = so*maxOver(w=>Math.max(0, Math.ceil((needFor('zn',kcW,dog)*MARGIN - w.zn)/(SUPP.zn.mgPerCap*ZN_AVAIL_MIX) - 0.25)));
    const znTabs = 0;
    // 盐：钠、氯补到 1.3 倍，也混进钙粉（一周总量，0.05 g 一档）
    const saltW = so*maxOver(w=>Math.ceil(Math.max(0, (needFor('na',kcW,dog)*MARGIN - w.na)/SUPP.salt.naPerG, (needFor('cl',kcW,dog)*MARGIN - w.cl)/SUPP.salt.clPerG)/0.05 - 1e-9)*0.05);
    // 复合维生素B：整片，按 B1/B2/B6/烟酸/泛酸里缺得最多的算，固定在某几天给
    const vbTabs = so*maxOver(w=>Math.max(...['b1','b2'].map(k=>Math.ceil(Math.max(0, needFor(k,kcW,dog)*MARGIN - w[k])/SUPP.vb[k] - 1e-9))));
    // 碘：整片。至少够需要量，目标 1.3 倍取最接近的整片（不向上凑），落在约 300–400 μg/1000 kcal
    // 镁粉：按最缺的那种肉算一周要多少克，乘这只狗的档位（先半量、再全量），称到 0.1 g
    const mgP = MG_PRODUCTS[cfg.mgProduct] || MG_PRODUCTS.now_pow;
    const mgW = so*Math.round(maxOver(w=>Math.max(0, needFor('mg',kcW,dog)*tgt('mg') - w.mg)/SUPP.mg.mgPerG)*(dog.mgStage||0)/mgP.step)*mgP.step;
    const iTabs  = so*maxOver(w=>iodineTabs(needFor('i',kcW,dog), w.i, AAFCO.i*kcW/1000));
    const veCaps = so*maxOver(w=>Math.ceil((veNeed(kcW,foG*7,w.oilg,dog)*MARGIN - w.vite)/SUPP.ve.iuPerCap));
    // 维D：食物（主要是鱼、蛋）不够需要量时才补，按 1.3 倍补到整粒；吃鱼的狗一般是 0
    const vdNeed = needFor('vitd',kcW,dog);
    const vdCaps = so*maxOver(w=> w.vitd < vdNeed ? Math.ceil((vdNeed*MARGIN - w.vitd)/SUPP.vd.iuPerCap) : 0);
    const box = {};
    days.forEach(d=>box[d]={caG:caPerDay, iTab:0, znTab:0, znMg:znCaps*SUPP.zn.mgPerCap/7, saltG:saltW/7, mgG:mgW/7, vbTab:0, veCap:0, vdCap:0, tauCap:(dog.tauPerDay||0), foCap:foOn(d), ext:Object.assign({}, dog.boxExtras||{})});
    spreadEven(days, box, 'iTab', iTabs);
    spreadEven(days, box, 'vbTab', vbTabs);      // 复合B 整片，尽量隔开放在不同的天
    spread(days, box, 'veCap', veCaps, [cfg.supp.veDay]);
    spread(days, box, 'vdCap', vdCaps, (cfg.supp.vdDays||[1,4]).slice(0, Math.max(1,vdCaps)));
    const BF = opt.boxFrom && opt.boxFrom[key];
    if(BF) days.forEach(d=>{ box[d] = Object.assign({}, BF.box[d]); });
    out.dogs[key].box = box;
    out.dogs[key].suppWeek = BF ? Object.assign({}, BF.suppWeek) : {caPerDay, znTabs, znCaps, saltW, mgW, vbTabs, iTabs, veCaps, vdCaps};
    days.forEach(d=>{ const r=out.dogs[key].days[d]; r.tAll = finalize(addSupp(Object.assign(zero(),r.t), Object.assign({},box[d],{foCap:0}))); });
  }
  delete out._fishMissy;
  return out;
}

// 鸡内脏周掺多少冻干内脏补铜：
// 一个“鸡周+猪周”的两周里，铜平均达到 1.3 倍；Missy 每天不超过铜关注线。
// 两只狗按热量比分（内脏块统一配方，Doctor 1 块、Missy 2 块）。
function fdPerDay(F, cfg, wsDate){
  const FD = F[cfg.organ.fd]; if(!FD || !FD.cu) return {doctor:0,missy:0};
  const kD=cfg.dogs.doctor.kcal, kM=cfg.dogs.missy.kcal;
  if(cfg.organ.fdBatchG!=null){
    const perDay = cfg.organ.fdBatchG/14;
    return {doctor:perDay*kD/(kD+kM), missy:perDay*kM/(kD+kM)};
  }
  const avgCu = (P,k)=>{let c=0,n=0;for(const d in P.dogs[k].days){c+=P.dogs[k].days[d].tAll.cu;n++}return c/n};
  const maxCu = (P,k)=>Math.max(...Object.values(P.dogs[k].days).map(r=>r.tAll.cu));
  const Pc = planWeek(F,cfg,wsDate,{type:'chicken',noFd:true});
  const Pp = planWeek(F,cfg,wsDate,{type:'pork'});
  // 以 Missy 为准算每千卡的剂量（她有关注线），Doctor 同比例
  const m='missy', need=needFor('cu',kM,cfg.dogs.missy,1);
  const want = Math.max(0, 2*MARGIN*need - avgCu(Pc,m) - avgCu(Pp,m));
  const cap  = Math.max(0, cuLim(cfg.dogs.missy)*kM/1000 - maxCu(Pc,m));
  const gM = Math.min(want,cap)/FD.cu*100;
  return {doctor:gM*kD/kM, missy:gM, capped: want>cap};
}

// 把 n 片平均撒在 7 天里：每天 floor(n/7) 片，余下的隔开放
function spreadEven(days, box, field, n){
  const base=Math.floor(n/7), extra=n%7;
  days.forEach(d=>box[d][field]+=base);
  for(let j=0;j<extra;j++) box[days[Math.floor(j*7/extra)]][field]+=1;
}
// 把 n 片尽量平均放在优先的星期几；放不下再轮到其他天
function spread(days, box, field, n, prefWd){
  if(n<=0) return;
  const order = [];
  prefWd.forEach(w=>{ const d=days.find(x=>weekdayOf(x)===w); if(d) order.push(d); });
  days.forEach(d=>{ if(!order.includes(d)) order.push(d); });
  // 先每个优先日一片，循环加
  let i=0; const base = prefWd.length;
  while(n>0){ box[order[i % Math.max(base,1)] || order[i%order.length]][field]+=1; n--; i++; }
}

// ───────────────────────── 恢复期 ─────────────────────────
// 清淡饮食：瘦肉 + 白米饭 + 钙粉；按顺序一档一档加回（脂肪少、吃过没问题的在前，蛋黄和鱼在后）。
const RECOVERY_STEPS = [
  {k:'organ', n:'内脏块',          tiers:[0.5,1],      tn:['半量','全量'],            how:'先不放冻干牛肝；半量就是平时一半的量'},
  {k:'supp',  n:'药盒',            tiers:[1],          tn:['碘、锌、维E、维D'],         how:'锌随饭喂；维D 只给不吃鱼的狗；鱼油先不给'},
  {k:'fd',    n:'冻干牛肝',        tiers:[1],          tn:['放回'],                   how:'下一批鸡内脏块里放回去'},
  {k:'veg',   n:'菜泥（西葫芦）',  tiers:[0.25,0.5,1], tn:['25%','50%','全量'],       how:'一次做两天；量少就蒸软用叉子压成泥'},
  {k:'eggw',  n:'蛋白',            tiers:[0.5,1],      tn:['半量','全量'],            how:'白煮蛋只给蛋白，几乎不含脂肪'},
  {k:'eggy',  n:'蛋黄',            tiers:[0.25,0.5,1], tn:['¼','½','全量'],          how:'和蛋白一起给；蛋黄最油，慢慢加'},
  {k:'fish',  n:'鱼块',            tiers:[0.5,1],      tn:['半量','全量 + 鱼油'],     how:'晚餐给；全量时 Doctor 恢复每天的鱼油'},
  {k:'kcal',  n:'热量回到平时',    tiers:null,         tn:null,                       how:'每次加 10%，可以分几次点'},
];
const RECOVERY_GAP = 2;     // 两档之间至少隔几天
// 冻干内脏模式：内脏块换成冻干牛肝，紧接着冻干兔血（Missy 吃过没问题）；去掉“冻干牛肝放回内脏块”
function recSteps(cfg){
  if(!cfg || cfg.organMode!=='fd') return RECOVERY_STEPS;
  const out = [], kcalStep = RECOVERY_STEPS.find(s=>s.k==='kcal');
  for(const s of RECOVERY_STEPS){
    if(s.k==='fd' || s.k==='kcal') continue;
    if(s.k==='organ'){ out.push({k:'organ', n:'冻干牛肝', tiers:[0.5,1], tn:['半量','全量'], how:'晚餐剪碎拌进饭里'});
      out.push({k:'blood', n:'冻干兔血', tiers:[0.5,1], tn:['半量','全量'], how:'补铁，晚餐和牛肝一起给；便便颜色会变深，属正常'}); continue; }
    out.push(s);
    if(s.k==='supp') out.push(kcalStep);      // 先把热量加回来（同样的肉和米饭多一点），再加菜、蛋、鱼
  }
  return out;
}
// 旧版记录（done）不再沿用：从头开始
function recState(cfg){
  const r = cfg.recovery; if(!r) return null;
  if(r.v===2) return {lv:r.lv||{}, hist:r.hist||[]};
  return {lv:{}, hist:[]};
}
function recFrac(st, k, cfg){
  const s = recSteps(cfg).find(x=>x.k===k) || RECOVERY_STEPS.find(x=>x.k===k), n = (st.lv[k]||0);
  return s && n>0 && s.tiers ? s.tiers[Math.min(n, s.tiers.length)-1] : 0;
}
function applyRecovery(cfg){
  const r = cfg.recovery; if(!r || !r.on) return cfg;
  const c = JSON.parse(JSON.stringify(cfg)), st = recState(cfg);
  c.carb = '大米(干)'; c.carb2 = '';
  const n = st.lv.kcal||0;
  const fishFull = recFrac(st,'fish',cfg)>=1;
  for(const k of ['doctor','missy']){
    const normal = cfg.dogs[k].kcal, base = (r.kcal&&r.kcal[k]) || normal;
    c.dogs[k].kcal = Math.min(normal, base*Math.pow(1.1,n));
    if(!fishFull){ c.dogs[k].foCapPerDay = 0; c.dogs[k].foPerWeek = 0; }
  }
  const fo = recFrac(st,'organ',cfg); if(fo>0) c.organScale = fo; else c.noOrgan = true;
  if(cfg.organMode==='fd'){ const fb = recFrac(st,'blood',cfg); if(fb>0) c.bloodScale = fb; else c.noBlood = true; }
  if(!(st.lv.supp>0)) c.suppOff = true;
  if(!(st.lv.fd>0)) c.noFd = true;
  c.vegScale = recFrac(st,'veg',cfg); c.eggInVeg = false;
  const w = recFrac(st,'eggw',cfg), y = recFrac(st,'eggy',cfg);
  if(w>0 || y>0) c.eggParts = {white:w, yolk:y};
  else c.egg = Object.assign({}, c.egg, {g:{doctor:0,missy:0}});
  const ff = recFrac(st,'fish',cfg); if(ff>0) c.fishScale = ff; else c.noFish = true;
  c.inRecovery = true;
  c.recLv = st.lv;
  return c;
}
function kcalDoneOf(cfg, st){
  const r = cfg.recovery, n = st.lv.kcal||0;
  return ['doctor','missy'].every(k=>{ const base=(r.kcal&&r.kcal[k])||cfg.dogs[k].kcal; return base*Math.pow(1.1,n) >= cfg.dogs[k].kcal-0.5; });
}
// 下一档是什么、最早哪天可以加
function recoveryNext(cfg, today){
  const r = cfg.recovery; if(!r || !r.on) return null;
  const st = recState(cfg);
  const last = st.hist.length ? st.hist.map(h=>h.date).sort().pop() : r.start;
  const STEPS = recSteps(cfg);
  const kcalDone = kcalDoneOf(cfg, st);
  let next = STEPS.find(s=>s.tiers ? (st.lv[s.k]||0) < s.tiers.length : !kcalDone);
  const earliest = addDays(last, RECOVERY_GAP);
  let label = '', tier = 0;
  if(next){
    if(next.tiers){ tier = (st.lv[next.k]||0); label = next.n + (next.tiers.length>1 ? ' ' + next.tn[tier] : ''); }
    else label = '热量加 10%';
  }
  return {next, tier, label, earliest, ready: today>=earliest, finished: !next, lv: st.lv, hist: st.hist, kcalDone};
}
// 加一档 / 退一档：返回新的 recovery 对象
function recoveryStep(cfg, today, dir){
  const r = JSON.parse(JSON.stringify(cfg.recovery)), st = recState(cfg);
  r.v = 2; r.lv = Object.assign({}, st.lv); r.hist = st.hist.slice(); delete r.done;
  if(dir>0){
    const N = recoveryNext(cfg, today); if(!N || !N.next) return {r, k:null};
    r.lv[N.next.k] = (r.lv[N.next.k]||0)+1; r.hist.push({k:N.next.k, date:today});
    return {r, k:N.next.k, label:N.label};
  }
  const h = r.hist.pop(); if(!h) return {r, k:null};
  r.lv[h.k] = Math.max(0,(r.lv[h.k]||0)-1); if(!r.lv[h.k]) delete r.lv[h.k];
  return {r, k:h.k};
}
// 菜在适应期（不到全量）时鸡蛋单独给：菜泥里菜少蛋多，而且中途加菜量后蛋菜比例就不对了
function applyVegRamp(cfg){
  const sc = cfg.vegScale==null ? 1 : cfg.vegScale;
  if(!cfg.eggInVeg || sc>=1) return cfg;
  const c = JSON.parse(JSON.stringify(cfg)); c.eggInVeg = false; c.eggHeld = true;
  return c;
}
// 现在吃着的：每一样到哪一档
function recoveryAdded(cfg){
  const st = recState(cfg); if(!st) return [];
  const out = recSteps(cfg).filter(s=>s.tiers && st.lv[s.k]>0).map(s=>s.n + (s.tiers.length>1 ? ' ' + s.tn[Math.min(st.lv[s.k],s.tiers.length)-1] : ''));
  if(st.lv.kcal>0) out.push(kcalDoneOf(cfg, st) ? '热量已回到平时' : `热量加了 ${st.lv.kcal} 次 10%`);
  return out;
}

// ───────────────────────── 实际 + 预测 ─────────────────────────
// logs: { 'YYYY-MM-DD': { doctor:{g:{食材:克}, s:{caG,iTab,znTab,veCap,foCap}}, missy:{...} } }
function dayTotal(F, entry){
  const t = zero(); if(!entry) return t;
  for(const n in (entry.g||{})) addFood(t,F,n,entry.g[n]);
  addSupp(t, entry.s);
  return finalize(t);
}
// “照做了”：把计划写成当天记录
function planToLog(plan, d){
  const r = {};
  for(const key of ['doctor','missy']){
    const p = plan.dogs[key].days[d]; if(!p) continue;
    r[key] = {g:Object.assign({},p.g), s:Object.assign({},plan.dogs[key].box[d]), fromPlan:true};
  }
  return r;
}

// 一段日期内某只狗：已记录的用实际，未来的用计划（today 之后、或今天未记录）
function periodTotals(F, cfg, logs, dogKey, from, to, today, planCache){
  let act = zero(), fc = zero(), nAct=0, nPlan=0;
  for(const d of range(from,to)){
    const L = logs[d] && logs[d][dogKey];
    if(L){ act = sumT(act, dayTotal(F,L)); nAct++; }
    else if(d >= today){
      const ws = weekStart(d);
      const P = planCache[ws] || (planCache[ws]=planWeek(F,cfg,ws));
      fc = sumT(fc, P.dogs[dogKey].days[d].tAll); nPlan++;
    }
  }
  const nDays=range(from,to).length;
  return {act, fc, all:sumT(act,fc), nAct, nPlan, nDays:nAct+nPlan, nMissing:nDays-nAct-nPlan};
}

// ───────────────────────── 检查 ─────────────────────────
function status(k,r){ return r>=tgt(k)-0.005?'ok' : r>=1?'thin' : 'low'; }

function checkDay(F, cfg, dogKey, t, target){
  const dog=cfg.dogs[dogKey], kc=t.kcal||1, out=[], tg = target||dog.kcal;
  out.push({k:'kcal', v:t.kcal, target:tg, s: Math.abs(t.kcal/tg-1)<=0.08?'ok':'warn'});
  const km=t.kmod||kc, pP=t.p*3.5/km*100, pF=t.f*8.5/km*100;
  const pMin = (dog.fatMax || dog.fatMaxG) ? P_FLOOR : pTarget(cfg, dogKey);
  out.push({k:'p', v:pP, unit:'%ME', s: pP>=pMin-3?'ok':'warn'});
  if(dog.fatMaxG){ const fg = t.f/kc*1000;
    out.push({k:'f', v:fg, unit:'g/1000kcal', min:dog.fatMinG||null, max:dog.fatMaxG, s: fg>dog.fatMaxG+0.5 || (dog.fatMinG && fg<dog.fatMinG-0.5) ? 'warn':'ok'}); }
  else out.push({k:'f', v:pF, unit:'%ME', max:dog.fatMax||null, s: (dog.fatMax ? pF>dog.fatMax+0.5 : pF>30)||pF<12?'warn':'ok'});
  const cap = t.ph? t.ca/t.ph : 0;
  out.push({k:'cap', v:cap, s: cap<CAP_MIN||cap>CAP_MAX?'warn':'ok'});
  out.push({k:'fiber', v:t.fiber/dog.meals, unit:'g/餐', s:'info'});
  if(dog.cuSoft){ const lim=cuLim(dog)*dog.kcal/1000;
    out.push({k:'cu', v:t.cu, limit:lim, s: t.cu>lim*1.02?'warn':'ok'}); }
  return out;
}

function checkPeriod(F, cfg, dogKey, P, keys){
  const dog=cfg.dogs[dogKey], kcTot = dog.kcal*P.nDays, foG = foWeek(dog)/7*SUPP.fo.gPerCap*P.nDays;
  return keys.map(k=>{
    const need = k==='vite' ? veNeed(kcTot,foG,P.all.oilg,dog,P.nDays) : needFor(k,kcTot,dog,P.nDays);
    const r = P.all[k]/need;
    const row = {k, ratio:r, target:tgt(k), ratioActual: P.nAct? P.act[k]/(need*P.nAct/P.nDays):null, s:status(k,r)};
    if(AAMAX[k]){ const mx = AAMAX[k]*P.all.kcal/1000; row.ofMax = P.all[k]/mx; if(row.ofMax>0.7) row.s='high'; }
    if(k==='ca'||k==='ph'){ row.cap = P.all.ca/P.all.ph; if(row.s==='thin') row.s='ok';
      if(row.cap<CAP_MIN||row.cap>CAP_MAX) row.s='warn'; }
    return row;
  });
}

// ───────────────────────── 3 个月评估 + 提前提示 ─────────────────────────
const WINDOW = 90;
// 一段时间的总摄入：有记录按记录；过去没记录的天按当时的计划估算；今天以后按计划
function evalTotals(F, cfg, logs, key, from, to, today, cache){
  let all = zero(), nAct=0, nEst=0, nPlan=0;
  for(const d of range(from,to)){
    const L = logs[d] && logs[d][key];
    if(L){ all = sumT(all, dayTotal(F,L)); nAct++; continue; }
    // 过去没记录的天：按本周计划里同一个星期几估算（配方没变时和当时的计划一样）
    const ws = weekStart(d), cws = weekStart(today);
    const P = cache[ws] || cache[cws] || (cache[cws]=planWeek(F,cfg,cws));
    const dd = cache[ws] ? d : addDays(cws, (weekdayOf(d)+1)%7);
    all = sumT(all, P.dogs[key].days[dd].tAll);
    if(d<today) nEst++; else nPlan++;
  }
  return {all, nAct, nEst, nPlan, nDays:nAct+nEst+nPlan};
}
const RANK = {low:5, high:4, nearmax:3, thin:2, soft:1, ok:0};
function judge(cfg, key, T){
  const dog = cfg.dogs[key], kc = T.all.kcal||1, foG = foWeek(dog)/7*SUPP.fo.gPerCap*T.nDays;
  const rows = {};
  for(const k of Object.keys(AAFCO)){
    const need = k==='vite' ? veNeed(kc,foG,T.all.oilg,dog,T.nDays) : needFor(k,kc,dog,T.nDays);
    const needK = k==='vite' ? veNeed(kc,foG,T.all.oilg) : AAFCO[k]*kc/1000, rK = T.all[k]/needK;
    const r = T.all[k]/need, mx = AAMAX[k]!=null ? T.all[k]/(AAMAX[k]*kc/1000) : null;
    let s = SOFT.has(k) ? (r<1?'soft':'ok') : (rK<1?'low' : r<tgt(k)-0.005?'thin':'ok');
    if(mx!=null && mx>1) s='high'; else if(mx!=null && mx>0.85 && s==='ok') s='nearmax';
    rows[k] = {k, r, rK, byW: need > needK*1.0001, mx, s, per1000: T.all[k]/kc*1000, perDay: T.all[k]/T.nDays};
  }
  // 铜：设了关注线的狗，超过推荐量 1.5 倍标出来
  if(dog.cuSoft && rows.cu){ const m2 = T.all.cu/(cuLim(dog)*kc/1000); rows.cu.mx = m2;
    if(m2>1) rows.cu.s='high'; else if(m2>0.9 && rows.cu.s==='ok') rows.cu.s='nearmax'; }
  // 锌铜比
  const zc = T.all.cu ? T.all.zn/T.all.cu : 0;
  rows.zncu = {k:'zncu', r:zc, s: zc<ZNCU_MIN ? 'low' : 'ok'};
  // 纤维占干物质 %（书里胃肠病建议 3–7%）
  const fd = T.all.dm>0 ? T.all.fiber/T.all.dm*100 : 0;
  rows.fibdm = {k:'fibdm', r:fd, s: fd<3 ? 'thin' : fd>7 ? 'nearmax' : 'ok'};
  rows.taurine = {k:'taurine', r: T.nDays ? T.all.taurine/T.nDays : 0, s:'ok'};
  const cap = T.all.ph ? T.all.ca/T.all.ph : 0;
  rows.cap = {k:'cap', r:cap, s: cap<CAP_MIN||cap>CAP_MAX ? 'low' : 'ok'};
  return rows;
}
// 过去 90 天（含今天）+ 照现在的计划吃下去（本周计划）两个角度看；任何一个不够就提前提示
function quarter(F, cfg, logs, key, today, cache){
  const from = addDays(today, -(WINDOW-1));
  const Q = evalTotals(F,cfg,logs,key,from,today,today,cache);
  const ws = weekStart(today), P = cache[ws] || (cache[ws]=planWeek(F,cfg,ws));
  let pt = zero(); for(const d in P.dogs[key].days) pt = sumT(pt, P.dogs[key].days[d].tAll);
  const A = judge(cfg,key,Q), B = judge(cfg,key,{all:pt, nDays:7});
  const rows = Object.keys(A).map(k=>{
    const a=A[k], b=B[k], s = RANK[a.s]>=RANK[b.s] ? a.s : b.s;
    return {k, rQ:a.r, rP:b.r, byW:!!b.byW, mxQ:a.mx, mxP:b.mx, s, why: RANK[b.s]>=RANK[a.s] && b.s!=='ok' ? 'plan' : (a.s!=='ok' ? 'past' : ''),
            perDayP: b.perDay};
  });
  return {rows, n:{act:Q.nAct, est:Q.nEst, days:Q.nDays}, from};
}
// 某种营养素不够时，建议用哪些食材（按每 100 kcal 的含量排，扣掉烹饪损失和吸收率，排除这只狗不吃的）
const SUPP_COVER = {ca:'钙粉', i:'碘片', zn:'锌片', vite:'维E', vitd:'维D 胶囊'};
const TIPS = {
  b1:'猪里脊、鸭胸的 B1 最多；或者在药盒里加复合维生素B',
  b2:'鸭胸、冻干牛肝最多；或者在药盒里加复合维生素B',
  fol:'菜泥（娃娃菜、菠菜、西葫芦）和冻干牛肝；恢复期没有菜时最容易不够',
  la:'鸡肉、兔肉、鸭肉比牛肉多很多；不够的话可以考虑少量南瓜籽粉或葵花籽油（Missy 要慢慢试）',
  ala:'鱼块、少量奇亚籽（麦片里有）',
  epadha:'鱼块；不吃鱼的狗可以考虑少量鱼油（Missy 慎用）',
  mg:'在下面「镁」选半量（药盒混合粉里加甘氨酸镁），一周后再全量；碳水混一部分土豆也有帮助。菜泥补得很少',
  k:'菜泥，或碳水混一部分土豆、芋头（「做饭」页选第二种碳水）',
  cho:'蒸鸡肝（下面「蒸鸡肝」选半量或全量）；牛肉也多一些',
  fe:'鸭胸、牛肉、冻干兔血',
  cu:'冻干牛肝（注意 Missy 的铜上限）、鸭胸',
  b12:'冻干牛肝、牛肉',
  vita_retinol:'冻干牛肝',
  se:'鱼块、冻干牛肾、肉类',
  mn:'菜泥、土豆、芋头',
  na:'不吃菜泥时容易偏低；加一点点食盐就能补，要加的话让 Claude 算好量', cl:'不吃菜泥时容易偏低；加一点点食盐就能补，要加的话让 Claude 算好量',
  b6:'鸡胸、猪里脊', nia:'鸡胸、兔肉', pa:'冻干牛肝、鸭胸',
};
function suggestFor(F, cfg, key, k, n){
  const dog = cfg.dogs[key];
  const ok = d => d && d.kcal>0 && (
    d.cat==='protein' || d.cat==='organ_fd' || d.cat==='blood_fd' ||
    (d.cat==='carb' && !dog.riceOnly) ||
    (d.cat==='veg' && !dog.noVeg) || (d.cat==='fish' && !dog.noFish && !cfg.noFish) || (d.cat==='egg' && !dog.noEgg));
  const per100kcal = name => { const t = addFood(zero(), F, name, 100); return t[k]/F[name].kcal*100; };
  // 只推荐两只狗吃得惯、肠胃温和的：菜只在轮换的几种里选；不推荐蛋白/蛋黄分开、牛肾牛脾、贝类
  const GENTLE_VEG = new Set(VEG_ROTATION.flatMap(m=>Object.keys(m)));
  const list = Object.keys(F).filter(nm=>ok(F[nm]) && !/莓|冻干牛肾|冻干牛脾|蛋白\(|蛋黄\(/.test(nm) && (F[nm].cat!=='veg' || GENTLE_VEG.has(nm)))
    .map(nm=>({nm, v:per100kcal(nm)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0, n||3);
  return {foods:list.map(x=>x.nm), tip: SUPP_COVER[k] ? `药盒里的${SUPP_COVER[k]}会按周自动调整` : (TIPS[k]||'')};
}

// 两只狗一起看：缺口按严重程度加权，能同时补上越多缺口的食材排越前；
// 已经超上限/接近上限的营养素，富含它的食材扣分。药盒会自动调的（钙、碘、锌、维E、维D）不靠食材补。
const GAP_W = {low:3, thin:1, high:-3, nearmax:-1.5};
const FAT_MEAT = 35;
const GLUTEN = /燕麦|麦片|意面|挂面|小麦|大麦/;     // 含麸质的碳水（胃肠敏感的狗不推荐）     // 控脂的狗：肉本身脂肪供能 ≥ 35% 的不推荐
function foodAllowed(F, cfg, dog, nm){
  const d = F[nm]; if(!d || !(d.kcal>0)) return false;
  if(/莓|冻干牛肾|冻干牛脾|蛋白\(|蛋黄\(/.test(nm)) return false;
  if(nm===CLIVER) return !cfg.noOrgan && (dog.cliver||0) < 1;      // 已经全量就由程序定量
  if(nm===cfg.meat || (!dog.riceOnly && (nm===cfg.carb || nm===cfg.carb2)) || (dog.riceOnly && nm==='大米(干)')) return false;   // 已经在吃
  if(d.cat==='protein') return !(dog.fatMax && d.f*8.5/ME(d)*100 >= FAT_MEAT);
  if(d.cat==='carb') return !dog.riceOnly && !(dog.noGluten && GLUTEN.test(nm));
  if(d.cat==='veg') return !dog.noVeg && VEG_ROTATION.some(m=>m[nm]!=null);
  if(d.cat==='fish') return !dog.noFish && !cfg.noFish;
  if(d.cat==='egg') return !dog.noEgg;
  return false;     // 冻干内脏、兔血由程序按铜/铁定量，不靠“多用”
}
function rankFoods(F, cfg, gaps, n){
  const want = gaps.filter(g=>GAP_W[g.s]!=null && !SUPP_COVER[g.k] && AAFCO[g.k]);
  if(!want.some(g=>GAP_W[g.s]>0)) return [];
  const out = [];
  for(const nm of Object.keys(F)){
    const t = addFood(zero(), F, nm, 100), kc = F[nm].kcal; if(!(kc>0)) continue;
    let score = 0, depth = 0; const covers = [], worsens = [];
    for(const g of want){
      const dog = cfg.dogs[g.key]; if(!foodAllowed(F, cfg, dog, nm)) continue;
      const r = t[g.k]/kc*1000/AAFCO[g.k];          // 这种食材每 1000 kcal 含量 ÷ 需要量
      // 换肉、换碳水是“替换”：要比现在用的明显多才算补得上
      const cur = F[nm].cat==='protein' ? [cfg.meat] : F[nm].cat==='carb' ? (dog.riceOnly ? ['大米(干)'] : [cfg.carb, cfg.carb2].filter(x=>x&&F[x])) : [];
      const rCur = cur.length ? Math.max(...cur.map(c=>{ const tc=addFood(zero(),F,c,100); return tc[g.k]/F[c].kcal*1000/AAFCO[g.k]; })) : 0;
      if(GAP_W[g.s]>0 && r>=1.5 && (!cur.length || r >= rCur*1.25)){ score += GAP_W[g.s]; depth += Math.min(r,6); covers.push(g); }
      if(GAP_W[g.s]<0 && r>=1){ score += GAP_W[g.s]; worsens.push(g); }
    }
    if(covers.length && score>0) out.push({nm, score, depth, covers, worsens, cat:F[nm].cat});
  }
  out.sort((a,b)=> b.score-a.score || b.covers.length-a.covers.length || b.depth-a.depth);
  return out.slice(0, n||5);
}

// 总入口：某天的全部指导与检查
function report(F, cfg, logs, today){
  const cache = {}; setFo(cfg);
  const ws = weekStart(today), we = addDays(ws,6), ms = monthStart(today), me = monthEnd(today);
  const plan = cache[ws] = planWeek(F,cfg,ws);
  const res = {today, weekStart:ws, organType:plan.organType, plan, dogs:{}};
  for(const key of ['doctor','missy']){
    const W = periodTotals(F,cfg,logs,key,ws,we,today,cache);
    const M = periodTotals(F,cfg,logs,key,ms,me,today,cache);
    const todayT = logs[today]&&logs[today][key] ? dayTotal(F,logs[today][key]) : plan.dogs[key].days[today].tAll;
    res.dogs[key] = {
      todayPlan: plan.dogs[key].days[today], box: plan.dogs[key].box[today],
      day: checkDay(F,cfg,key,todayT,mealKcal(cfg,key,today)),
      treat: treatKcal(cfg,key,today),
      week: checkPeriod(F,cfg,key,W,WEEKLY_K), weekN:{act:W.nAct,plan:W.nPlan},
      month: checkPeriod(F,cfg,key,M,MONTHLY_K.concat(['se','i'])), monthN:{act:M.nAct,plan:M.nPlan},
      q: (()=>{ const Q = quarter(F,cfg,logs,key,today,cache);
        Q.rows.forEach(r=>{ if(r.s!=='ok' && r.k!=='cap' && r.s!=='high' && r.s!=='nearmax') r.sug = suggestFor(F,cfg,key,r.k); });
        return Q; })(),
      boxAdjust: boxAdjust(F,cfg,logs,key,ws,today,plan),
      meat: meatAdvice(F,cfg,logs,key,today,cache),
      vegCapped: plan.dogs[key].vegCapped,
    };
  }
  return res;
}

// 某天的主力肉（记录里克数最多的蛋白类）
function mainMeat(F, entry){
  let best=null,bg=0; for(const n in (entry&&entry.g)||{}) if(F[n]&&F[n].cat==='protein'&&entry.g[n]>bg){best=n;bg=entry.g[n]}
  return best;
}
// 换肉提示：连续多天、或本月次数多 → 铁（和铜）会不够
function meatAdvice(F, cfg, logs, key, today, cache){
  const ms=monthStart(today), me=monthEnd(today);
  const meatOf = d => (logs[d]&&logs[d][key]) ? mainMeat(F,logs[d][key]) : (d>=today?cfg.meat:null);
  const low = n => n && F[n].fe < LOW_FE;
  // 连续天数：从今天往前数
  let streak=0; for(let d=today; low(meatOf(d)); d=addDays(d,-1)) streak++;
  const monthDays = range(ms,me);
  const lowDone = monthDays.filter(d=>d<today && low(meatOf(d))).length;
  const M = periodTotals(F,cfg,logs,key,ms,me,today,cache);
  const kc = cfg.dogs[key].kcal*M.nDays;
  const dogM = cfg.dogs[key], fe = M.all.fe/needFor('fe',kc,dogM,M.nDays), cu = M.all.cu/needFor('cu',kc,dogM,M.nDays);
  const res = {streak, lowDone, fe, cu, currentLow: low(cfg.meat), suggest:[], switchDays:0};
  if(!res.currentLow && cu>=1.0){ res.warn=false; return res; }
  // 推荐：铁最高的几种常用肉
  const alts = Object.keys(F).filter(n=>F[n].cat==='protein' && F[n].fe>=LOW_FE && F[n].f<7)
               .sort((a,b)=>F[b].fe-F[a].fe);
  res.suggest = alts.slice(0,3);
  // 还能再吃几天这种低铁肉：之后换成首选肉，本月铁仍能到目标（逐天按各自那周的计划算）
  if(alts.length){
    const cAlt = Object.assign({},cfg,{meat:alts[0]}), pc={}, pa={};

  });

  const restBox = rest.reduce((a,d)=>{const b=plan.dogs[key].box[d];a.zn+=b.znTab;a.i+=b.iTab;return a},{zn:0,i:0});

// 营养缺口：两只狗合在一张卡里。红 = 不够/超上限（先解决），黄 = 偏少/接近上限。
// 食材按“能同时补上几个缺口（两只狗合计）”排序，最多 5 种。
const GAP_N = {low:'不够', high:'超上限', nearmax:'接近上限', thin:'偏少'};
const GAP_CLS = {low:'bad', high:'bad', nearmax:'warn', thin:'warn'};
function gapCard(R, cfg){
  const gaps = [];
  for(const k of DOGS) for(const r of R.dogs[k].q.rows) if(GAP_N[r.s]) gaps.push({key:k, k:r.k, s:r.s, r:r.rP});
  if(!gaps.some(g=>Q_BAD.has(g.s) || g.s==='nearmax')) return null;
  const nmOf = k => k==='cap' ? '钙磷比' : C.NM[k];
  const ord = {low:0, high:1, nearmax:2, thin:3};
  const chips = k => gaps.filter(g=>g.key===k).sort((a,b)=>ord[a.s]-ord[b.s]).map(g=>
    `<span class="gchip ${GAP_CLS[g.s]}">${esc(nmOf(g.k))} ${GAP_N[g.s]}${C.SUPP_COVER && C.SUPP_COVER[g.k] ? '<i>药盒</i>' : ''}</span>`).join('');
  const top = C.rankFoods(F, C.applyStatus(cfg), gaps, 5);
  const how = (x) => {
    if(x.nm===C.CLIVER) return '打开「蒸鸡肝」（两只狗设置里点全量）';
    const c = F[x.nm].cat;
    return c==='protein' ? '换成这种肉，或和现在的肉轮换' : c==='carb' ? '碳水换成它，或混一部分' : c==='veg' ? '放进菜泥' : c==='fish' ? '鱼块用它' : c==='egg' ? '单独给' : '';
  };
  const foods = top.length ? `<ol class="gfoods">${top.map(x=>`<li>${x.nm===C.CLIVER?'蒸鸡肝':esc(short(x.nm))}</li>`).join('')}</ol>` : '';
  // 前 5 种都补不上的红色缺口：给文字建议
  const covered = new Set(top.flatMap(x=>x.covers.map(g=>g.key+g.k)));
  const rest = [...new Set(gaps.filter(g=>g.s==='low' && !covered.has(g.key+g.k) && g.k!=='cap').map(g=>g.k))];
  const tips = rest.map(k=>{ const t = C.suggestFor(F, cfg, gaps.find(g=>g.k===k).key, k, 0).tip; return t ? `<div class="note"><b>${esc(nmOf(k))}</b>：${esc(t)}</div>` : ''; }).join('');
  return {cls:'', html:`<b>营养缺口</b><span class="note">（近 3 个月 + 本周计划）</span>
    ${DOGS.filter(k=>gaps.some(g=>g.key===k)).map(k=>`<div class="grow"><span class="who">${DOGN[k]}</span>${chips(k)}</div>`).join('')}
    <div class="note" style="margin-top:4px"><span class="gchip bad sm">红</span>先解决 <span class="gchip warn sm">黄</span>留意 · 标「药盒」的会自动调</div>
    ${foods ? `<div style="margin-top:8px"><b>优先考虑</b><span class="note">（越靠前，能同时补的缺口越多）</span></div>${foods}` : ''}${tips}`,
    act:`<button class="btn small ghost" data-go="dogs">看详情</button>`};
}

// 连续两次称重（隔 2 周以上）都比再之前那次变了 5% 以上、方向相同：建议热量 ±5%
function bodyAdvice(k){
  const L = bodyList(k).filter(x=>x.kg>0); if(L.length<3) return null;
  const a = L[L.length-3], b = L[L.length-2], c = L[L.length-1];

  const rb = b.kg/a.kg-1, rc = c.kg/a.kg-1;
  if(!((rb>=0.05 && rc>=0.05) || (rb<=-0.05 && rc<=-0.05))) return null;
  if(ST.cfg.bodyAdj && ST.cfg.bodyAdj[k] && ST.cfg.bodyAdj[k] >= c.d) return null;
  const f = rc>0 ? 0.95 : 1.05, kc = ST.cfg.dogs[k].kcal;

// 一只狗一天的量怎么分到早餐和晚餐。早餐只有肉和碳水；其他都在晚餐。
// 早餐多给一点肉和碳水，让两餐热量接近（早餐占肉和碳水的比例 s，最多 65%）。健身日少的热量只从晚餐扣。
function mealPlan(P, k, date, nMeals){
  const day = P.dogs[k].days[date];
  const meals = Math.max(1, Math.round(nMeals||2)), base = day.base;
  const kc = n => (F[n] ? (F[n].kcal||0) : 0)/100;
  const oilEx = P.oil ? (P.oil.extra[k]||0) : 0, oilIn = P.oil ? (P.oil.inRice[k]||0) : 0;
  let E = 0; const mc = [];
  for(const n in day.g){ const c = F[n] && F[n].cat;
    if(c==='protein' || c==='carb'){ mc.push(n); continue; }
    if(n===C.OIL || n===C.ELM) continue;
    E += kc(n)*day.g[n]; }
  const g0 = n => (base && base[n]!=null) ? base[n] : (day.g[n]||0);     // 不健身时的量
  const MC0 = mc.reduce((a,n)=>a+kc(n)*g0(n),0) + (oilIn+oilEx)*8.84;
  const s = meals===1 ? 0 : meals===2 ? Math.min(0.65, Math.max(0.5, 0.5 + (MC0>0 ? E/(2*MC0) : 0))) : 1/meals;
  const bf = {}, dn = {};
  for(const n of mc){ bf[n] = g0(n)*s; dn[n] = Math.max(0, (day.g[n]||0) - bf[n]*(meals-1)); }
  const oilEach = meals>1 ? oilEx/meals : oilEx;
  const bfK = mc.reduce((a,n)=>a+kc(n)*bf[n],0) + oilIn*8.84*s + oilEach*8.84;
  const dnK = mc.reduce((a,n)=>a+kc(n)*dn[n],0) + oilIn*8.84*Math.max(0,1-s*(meals-1)) + oilEach*8.84 + E;
  return {meals, s, bf, dn, bfK, dnK, mc, oilEx, oilIn, oilEach};
}

// 每一样：还够几天、什么时候要做
function prepStatus(X){
  const {R, cfg, sheet} = X, out = [], P = R.plan;
  const rd = cfg.inRecovery ? (cfg.recLv||{}) : null;
  const dayG = n => DOGS.reduce((a,k)=>a+(P.dogs[k].days[TODAY].g[n]||0),0);
  const cookItem = (key, name, n) => { const perDay = dayG(n); if(!(perDay>0)) return;
    const B = cookBatch(n);
    if(!B || B.done) return out.push({key, name, level:'now', text:'没有了，今天要做'});
    const left = Math.floor(B.leftDry/perDay+1e-6);
    out.push({key, name, level:left<=1?'soon':'ok', left, text:left<1?'今天吃完，要做新的':left===1?'还够 1 天，明天要做':`还够 ${left} 天，${md(C.addDays(TODAY,left))} 前要做`}); };
  { const c1 = cfg.carb, c2 = (cfg.carb2 && cfg.carb2!==c1) ? cfg.carb2 : '';
    const potG = n => DOGS.filter(k=>!(c2 && cfg.dogs[k].riceOnly)).reduce((a,k)=>a+(P.dogs[k].days[TODAY].g[n]||0),0);
    const perDay = potG(c1) + (c2 ? potG(c2) : 0);
    if(perDay>0){ const B = cookBatch(c1), nm = c2 ? `${short(c1)}+${short(c2)}` : short(c1);
      if(!B || B.done) out.push({key:'carb', name:nm, level:'now', text:'没有了，今天要煮'});
      else { const left = Math.floor(B.leftDry/perDay+1e-6);
        out.push({key:'carb', name:nm, level:left<=1?'soon':'ok', left, text:left<1?'今天吃完，要煮新的':left===1?'还够 1 天，明天要煮':`还够 ${left} 天，${md(C.addDays(TODAY,left))} 前要煮`}); } } }
  cookItem('cl', '蒸鸡肝', C.CLIVER);
  const daysLeftOf = (kind, t) => { const ab = activeBatch(kind, t); return ab ? Math.floor(ab.left/ab.b.perDay+1e-6) : 0; };
  const item = (key, name, paused, left, need, noDate) => {
    let level, text;
    if(paused){ level='paused'; text='恢复期暂停，加回这一步时再做'; }
    else if(left<=0){ level='now'; text='没有了，今天要做'; }
    else if(left<=need){ level='soon'; text=noDate?`还够 ${left} 天，快做下一批`:`还够 ${left} 天，${md(C.addDays(TODAY,left))} 前要做`; }
    else { level='ok'; text=`还够 ${left} 天`; }
    out.push({key, name, level, text, left});
  };
  if(cfg.organMode!=='fd'){ const type = R.organType; item('organ', type==='pork'?'猪肝块':'鸡内脏块', rd && !rd.organ, daysLeftOf('organ', type), 2, true); }
  if(sheet.fish.raw>=1) item('fish', '鱼', rd && !rd.fish, daysLeftOf('fish', null), 2);
  const pureeToday = DOGS.reduce((s,k)=>{ const x = splitDay(P.dogs[k].days[TODAY].g); return s+sum(x.veg)+(cfg.eggInVeg?x.egg:0); },0);
  if(pureeToday>=1) item('veg', cfg.eggInVeg?'菜蛋泥':'菜泥', rd && !rd.veg, daysLeftOf('veg', null), 1);
  // 药盒：一周装一次，装好后这一周不再变
  const L = ST.cfg.boxLoaded||{}, nextWs = C.addDays(R.weekStart,7), wdNow = C.weekdayOf(TODAY);
  if(cfg.inRecovery && cfg.suppOff) out.push({key:'box', name:'药盒', level:'paused', text:'恢复期只单独给钙粉'});
  else if(!(L[R.weekStart] && L[R.weekStart].sw)) out.push({key:'box', name:'药盒', level:'soon', text:'这周的装好后点一下「装好了」，之后这周不再变'});
  else if((wdNow===4||wdNow===5) && !(L[nextWs] && L[nextWs].sw)) out.push({key:'box', name:'药盒', level:'soon', text:`周六前装好下周（${md(nextWs)} 起）`});
  else out.push({key:'box', name:'药盒', level:'ok', text:'这周已装好，不用动'});
  return out;
}

// 复制某只狗今天 / 本月吃的所有食物和补充剂（有记录按记录，没记录按计划）
function intakeOf(k, from, to){
  const cfg = LAST.cfg, logs = LAST.logs, food = {}, sup = {caG:0, iTab:0, znTab:0, znMg:0, saltG:0, vbTab:0, veCap:0, vdCap:0, foCap:0, tauCap:0};
  let nAct=0, nEst=0; const est=[];
  for(const d of C.range(from, to)){
    const L = logs[d] && logs[d][k];
    const e = L || (()=>{ const P = planFor(cfg, d); return {g:P.dogs[k].days[d].g, s:P.dogs[k].box[d]}; })();
    if(L) nAct++; else { nEst++; est.push(d); }
    for(const n in (e.g||{})) food[n] = (food[n]||0) + e.g[n];
    for(const x in ((e.s||{}).ext||{})){ sup.ext = sup.ext||{}; sup.ext[x] = (sup.ext[x]||0) + e.s.ext[x]; }
    for(const x in sup) sup[x] += (e.s&&e.s[x])||0;
  }
  return {food, sup, nAct, nEst, est};
}
function intakeText(k, scope){
  const from = scope==='day' ? TODAY : C.monthStart(TODAY), I = intakeOf(k, from, TODAY);
  const order = ['protein','carb','oil','herb','organ_fd','blood_fd','organ','fish','veg','egg'];
  const names = Object.keys(I.food).filter(n=>I.food[n]>0.05).sort((a,b)=>order.indexOf(F[a].cat)-order.indexOf(F[b].cat));
  const basis = n => (n===C.OIL || n===C.ELM) ? '' : /^冻干/.test(n) ? '（冻干）' : F[n].basis==='dry' ? '（干重）' : F[n].basis==='cooked' ? '（熟重）' : '（生重）';
  const S = I.sup, sl = [];
  if(S.caG) sl.push(`碳酸钙粉 ${S.caG.toFixed(2)} g（钙 ${Math.round(S.caG*C.SUPP.ca.mgPerG)} mg）`);
  if(S.iTab) sl.push(`碘片 ${S.iTab} 片（碘 ${S.iTab*C.SUPP.i.ugPerTab} μg，钾 ${S.iTab*C.SUPP.i.kPerTab} mg）`);
  if(S.znTab) sl.push(`锌片 ${S.znTab} 粒（锌 ${S.znTab*C.SUPP.zn.mgPerTab} mg）`);
  if(S.znMg) sl.push(`锌胶囊粉（混在钙粉里）约 ${g1(S.znMg)} mg 锌`);
  if(S.saltG) sl.push(`${ST.cfg.saltIodized?'加碘':'无碘'}盐 ${S.saltG.toFixed(2)} g（钠 ${Math.round(S.saltG*C.SUPP.salt.naPerG)} mg）`);
  if(S.vbTab) sl.push(`复合维生素B ${S.vbTab} 片（B1 ${S.vbTab*C.SUPP.vb.b1} mg，B2 ${S.vbTab*C.SUPP.vb.b2} mg）`);
  for(const x in (S.ext||{})) if(S.ext[x]>0) sl.push(`${(C.EXTRA[x]||{name:x}).name} ${S.ext[x]} ${(C.EXTRA[x]||{}).unit||''}`);
  if(S.veCap) sl.push(`维生素E ${S.veCap} 粒（${S.veCap*C.SUPP.ve.iuPerCap} IU）`);
  if(S.vdCap) sl.push(`维生素D3 ${S.vdCap} 粒（${S.vdCap*C.SUPP.vd.iuPerCap} IU）`);
  if(S.tauCap) sl.push(`牛磺酸 ${S.tauCap} 粒（${S.tauCap*C.SUPP.tau.mgPerCap} mg）`);
  if(S.foCap) sl.push(`鱼油 ${S.foCap} 粒（EPA+DHA ${S.foCap*C.SUPP.fo.epadhaPerCap} mg）`);
  const head = scope==='day' ? `${DOGN[k]} ${TODAY} 吃的` : `${DOGN[k]} ${from} 至 ${TODAY}（${I.nAct+I.nEst} 天）吃的合计`;
  const note = I.nEst ? (scope==='day' ? '（今天还没记录，按计划）' : `（其中 ${I.nAct} 天有记录，${I.nEst} 天没记录、按计划估算）`) : '';
  return [head+note, '', '食物：', ...names.map(n=>`- ${n}${basis(n)} ${g1(I.food[n])} g`), '', '补充剂：', ...(sl.length?sl.map(x=>'- '+x):['- 无'])].join('\n');
}

const ST_N = {ok:'够', thin:'偏少', low:'不够', high:'接近上限', warn:'注意', info:''};
function meterRow(r){
  const nm = C.NM[r.k]||r.k, scale = 2;
  const w = Math.min(1, r.ratio/scale)*100, t = Math.min(1,(r.target||1)/scale)*100;
  const extra = r.ofMax!=null ? `上限的 ${Math.round(r.ofMax*100)}%` : (r.target&&r.target!==1?`目标 ${r.target} 倍`:'');
  return `<div class="meter"><span class="nm">${esc(nm)}</span>
    <span class="bar" role="img" aria-label="${esc(nm)} ${r.ratio.toFixed(2)} 倍"><span class="fill ${r.s}" style="width:${w}%"></span><span class="tick" style="left:calc(${t}% - 1px)"></span></span>
    <span class="v"><span class="num">${r.ratio.toFixed(2)}</span><span class="unit">倍</span><small>${extra||ST_N[r.s]}</small></span></div>`;
}
function capRow(rows){
  const ca = rows.find(r=>r.k==='ca'); if(!ca) return '';
  const s = ca.cap<1||ca.cap>2?'warn':'ok';
  return `<div class="meter"><span class="nm">钙磷比</span><span class="note">AAFCO 要求 1.0–2.0，目标 1.3</span>
    <span class="v"><span class="num">${ca.cap.toFixed(2)}</span><small><span class="st ${s}">${s==='ok'?'正常':'超出范围'}</span></small></span></div>`;
}
function dayChecks(rows, dog){
  const lab = {kcal:'热量', p:'蛋白质', f:'脂肪', cap:'钙磷比', fiber:'纤维', cu:'铜'};
  return rows.map(r=>{
    let v;
    if(r.k==='kcal') v = `${Math.round(r.v)} kcal`;
    else if(r.k==='f' && r.unit==='g/1000kcal') v = `${r.v.toFixed(1)} g/1000 kcal`;
    else if(r.k==='p'||r.k==='f') v = `${r.v.toFixed(1)}%`;
    else if(r.k==='cap') v = r.v.toFixed(2);
    else if(r.k==='fiber') v = `${r.v.toFixed(2)} g/餐`;
    else if(r.k==='cu') v = `${r.v.toFixed(2)} / ${r.limit.toFixed(2)} mg`;
    return `<div class="field"><span class="l">${lab[r.k]}${r.k==='cu'?'<small>个体关注线</small>':''}${r.k==='f'?`<small>${r.unit==='g/1000kcal'?`兽医给的范围 ${r.min||0}–${r.max} g`:(ST.cfg.dogs[dog]||{}).fatMax?`上限 ${ST.cfg.dogs[dog].fatMax}%${({doctor:'（胆泥）',missy:'（肠胃）'})[dog]||''}`:'12–30% 之间'}</small>`:''}</span><span><span class="num">${v}</span> ${r.s!=='info'?`<span class="st ${r.s==='warn'?'warn':'ok'}">${r.s==='warn'?'注意':'正常'}</span>`:''}</span></div>`;
  }).join('');
}

  add($('#e_meat').value, v('e_meatG'));
  add($('#e_carb').value, v('e_carbG'));
  add($('#e_carb2').value, v('e_carb2G'));
  for(const n in oc) add(n, oc[n]*v('e_org'));
