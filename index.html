  const id = 'b'+Date.now().toString(36);
  let b;
  const share = shareOf(X.cfg);
  if(kind==='organ'){
    const O = sheet.organ, fdG = val('m_fd');
    if(O.fd && fdG>0) recipe[O.fd.name] = fdG;
    const days = O.days;
    b = {id, kind, type, made:TODAY, recipe, fdG: O.fd?fdG:0, days, share, cells: readCells(), total:days, perDay:1};
  } else if(kind==='fish'){
    const Fi = sheet.fish, g = val('m_fishg');
    recipe[Fi.name] = g;
    b = {id, kind, made:TODAY, recipe, days:7, share: (Fi.share && Fi.share.doctor+Fi.share.missy>0.99) ? Fi.share : share, cells: null, cooked: val('m_total')||null, total:7, perDay:1};
  } else {
    const V = sheet.veg, tot = sum(recipe), both = Math.max(1, V.perDay.doctor+V.perDay.missy);
    if(X.cfg.eggInVeg && val('m_egg')>0) recipe['水煮蛋(全蛋)'] = val('m_egg')*50;
    const vegOnly = Object.entries(recipe).filter(([n])=>F[n]&&F[n].cat==='veg').reduce((s,[,g])=>s+g,0);
    const vegBoth = V.perDay.doctor+V.perDay.missy;
    const days = vegBoth>=1 && vegOnly>0 ? Math.max(1, Math.round(vegOnly/vegBoth)) : V.batchDays;
    b = {id, kind, made:TODAY, recipe, days, share, cooked: val('m_total')||null, total:days, perDay:1};
  }
  ST.batches.push(b);
  // 旧批次只留最近 60 天
  const cut = C.addDays(TODAY,-60); ST.batches = ST.batches.filter(x=>x.made>=cut);
  saveCfg(); closeSheet(); render(); toast('这批已记下');
}

/* ───────────── 记录 ───────────── */
function follow(date, quiet){
  const X = LAST, P = planFor(X.cfg, date), logs = X.logs[date]||{};
  const rec = C.planToLog(P, date);
  for(const k of DOGS){ if(!logs[k]) setLog(date, k, Object.assign(rec[k], {at:new Date().toISOString()})); }
  if(!quiet){ render(); toast(`${md(date)} 已记录`); }
}
function undoDay(date){ for(const k of DOGS) setLog(date, k, null); render(); toast('已撤销'); }

/* ───────────── 主渲染 ───────────── */
let LAST = null;
function render(){
  applyFoods();
  const now = C.ds(new Date()); if(now!==TODAY){ TODAY = now; }
  let X;
  try{ X = compute(); }
  catch(e){ $('#view').innerHTML = `<section><div class="err">计算出错：${esc(e.message||e)}。请把这句话发给 Claude。</div></section>`; console.error(e); return; }
  LAST = X;
  paintHdr(X);
  const html = UI.tab==='today'?viewToday(X):UI.tab==='prep'?viewPrep(X):viewDogs(X);
  $('#view').innerHTML = html;
  document.querySelectorAll('#tabs button').forEach(b=>{
    if(b.dataset.tab===UI.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
}
function go(tab){ UI.tab = tab; try{ history.replaceState(null,'','#'+tab) }catch(e){} render(); window.scrollTo(0,0); }

/* ───────────── 事件 ───────────── */
document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-close]'); if(!t) return;
  const d = t.dataset;
  if(d.close && e.target!==t && !e.target.closest('button')) return;   // 只有点到遮罩本身或取消按钮才关
  if(d.close){ closeSheet(); return; }
  if(d.foods){ closeFoods(); return openFoods(); }
  if(d.oilstage!=null){ const v = +d.oilstage; ST.cfg.oilStage = v; ST.cfg.oilStageAt = TODAY; if(v===0) ST.cfg.oilSnooze = true; saveCfg(); render(); toast(`葡萄籽油：${['不加','¼ 档','½ 档','全量'][v]}`); return; }
  if(d.oilsnooze){ ST.cfg.oilSnooze = true; saveCfg(); render(); return; }
  if(d.missyfo){ ST.cfg.dogs.missy.foPerWeek = +d.missyfo; ST.cfg.missyFoAt = TODAY; saveCfg(); render(); toast(`Missy 鱼油：每周 ${d.missyfo} 粒`); return; }
  if(d.boxext && d.who){ const dg = ST.cfg.dogs[d.who]; dg.boxExtras = Object.assign({}, dg.boxExtras||{}); dg.boxExtras[d.boxext] = dg.boxExtras[d.boxext] ? 0 : 1; saveCfg(); render(); return; }
  if(d.missyfat!=null){ const v = d.missyfat==='' ? null : +d.missyfat; ST.cfg.dogs.missy.fatMinG = v; ST.cfg.missyFatAt = TODAY; saveCfg(); render(); toast(v?`Missy 脂肪下限：${v} g/1000 kcal`:'Missy 不设脂肪下限'); return; }
  if(d.missyfatsnooze){ ST.cfg.missyFatSnooze = true; saveCfg(); render(); return; }
  if(d.missyfosnooze){ ST.cfg.missyFoSnooze = true; saveCfg(); render(); return; }
  if(d.foprod){ const from = C.FO_PRODUCTS[ST.cfg.foProduct||'now'], to = C.FO_PRODUCTS[d.foprod];
    if(from.key!==to.key){ for(const k of DOGS){ const dg = ST.cfg.dogs[k], n = dg.foPerWeek!=null ? dg.foPerWeek : (dg.foCapPerDay||0)*7;
        dg.foPerWeek = n>0 ? Math.max(1, Math.round(n*from.epadhaPerCap/to.epadhaPerCap)) : 0; }
      ST.cfg.foProduct = to.key; saveCfg(); render(); toast(`鱼油换成 ${to.name}：Doctor 每周 ${ST.cfg.dogs.doctor.foPerWeek} 粒，Missy ${ST.cfg.dogs.missy.foPerWeek} 粒`); }
    return; }
  if(d.saltiod!=null){ ST.cfg.saltIodized = d.saltiod==='1'; saveCfg(); render(); return; }
  if(d.bcs && d.who){ bodyRecord(d.who, {bcs:d.bcs}); render(); toast(`${DOGN[d.who]}：体况 ${BCS_N[d.bcs]}，已记下`); return; }
  if(d.kcaladj){ const k = d.kcaladj; ST.cfg.dogs[k].kcal = +d.to; ST.cfg.bodyAdj = Object.assign({}, ST.cfg.bodyAdj||{}, {[k]:TODAY}); saveCfg(); render(); toast(`${DOGN[k]} 每天热量改成 ${d.to} kcal`); return; }
  if(d.foodpaste){
    (navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : Promise.reject())
      .then(tx=>{ UI.foodText = tx; UI.foodParse = parseFoodCode(tx); openFoods(); })
      .catch(()=>toast('读不到剪贴板，请长按文本框选「粘贴」'));
    return;
  }
  if(d.foodcheck){ const ta = $('#foodCode'); UI.foodText = ta ? ta.value : ''; UI.foodParse = parseFoodCode(UI.foodText); UI.foodDel = null; refreshFoods(); return; }
  if(d.foodimport){
    const P = UI.foodParse; if(!P || !P.items.length) return;
    const my = Object.assign({}, myFoods()); P.items.forEach(it=>{ my[it.name] = it.d; });
    ST.cfg.foods = my; saveCfg(); applyFoods();
    const n = P.items.length; UI.foodParse = null; UI.foodText = '';
    render(); openFoods(); toast(`已导入 ${n} 种食材`); return;
  }
  if(d.fooddel){ const w = foodUses(d.fooddel); if(w.length){ toast(`正在用作${w.join('、')}，先换成别的再删`); return; } UI.foodDel = d.fooddel; refreshFoods(); return; }
  if(d.fooddel2){
    const my = Object.assign({}, myFoods()); delete my[d.fooddel2];
    ST.cfg.foods = my; UI.foodDel = null; saveCfg(); applyFoods(); render(); refreshFoods(); toast('已删除'); return;
  }
  if(d.tab) return go(d.tab);
  if(d.go) return go(d.go);
  if(d.export) return exportData();
  if(d.follow) return follow(d.follow);
  if(d.followAll){ const X=LAST; C.range(X.R.weekStart, C.addDays(TODAY,-1)).forEach(dd=>{ const l=X.logs[dd]||{}; if(!(l.doctor&&l.missy)) follow(dd,true); }); render(); toast('已按建议补记'); return; }
  if(d.train!=null){
    const tr = ST.cfg.train = Object.assign({days:{}, pct:{doctor:0.1, missy:0.1}}, clone(ST.cfg.train||{}));
    tr.days = Object.assign({}, tr.days);
    if(d.train==='1') tr.days[TODAY]=true; else delete tr.days[TODAY];
    const cut = C.addDays(TODAY,-60); for(const k in tr.days) if(k<cut) delete tr.days[k];
    saveCfg(); render(); toast(d.train==='1'?'今天健身：正餐已减掉零食的热量':'今天不健身'); return;
  }
  if(d.mode){ UI.mode = d.mode; try{ localStorage.setItem('dmk2mode', d.mode) }catch(e){} return render(); }
  if(d.status){
    const on = ST.cfg.recovery && ST.cfg.recovery.on;
    if(d.status==='recovery' && !on){ ST.cfg.recovery = {on:true, start:TODAY, v:2, lv:{}, hist:[], kcal:Object.fromEntries(DOGS.map(x=>[x, Math.round(ST.cfg.dogs[x].kcal*0.85/5)*5]))}; saveCfg(); render(); toast('进入恢复期'); }
    if(d.status==='normal' && on){ ST.cfg.recovery = Object.assign(clone(ST.cfg.recovery), {on:false}); saveCfg(); render(); toast('回到正常饮食'); }
    return;
  }
  if(d.undo) return undoDay(d.undo);
  if(d.edit) return openEdit(d.edit, d.date);
  if(d.saveedit) return saveEdit();
  if(d.clearlog){ setLog(d.date, d.clearlog, null); closeSheet(); render(); toast('已删除'); return; }
  if(d.make) return openMake(d.make);
  if(d.savemake) return saveMake(d.savemake);
  if(d.delbatch){
    if(t.dataset.armed){ ST.batches = ST.batches.filter(b=>b.id!==d.delbatch); saveCfg(); render(); toast('这批已删除'); }
    else { t.dataset.armed='1'; t.textContent='再点一次删除'; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent='删除'; } },4000); }
    return;
  }
  if(d.dog){ UI.dog = d.dog; return render(); }
  if(d.setdog){ UI.setDog = d.setdog; return render(); }
  if(d.thisweek){ ST.cfg.organ.anchor = {week:C.weekStart(TODAY), type:d.thisweek}; ST.cfg.anchorConfirmed = true; saveCfg(); render(); toast('已改为'+TYPE_N[d.thisweek]); return; }
  if(d.veg){
    const n = d.veg, v = nextVeg(), on = v[n]>0;
    if(on){ if(Object.values(v).filter(x=>x>0).length<=1){ toast('至少留一种菜'); return; } delete v[n]; } else v[n]=1;
    ST.cfg.veg = v; ST.cfg.vegAuto = false; saveCfg(); render(); return;
  }
  if(d.organmode){ ST.cfg.organMode = d.organmode; saveCfg(); render(); toast(d.organmode==='fd'?'内脏改用冻干':'内脏改回内脏块'); return; }
  if(d.vegauto){ ST.cfg.vegAuto = true; saveCfg(); render(); toast('菜泥回到建议轮换'); return; }
  if(d.rec){
    const r = ST.cfg.recovery = ST.cfg.recovery ? clone(ST.cfg.recovery) : null;
    if(d.rec==='start'){
      ST.cfg.recovery = {on:true, start:TODAY, v:2, lv:{}, hist:[], kcal:Object.fromEntries(DOGS.map(x=>[x, Math.round(ST.cfg.dogs[x].kcal*0.85/5)*5]))};
      saveCfg(); go('today'); toast('恢复期开始了'); return;
    }
    if(!r) return;
    if(d.rec==='end'){ r.on=false; ST.cfg.recovery=r; if(C.recFrac(C.recState(ST.cfg),'veg')>=1) ST.cfg.vegScale=1; saveCfg(); render(); toast('恢复期结束，回到平时的配方'); return; }
    if(d.rec==='add' || d.rec==='back'){
      const st = C.recoveryStep(ST.cfg, TODAY, d.rec==='add'?1:-1); if(!st.k) return;
      ST.cfg.recovery = st.r;
      if(st.k==='veg'){ const f = C.recFrac(C.recState(ST.cfg),'veg'); if(f>0) ST.cfg.vegScale = f; }
      saveCfg(); render();
      toast(d.rec==='add' ? (st.k==='kcal'?'热量加了 10%':'已加到：'+st.label) : '已退一档'); return;
    }
    return;
  }
  if(d.egginveg){ ST.cfg.eggInVeg = d.egginveg==='1'; saveCfg(); render(); return; }
  if(d.cells) return openCells(d.cells);
  if(d.savecells){ const b=ST.batches.find(x=>x.id===d.savecells); if(b){ b.cells=readCells(); saveCfg(); } closeSheet(); render(); toast('格数已记下'); return; }
  if(d.carbsplit){ ST.cfg.carbSplit = parseFloat(d.carbsplit); saveCfg(); render(); return; }
  if(d.boxweek){ UI.boxWeek = d.boxweek; return render(); }
  if(d.vegscale){ ST.cfg.vegScale = parseFloat(d.vegscale); saveCfg(); render(); return; }
  if(d.boxload){ const ws = d.boxload;
    // 按现在的设置重新算这一周（不带旧的锁），记下来之后这一周就按它锁定
    const c2 = Object.assign({}, LAST.cfg, {boxLock:Object.assign({}, LAST.cfg.boxLock||{}, {[ws]:null})}), P = C.planWeek(F, c2, ws);
    const snap = {at:TODAY, sw:{}}; for(const k of DOGS){ snap[k] = clone(P.dogs[k].box); snap.sw[k] = clone(P.dogs[k].suppWeek); }
    const keep = {}; for(const w in (ST.cfg.boxLoaded||{})) if(w >= C.addDays(LAST.R.weekStart,-7)) keep[w] = ST.cfg.boxLoaded[w];
    ST.cfg.boxLoaded = Object.assign(keep, {[ws]:snap}); saveCfg(); render(); toast('记下了，这一周的药盒不再变'); return; }
  if(d.cooknew){ UI.cookNew = Object.assign({}, UI.cookNew, {[d.cooknew]:true}); render(); return; }
  if(d.mgstage!=null && d.who){ ST.cfg.dogs[d.who].mgStage = +d.mgstage; ST.cfg.dogs[d.who].mgStageAt = TODAY; saveCfg(); render(); toast(`${DOGN[d.who]}：镁${+d.mgstage?(+d.mgstage<1?'半量':'全量')+'，从下一次装药盒开始':'不给'}`); return; }
  if(d.mgprod){ ST.cfg.mgProduct = d.mgprod; saveCfg(); render(); toast(`镁：${C.MG_PRODUCTS[d.mgprod].name}`); return; }
  if(d.oilmode){ ST.cfg.oilMode = d.oilmode; saveCfg(); render(); toast(d.oilmode==='drop'?'葡萄籽油改成每餐另外滴':'葡萄籽油拌进锅里'); return; }
  if(d.vegup && d.who){ ST.cfg.dogs[d.who].vegMaxG = +d.to; ST.cfg.dogs[d.who].vegMaxAt = TODAY; saveCfg(); render(); toast(`${DOGN[d.who]}：菜泥每晚最多 ${d.to} g`); return; }
  if(d.tau!=null && d.who){ ST.cfg.dogs[d.who].tauPerDay = +d.tau; saveCfg(); render(); toast(`${DOGN[d.who]}：牛磺酸${+d.tau?`每天 ${d.tau} 粒，从下一次装药盒开始`:'不给'}`); return; }
  if(d.cliver!=null && d.who){ ST.cfg.dogs[d.who].cliver = parseFloat(d.cliver); saveCfg(); render(); toast(`${DOGN[d.who]}：蒸鸡肝${({0:'不给',0.5:'半量',1:'全量'})[d.cliver]}`); return; }
  if(d.dstatus){ ST.cfg.dogs[d.who].status = d.dstatus; saveCfg(); render(); toast(`${DOGN[d.who]}：${C.STATUS[d.dstatus].n}`); return; }
  if(d.copy){ copyIntake(d.who, d.copy); return; }
  if(d.dogflag){ ST.cfg.dogs[d.who][d.dogflag] = d.val==='1'; if(d.dogflag==='noVeg' && d.val!=='1') ST.cfg.dogs[d.who].vegMaxAt = TODAY; saveCfg(); render(); toast(`${DOGN[d.who]}：${({noEgg:'鸡蛋',noFish:'鱼块',noVeg:'菜泥'})[d.dogflag]}${d.val==='1'?'不吃了':'恢复'}`); return; }
});
document.addEventListener('change', e=>{
  if(e.target.dataset && e.target.dataset.import){ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) importData(f); return; }
  const t = e.target, d = t.dataset;
  if(d.carbsplitsel){ ST.cfg.carbSplit = parseFloat(t.value); saveCfg(); render(); return; }
  if(d.cookdry || d.cooktot){
    const n = d.cookdry || d.cooktot, x = parseFloat(t.value);
    UI.cookDraft = UI.cookDraft||{}; const it = UI.cookDraft[n] = Object.assign({}, UI.cookDraft[n]);
    if(d.cookdry) it.dry = x>0 ? x : 0; else it.total = x>0 ? x : 0;
    if(it.dry>0 && it.total>0){
      const c2 = d.c2 || '', dry2 = c2 ? Math.round(it.dry*(parseFloat(d.r2)||0)) : 0;
      ST.cfg.cook = Object.assign({}, ST.cfg.cook, {[n]: {dry:it.dry, c2, dry2, total:it.total, made:TODAY, perDayDry:parseFloat(d.perday)||0}});
      delete UI.cookDraft[n]; if(UI.cookNew) delete UI.cookNew[n];
      saveCfg(); toast('记下这一批了，吃完前都按它算');
    }
    render(); return;
  }
  if(d.cfg){ ST.cfg[d.cfg] = t.type==='number' ? (parseFloat(t.value)||ST.cfg[d.cfg]) : t.value;
    if(ST.cfg.carb2 && ST.cfg.carb2===ST.cfg.carb) ST.cfg.carb2='';
    saveCfg(); render(); return; }
  if(d.cfg2){ const [a,b] = d.cfg2.split('.'); ST.cfg[a][b] = t.value; saveCfg(); render(); return; }
  if(d.trainpct){ const x=parseFloat(t.value); if(x>=0){ const tr = ST.cfg.train = Object.assign({days:{}, pct:{doctor:0.1, missy:0.1}}, clone(ST.cfg.train||{})); tr.pct = Object.assign({}, tr.pct, {[d.trainpct]: x/100}); saveCfg(); } render(); return; }
  if(d.reck){
    // 输入的是“现在吃多少”：反推恢复期起点（已经加过的几次 10% 保留）
    const x=parseFloat(t.value); if(x>0){ const n = (C.recState(ST.cfg).lv.kcal)||0;
      ST.cfg.recovery = clone(ST.cfg.recovery); ST.cfg.recovery.kcal[d.reck] = x/Math.pow(1.1,n);
      if(x > ST.cfg.dogs[d.reck].kcal) ST.cfg.dogs[d.reck].kcal = x;      // 现在吃的不超过平时的量
      saveCfg(); } render(); return; }
  if(d.dogf){
    const x = parseFloat(t.value); if(!(x>=0)) { render(); return; }
    const who = d.who||UI.setDog;
    // 恢复期里热量已经加回到平时：改“每天热量”时，恢复期也跟着改到新的数（不然会被恢复期的数压住，今天页不变）
    if(d.dogf==='kcal' && ST.cfg.recovery && ST.cfg.recovery.on){
      const before = C.applyRecovery(ST.cfg).dogs[who].kcal, reached = before >= ST.cfg.dogs[who].kcal-0.5;
      if(reached){ const n = (C.recState(ST.cfg).lv.kcal)||0; ST.cfg.recovery = clone(ST.cfg.recovery);
        ST.cfg.recovery.kcal[who] = Math.max(ST.cfg.recovery.kcal[who]||0, x/Math.pow(1.1,n)); }
    }
    ST.cfg.dogs[who][d.dogf] = x;
    if(d.dogf==='vegMaxG') ST.cfg.dogs[who].vegMaxAt = TODAY;
    if(d.dogf==='wkg') bodyRecord(who, {});      // 体重记一笔
    saveCfg(); render(); return;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && EDIT!==null) closeSheet(); if(e.key==='Escape') closeSheet(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
setInterval(()=>{ if(C.ds(new Date())!==TODAY) render(); }, 60000);
window.addEventListener('error', ev=>{ try{ $('#toastHost').innerHTML = `<div class="toast" role="alert">出错了：${esc(ev.message)}</div>` }catch(_){} });

render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
