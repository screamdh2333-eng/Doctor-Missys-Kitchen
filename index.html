<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doctor &amp; Missy 的厨房</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="狗狗厨房">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}</style>
<style>
/* 布局：手机单列。顶部日期条，中间一屏一个任务，底部四个标签。克数用秤读数式的窄体数字。 */
:root{
  --bg:#eef1ec; --card:#fbfcfa; --sunk:#e3e8e1; --line:#cfd8cd;
  --ink:#1d2620; --ink2:#55625a; --ink3:#7d887f;
  --accent:#2d5a4a; --accent-ink:#ffffff; --accent-soft:#d9e6df;
  --doc:#9a5b14; --doc-soft:#f3e4cf;       /* Doctor：喜乐蒂的貂色 */
  --mis:#3b5875; --mis-soft:#dbe4ee;       /* Missy：边牧的石板蓝 */
  --ok:#2f7a45; --ok-soft:#dcefe1; --warn:#a2650b; --warn-soft:#f6e7c9; --bad:#b23a2e; --bad-soft:#f6dcd8;
  --num:"SF Pro Display","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --txt:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --card:#1c2420; --sunk:#232d28; --line:#33403a;
  --ink:#e6ece8; --ink2:#a9b6ae; --ink3:#7f8c85;
  --accent:#7fbfa4; --accent-ink:#0f1a15; --accent-soft:#24392f;
  --doc:#e2a85c; --doc-soft:#3a2c1a; --mis:#97b5d4; --mis-soft:#223040;
  --ok:#7ccf93; --ok-soft:#1f3527; --warn:#e8b45a; --warn-soft:#3a2f17; --bad:#f08e82; --bad-soft:#40211d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --card:#1c2420; --sunk:#232d28; --line:#33403a;
  --ink:#e6ece8; --ink2:#a9b6ae; --ink3:#7f8c85;
  --accent:#7fbfa4; --accent-ink:#0f1a15; --accent-soft:#24392f;
  --doc:#e2a85c; --doc-soft:#3a2c1a; --mis:#97b5d4; --mis-soft:#223040;
  --ok:#7ccf93; --ok-soft:#1f3527; --warn:#e8b45a; --warn-soft:#3a2f17; --bad:#f08e82; --bad-soft:#40211d;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--txt);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}

/* 顶部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:-16px;padding:10px 16px 9px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.top .sub{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--ink2);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.chicken{background:var(--warn-soft);color:var(--warn)}
.pill.pork{background:var(--bad-soft);color:var(--bad)}
.sync{margin-left:auto;font-size:12px;color:var(--ink3)}

/* 标签栏 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:10px 0 11px;font-size:14px;color:var(--ink3);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .dot{position:absolute;top:7px;margin-left:2px;width:7px;height:7px;border-radius:50%;background:var(--bad)}

section{margin-top:18px}
h2{font-size:13px;letter-spacing:.08em;color:var(--ink2);font-weight:600;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.note{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink3)}
.stack{display:grid;gap:10px}

/* 提醒 */
.alert{display:grid;grid-template-columns:4px 1fr;gap:0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 0;overflow:hidden}
.alert::before{content:"";border-radius:0 3px 3px 0;background:var(--warn)}
.alert.bad::before{background:var(--bad)} .alert.info::before{background:var(--accent)}
.alert b{font-weight:700}
.alert .act{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}

/* 秤读数 */
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
.big{font-size:26px;line-height:1}
.unit{font-size:13px;color:var(--ink2);margin-left:2px;font-family:var(--txt);font-weight:400}

/* 一起做 */
.cook{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cook .cell{background:var(--sunk);border-radius:10px;padding:10px 12px}
.cook .lbl{font-size:12px;color:var(--ink2)}
.cook select{max-width:100%}

/* 狗卡片 */
.dogs{display:grid;gap:12px}
@media (min-width:640px){.dogs{grid-template-columns:1fr 1fr}}
.dog{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.dog header{display:flex;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dog.doctor header{background:var(--doc-soft)} .dog.missy header{background:var(--mis-soft)}
.dog header .name{font-weight:700;font-size:16px}
.dog.doctor .name{color:var(--doc)} .dog.missy .name{color:var(--mis)}
.dog header .kc{margin-left:auto;font-size:13px;color:var(--ink2)}
.rows{list-style:none;margin:0;padding:4px 14px}
.rows li{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rows li:last-child{border-bottom:0}
.rows .what{min-width:0}
.rows .how{font-size:12px;color:var(--ink3);display:block}
.rows .amt{text-align:right;white-space:nowrap}
.rows .amt .num{font-size:20px}
.rows .per{display:block;font-size:12px;color:var(--ink3);text-align:right}
.box{margin:0 14px 12px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--sunk)}
.box .t{font-size:12px;color:var(--ink2);margin-bottom:4px}
.box .items{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 9px;border-radius:7px;background:var(--card);border:1px solid var(--line);font-size:13px}
.tag.key{border-color:var(--accent);color:var(--accent);font-weight:600}
.dog footer{display:flex;gap:8px;padding:0 14px 14px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%;min-height:50px;font-size:16px}
.btn.small{min-height:32px;padding:5px 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn:focus-visible,.tabs button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.done{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600}

/* 表单 */
select,input[type=number],input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:38px}
input[type=number]{width:96px;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .l{min-width:0}
.field .l small{display:block;color:var(--ink3);font-size:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* 检查 */
.meter{display:grid;grid-template-columns:5.2em 1fr 4.6em;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.meter:last-child{border-bottom:0}
.meter .nm{font-size:14px}
.meter .bar{position:relative;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.meter .fill.thin{background:var(--warn)} .meter .fill.low{background:var(--bad)} .meter .fill.high{background:var(--bad)}
.meter .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.meter .v{text-align:right}
.meter .v small{display:block;font-size:11px;color:var(--ink3);font-family:var(--txt);font-weight:400;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink3);margin-top:8px}
.st{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.thin,.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.low,.st.high{background:var(--bad-soft);color:var(--bad)} .st.info{background:var(--sunk);color:var(--ink2)}
.days{list-style:none;margin:0;padding:0}
.days li{display:grid;grid-template-columns:4.2em 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.days li:last-child{border-bottom:0}

/* 做块 */
.batch h3{margin:0;font-size:16px}
.batch .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.recipe{list-style:none;margin:8px 0;padding:0;display:grid;gap:2px}
.recipe li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.recipe li:last-child{border-bottom:0}
.steps{margin:8px 0 0;padding-left:1.3em;font-size:14px;color:var(--ink2)}
.steps li{margin:3px 0}
.rec{border-color:var(--accent)}
.treat{margin:0 14px 10px;padding:9px 11px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.ratio{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.status{list-style:none;margin:0;padding:0}
.status li{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.status li:last-child{border-bottom:0}
.status .nm{font-weight:700}
.status .tx{font-size:14px;color:var(--ink2);min-width:0}
.shop{margin:0;padding-left:1.2em;columns:2;column-gap:20px}
.shop li{padding:2px 0;break-inside:avoid}
@media (max-width:420px){.shop{columns:1}}
details.fold>summary{cursor:pointer;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::after{content:"展开";font-size:12px;font-weight:400;color:var(--ink3)}
details.fold[open]>summary::after{content:"收起"}
details.fold>summary::-webkit-details-marker{display:none}
details.fold[open]>summary{border-radius:12px 12px 0 0;border-bottom:0}
details.fold>.card,details.fold>section.card{border-radius:0 0 12px 12px;margin:0}
details.mini{border-top:1px solid var(--line);padding:9px 0 0;margin-top:4px}
details.mini>summary{cursor:pointer;font-size:14px;color:var(--ink2)}
details.mini+details.mini{margin-top:8px}
.recsteps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.recsteps li{display:grid;grid-template-columns:1.4em 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink3)}
.recsteps li:last-child{border-bottom:0}
.recsteps li b{font-weight:600}
.recsteps li small{display:block;font-size:12px}
.recsteps li.done{color:var(--ink)} .recsteps li.done .mk{color:var(--ok)}
.recsteps li.cur{color:var(--ink)} .recsteps li.cur .mk{color:var(--accent);font-weight:700}
.recsteps .when{font-size:12px;color:var(--ink3);white-space:nowrap}
.pbox{width:100%;border-collapse:collapse;font-size:14px;min-width:300px}
.pbox th,.pbox td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.pbox thead th{font-size:13px;font-weight:700;border-bottom:2px solid var(--line)}
.pbox thead .d{color:var(--doc)} .pbox thead .m{color:var(--mis)}
.pbox tbody th{white-space:nowrap;font-weight:700;width:4.5em}
.pbox tbody th small{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.pbox tr.now{background:var(--accent-soft)}
.pbox b{color:var(--accent)}
.stock{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;background:var(--sunk);border-radius:10px;padding:9px 12px;margin:8px 0}
.stock .btn{white-space:nowrap}
.stock .gauge{grid-column:1 / -1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.stock .gauge i{display:block;height:100%;background:var(--accent)}

/* 底部抽屉 */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .bar{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.err{background:var(--bad-soft);color:var(--bad);padding:10px;border-radius:10px;font-size:13px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <h1>Doctor &amp; Missy 的厨房</h1>
    <div class="sub" id="hdr"><span>正在准备…</span></div>
  </header>
  <main id="view">
    <section><div class="card note">正在计算今天的饭量…</div></section>
  </main>
</div>
<nav class="tabs" id="tabs" aria-label="页面">
  <button type="button" data-tab="today">今天吃什么</button>
  <button type="button" data-tab="prep">备料</button>
  <button type="button" data-tab="dogs">两只狗</button>
</nav>
<div id="sheetHost"></div>

const LOW_FE = 1.5;          // mg/100g 熟重

const CU_SOFT = 3.0;         // Missy 铜的个体化关注线 mg/1000kcal（按天查）

// ───────────────────────── 日期工具 ─────────────────────────
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function weekStart(s){const d=pd(s);d.setDate(d.getDate()-((d.getDay()+1)%7));return ds(d)}   // 周六
function monthStart(s){return s.slice(0,8)+'01'}
function monthEnd(s){const d=pd(monthStart(s));d.setMonth(d.getMonth()+1);d.setDate(0);return ds(d)}
function range(a,b){const r=[];for(let x=a;x<=b;x=addDays(x,1))r.push(x);return r}
function weekdayOf(s){return pd(s).getDay()}

// ───────────────────────── 营养累加 ─────────────────────────
const zero = () => { const t={kcal:0, kmod:0, dm:0}; NUT.forEach(k=>t[k]=0); return t; };
// 热量按 NRC 2006：总能 × 按整天纤维占干物质比例算的消化率 − 尿能损失
//   GE = 5.7×蛋白 + 9.4×脂肪 + 4.1×(碳水+纤维)   消化率% = 91.2 − 1.43×纤维%DM   ME = GE×消化率 − 1.04×蛋白
// 食材库的纤维是总膳食纤维（比粗纤维高），算出的消化率略偏低，结果偏保守。
// kmod 是改良 Atwater（3.5/8.5/3.5）热量，只用来算三大营养素占比（%ME）。
const digest = t => t.dm>0 ? Math.max(0.5,(91.2 - 1.43*(t.fiber/t.dm*100))/100) : 0.9;
const geOf = t => 5.7*t.p + 9.4*t.f + 4.1*(t.c + t.fiber);
function nrcKcal(t){ return geOf(t)*digest(t) - 1.04*t.p; }
function finalize(t){ t.kcal = nrcKcal(t); return t; }
const ME = d => d.p*3.5 + d.f*8.5 + d.c*3.5;
function addFood(t, F, name, g){
  const d = F[name]; if(!d || !g) return t;
  NUT.forEach(k=>{
    if((k==='fe'||k==='vita_retinol') && PLANT.has(d.cat)) return;
    const av = AVAIL[name] && AVAIL[name][k]!==undefined ? AVAIL[name][k] : 1;
    t[k] += (d[k]||0)*g/100*av;
  });
  t.kmod += ME(d)*g/100;
  t.dm += (d.dm||0.25)*g;
  return t;
}
function addSupp(t, s){
  if(!s) return t;
  if(s.caG)   t.ca   += s.caG*SUPP.ca.mgPerG;
  if(s.iTab)  { t.i += s.iTab*SUPP.i.ugPerTab; t.k += s.iTab*SUPP.i.kPerTab; }
  if(s.znTab) t.zn   += s.znTab*SUPP.zn.mgPerTab;
  if(s.veCap) t.vite += s.veCap*SUPP.ve.iuPerCap;
  if(s.vdCap) t.vitd += s.vdCap*SUPP.vd.iuPerCap;
  if(s.foCap){ t.f += s.foCap*SUPP.fo.gPerCap; t.kmod += s.foCap*SUPP.fo.gPerCap*8.5; t.dm += s.foCap*SUPP.fo.gPerCap;
               t.epadha += s.foCap*SUPP.fo.epadhaPerCap; }
  return t;
}
function sumT(a,b){const t=zero();Object.keys(t).forEach(k=>t[k]=(a[k]||0)+(b[k]||0));return t}

// 需求（一段时间、一只狗）
function needFor(k, kcalTotal){ return AAFCO[k]*kcalTotal/1000; }
function veNeed(kcalTotal, foG){ return AAFCO.vite*kcalTotal/1000 + VE_PER_G_FISHOIL*foG; }

// 某自然周做哪种内脏块：从 anchor 起逐周交替
function organTypeOfWeek(cfg, wsDate){
  const a = cfg.organ.anchor.week || wsDate;
  const n = Math.round((pd(wsDate)-pd(a))/(7*864e5));
  const flip = ((n%2)+2)%2===1;
  const t = cfg.organ.anchor.type;
  return flip ? (t==='chicken'?'pork':'chicken') : t;
}

// 一种内脏配方每100g（生重）的营养
function per100(F, recipe){
  const tot = Object.values(recipe).reduce((a,b)=>a+b,0);
  const t = zero(); for(const n in recipe) addFood(t,F,n,recipe[n]);
  const r = {}; Object.keys(t).forEach(k=>r[k]=t[k]/tot*100);   // dm 也按每100g
  return {per100:r, raw:tot};
}

// ───────────────────────── 碳水：一种或两种 ─────────────────────────
// carbSplit = 第二种碳水占碳水热量的比例。返回 [[食材, 质量占比], ...] 和等效的“混合碳水”每100g
function carbParts(F, cfg){
  const c1=cfg.carb, c2=cfg.carb2;
  if(!c2 || c2===c1 || !F[c2]) return [[c1,1]];
  const w = cfg.carbSplit==null ? 0.5 : cfg.carbSplit;
  const n1=(1-w)/ME(F[c1]), n2=w/ME(F[c2]), t=n1+n2;
  return [[c1,n1/t],[c2,n2/t]];
}
function carbMix(F, cfg){
  const parts = carbParts(F,cfg);
  if(parts.length===1) return F[parts[0][0]];
  const m={p:0,f:0,c:0,fiber:0,dm:0};
  for(const [n,fr] of parts){ const d=F[n]; m.p+=d.p*fr; m.f+=d.f*fr; m.c+=d.c*fr; m.fiber+=(d.fiber||0)*fr; m.dm+=(d.dm||0.25)*fr; }
  return m;
}
function addCarbs(t, F, cfg, g){ for(const [n,fr] of carbParts(F,cfg)) addFood(t,F,n,g*fr); return t; }

// ───────────────────────── 每日底盘（不含补充剂） ─────────────────────────
// 给定当天固定项（块、蛋、菜泥、鱼油），解两元方程得肉、碳水克数
// 健身日：这只狗当天正餐少给一部分热量，留给零食
const TREAT_KCAL_PER_G = 4.5;   // 鸡胸脆片（生鸡胸烘干）约 4.5 kcal/g
function treatKcal(cfg, dogKey, d){
  const tr = cfg.train; if(!tr || !tr.days || !tr.days[d]) return 0;
  const pct = (tr.pct && tr.pct[dogKey]!=null) ? tr.pct[dogKey] : 0.10;
  return cfg.dogs[dogKey].kcal * pct;
}
function mealKcal(cfg, dogKey, d){ return cfg.dogs[dogKey].kcal - (d ? treatKcal(cfg,dogKey,d) : 0); }
function solveMain(F, cfg, dogKey, fixedT, kcOverride){
  const dog = cfg.dogs[dogKey], M=F[cfg.meat], Cm=carbMix(F,cfg);
  const kc = kcOverride!=null ? kcOverride : dog.kcal, share = cfg.pctP/100;
  const per = d => ({p:d.p/100, f:d.f/100, c:d.c/100, fib:(d.fiber||0)/100, dm:(d.dm||0.25)});
  const m = per(M), cc = per(Cm), fx = fixedT;
  let gM = 0, gC = 0, dg = digest(fx);
  for(let it=0; it<8; it++){
    const e = x => (5.7*x.p + 9.4*x.f + 4.1*(x.c+x.fib))*dg - 1.04*x.p;     // 每克 ME
    const eFix = geOf(fx)*dg - 1.04*fx.p;
    // ① NRC 热量 = 目标   ② 蛋白占改良 Atwater 热量的比例 = 目标
    const a1=e(m), b1=e(cc), c1=kc-eFix;
    const km = x => 3.5*x.p + 8.5*x.f + 3.5*x.c;
    const a2=3.5*m.p - share*km(m), b2=3.5*cc.p - share*km(cc), c2=share*fx.kmod - 3.5*fx.p;
    const det=a1*b2-a2*b1;
    gM=(c1*b2-c2*b1)/det; gC=(a1*c2-a2*c1)/det;
    const tot = {fiber: fx.fiber + gM*m.fib + gC*cc.fib, dm: fx.dm + gM*m.dm + gC*cc.dm};
    dg = digest(tot);
  }
  return {gM, gC, ok: gM>0 && gC>0};
}

// 当天某只狗的“块”目标（生重等价克数）
function blockTargets(F, cfg, dogKey, type, others){
  const dog = cfg.dogs[dogKey];
  const ratio = dog.kcal/(cfg.dogs.doctor.kcal+cfg.dogs.missy.kcal);
  // 内脏：两种周每天总量相同 = 一套鸡内脏 400g ÷ 14天；猪肝周再受 Missy 铜关注线封顶
  const chickenRaw = Object.values(cfg.organ.chicken).reduce((a,b)=>a+b,0);
  let organDayBoth = chickenRaw/14;
  let organG = organDayBoth*ratio;
  const rec = type==='pork' ? cfg.organ.pork : cfg.organ.chicken;
  const P = per100(F, rec).per100;
  if(type==='pork'){
    // 按 Missy 的关注线算出两只狗共同的封顶，再按热量比分
    const m = cfg.dogs.missy, mRatio = m.kcal/(cfg.dogs.doctor.kcal+m.kcal);
    const cuCap = CU_SOFT*m.kcal/1000;
    const V = vegPer100(F,cfg.veg), vegMax = V.fiber>0 ? m.vegFiberMax*m.meals/V.fiber*100 : 0;
    const cuOther = others.missyCuOther + V.cu*vegMax/100;   // Missy 当天来自肉、碳水、鱼、蛋、菜的铜（菜按上限估）
    const missyMax = Math.max(0,(cuCap - cuOther)/P.cu*100);
    const bothMax = missyMax/mRatio;
    organDayBoth = Math.min(organDayBoth, bothMax);
    organG = organDayBoth*ratio;
  }
  return {organG, organType:type, organPer100:P};
}

// 鸡蛋：单独给时按指定的星期几；和菜泥一起打时每天都吃，一周总量不变
function eggPlan(cfg, key){
  if(cfg.dogs[key] && cfg.dogs[key].noEgg) return {days:new Set(), g:0};
  const days = cfg.egg.days[key]||[], g = cfg.egg.g[key]||0;
  if(cfg.eggInVeg) return {days:new Set([0,1,2,3,4,5,6]), g: g*days.length/7};
  return {days:new Set(days), g};
}

// 鸡蛋：恢复期可以只给蛋白、或蛋白加一部分蛋黄（cfg.eggParts = {white, yolk}，按计划蛋量的比例）
const EGG_WHITE='蛋白(熟)', EGG_YOLK='蛋黄(熟)', EGG_WF=0.64, EGG_YF=0.36;
function eggPut(cfg, g, fn){
  if(!(g>0)) return;
  const P = cfg.eggParts;
  if(!P) return fn(cfg.egg.name, g);
  if(P.white>0) fn(EGG_WHITE, g*EGG_WF*P.white);
  if(P.yolk>0)  fn(EGG_YOLK,  g*EGG_YF*P.yolk);
}

// 菜泥轮换：一批吃 2 天，一批以一种菜为主，5 批（10 天）一轮。
// 黄瓜、南瓜纤维太少，单独做两天要 400 g，超过辅食机；按 4:1 搭一点菠菜（镁多、纤维多），量降到 240 g 左右。
const VEG_ROTATION = [
  {'西葫芦(生)':1},
  {'南瓜(生)':1,'菠菜(生)':0.25},
  {'丝瓜(生)':1},
  {'黄瓜(生)':1,'菠菜(生)':0.25},
  {'娃娃菜(生)':1},
];
const VEG_DAYS = 2, VEG_MAX_RAW = 300;
const vegKey = mix => Object.keys(mix||{}).filter(n=>mix[n]>0).sort().join('|');
function vegRotIndex(mix){ const k=vegKey(mix); return k ? VEG_ROTATION.findIndex(m=>vegKey(m)===k) : -1; }
// 上一批之后的 n 批；上一批不在轮换里（或没有）就从第一组开始
function vegRotNext(lastMix, n){
  const i = vegRotIndex(lastMix), L = VEG_ROTATION.length, out = [];
  for(let j=0;j<(n||1);j++) out.push(Object.assign({}, VEG_ROTATION[(i<0 ? j : i+1+j)%L]));
  return out;
}

// 菜泥配比每100g（含吸收率折算）
function vegPer100(F, mix){
  const tot=Object.values(mix).reduce((a,b)=>a+b,0)||1, t=zero();
  for(const n in mix) addFood(t,F,n,mix[n]/tot*100);
  return t;
}

// 鱼：按维D 达到 1.3 倍定克数（扣掉蛋、肉、内脏已有的维D）
function fishGrams(F, cfg, dogKey, vdOtherWeek){
  const dog=cfg.dogs[dogKey], need = needFor('vitd', dog.kcal*7)*MARGIN;
  const gWeek = Math.max(0,(need - vdOtherWeek))/F[cfg.fish].vitd*100;
  return gWeek/7;
}

// ───────────────────────── 周计划 ─────────────────────────
// 返回该自然周每天、每只狗的计划克数 + 本周药盒
// 冻干内脏模式：每天给冻干牛肝（铜、维A、B12）+ 冻干兔血（铁），克数按缺口算
function fdDoses(F, cfg, P0){
  const L = F[cfg.organ.fd], B = F[cfg.organ.blood], out = {liver:{}, blood:{}};
  const r05 = x => Math.round(x*2)/2, f05 = x => Math.floor(x*2+1e-9)/2;
  for(const k of ['doctor','missy']){
    const dog = cfg.dogs[k], kc = dog.kcal, ds = Object.values(P0.dogs[k].days).map(r=>r.tAll);
    const avg = n => ds.reduce((a,t)=>a+t[n],0)/ds.length, mx = n => Math.max(...ds.map(t=>t[n]));
    const need = n => AAFCO[n]*kc/1000;
    let gL = 0;
    if(L && !cfg.noOrgan){
      const g = n => L[n]>0 ? Math.max(0, MARGIN*need(n) - avg(n))/L[n]*100 : 0;
      gL = Math.max(g('cu'), g('vita_retinol'), g('b12'));
      const capCu = (dog.cuSoft ? CU_SOFT : 2*CU_SOFT)*kc/1000 - mx('cu');
      const gCap = Math.max(0, capCu)/(L.cu*FD_LIVER_CU_WORST)*100;
      gL = Math.min(r05(gL), f05(gCap));
      if(cfg.organScale!=null && cfg.organScale<1) gL = r05(gL*cfg.organScale);
    }
    let gB = 0;
    if(B && !cfg.noBlood){
      const fe1 = avg('fe') + (L?L.fe*gL/100:0);
      gB = Math.max(0, MARGIN*need('fe') - fe1)/B.fe*100;
      gB = Math.min(r05(gB), f05(0.05*kc/B.kcal*100));
      if(cfg.bloodScale!=null && cfg.bloodScale<1) gB = r05(gB*cfg.bloodScale);
    }
    out.liver[k] = gL; out.blood[k] = gB;
  }
  return out;
}
function planWeek(F, cfg, wsDate, opt){
  opt = opt||{};
  if(cfg.organMode==='fd' && !opt.fdFixed){
    const zero2 = {liver:{doctor:0,missy:0}, blood:{doctor:0,missy:0}};
    const P0 = planWeek(F, cfg, wsDate, Object.assign({}, opt, {fdFixed:zero2}));
    const D = fdDoses(F, cfg, P0);
    const P = planWeek(F, cfg, wsDate, Object.assign({}, opt, {fdFixed:D}));
    P.fd = D; return P;
  }
  const days = range(wsDate, addDays(wsDate,6));
  const fdMode = !!opt.fdFixed;
  const type = fdMode ? 'fd' : (opt.type || organTypeOfWeek(cfg, wsDate));
  const fdG = fdMode ? opt.fdFixed.liver : (type==='chicken' && !opt.noFd && !cfg.noFd && !cfg.noOrgan) ? fdPerDay(F,cfg,wsDate) : {doctor:0,missy:0};
  const bloodG = fdMode ? opt.fdFixed.blood : {doctor:0,missy:0};
  const V = vegPer100(F,cfg.veg), vegTot=Object.values(cfg.veg).reduce((a,b)=>a+b,0)||1;
  const out = {weekStart:wsDate, organType:type, dogs:{}};

  for(const key of ['doctor','missy']){
    const dog = cfg.dogs[key];
    const foG = dog.foCapPerDay*SUPP.fo.gPerCap;
    out.dogs[key] = {days:{}};

    // 第一遍：不含鱼、不含猪肝封顶，先估肉碳水 → 得到维D、铜的“其他来源”
    const EP = eggPlan(cfg, key), eggDays = EP.days, eggG = EP.g;
    const draft = (fishG, organG, organP) => days.map(d=>{
      const t = zero();
      if(eggDays.has(weekdayOf(d))) eggPut(cfg, eggG, (n,x)=>addFood(t,F,n,x));
      addFood(t,F,cfg.fish,fishG);
      if(organG){ for(const k in organP) if(k!=='kcal') t[k]+=organP[k]*organG/100; }
      addFood(t,F,cfg.organ.fd,fdG[key]);
      if(bloodG[key]) addFood(t,F,cfg.organ.blood,bloodG[key]);
      addSupp(t,{foCap:dog.foCapPerDay});
      // 菜泥按纤维余量（先假设碳水贡献，下面迭代）
      return {d,t};
    });

    // 迭代：鱼量依赖维D，肉碳水依赖固定项，菜泥依赖碳水纤维
    let fishG = 0, organ = blockTargets(F,cfg,key,'chicken',{missyCuOther:0});
    for(let it=0; it<6; it++){
      // Missy 的铜其他来源：按上一轮估计
      let missyCuOther = 0;
      if(type==='pork' && !fdMode){
        const m='missy', mFish = it===0?0:(out._fishMissy||0);
        // 有蛋、没蛋的天都算一遍，取铜较高的那天（没蛋的天肉更多）
        const EM = eggPlan(cfg,'missy');
        for(const eg of (EM.days.size===7 ? [EM.g] : [EM.g, 0])){
          const t=zero(); addFood(t,F,cfg.fish,mFish); eggPut(cfg, eg, (n,x)=>addFood(t,F,n,x));
          const sol = solveMain(F,cfg,m,t);
          addFood(t,F,cfg.meat,sol.gM); addCarbs(t,F,cfg,sol.gC);
          missyCuOther = Math.max(missyCuOther, t.cu);
        }
      }
      organ = blockTargets(F,cfg,key,type,{missyCuOther});
      if(cfg.noOrgan || fdMode) organ = Object.assign({}, organ, {organG:0});
      else if(cfg.organScale!=null && cfg.organScale<1) organ = Object.assign({}, organ, {organG:organ.organG*cfg.organScale});
      const rows = draft(fishG, organ.organG, organ.organPer100);
      let vdOther = 0;
      rows.forEach(r=>{ const sol=solveMain(F,cfg,key,r.t);
        const t2=Object.assign(zero(),r.t); addFood(t2,F,cfg.meat,sol.gM); addCarbs(t2,F,cfg,sol.gC);
        vdOther += t2.vitd - (F[cfg.fish].vitd*fishG/100); });
      fishG = (cfg.noFish || dog.noFish) ? 0 : fishGrams(F,cfg,key,vdOther)*(cfg.fishScale!=null ? cfg.fishScale : 1);
      if(key==='missy') out._fishMissy = fishG;
    }

    // 定稿每天：菜泥按“本周镁达到目标”定量，每天一样；受纤维上限约束
    const build = (vegG) => {
      let wk = zero(); const rows={};
      days.forEach(d=>{
        const t = zero(), g = {};
        const put=(n,x)=>{ if(x>0){ g[n]=(g[n]||0)+x; addFood(t,F,n,x);} };
        if(eggDays.has(weekdayOf(d))) eggPut(cfg, eggG, put);
        // 鱼块一块 = Doctor 两天的量：Doctor 周六、周一、周三、周五各一块，Missy 每天按块
        if(key==='doctor' && cfg.fishAlt===true) put(cfg.fish, FISH_DAYS.has(weekdayOf(d)) ? 2*fishG : 0);
        else put(cfg.fish, fishG);
        const rec = type==='pork'?cfg.organ.pork:cfg.organ.chicken;
        const rawTot = Object.values(rec).reduce((a,b)=>a+b,0);
        for(const n in rec) put(n, organ.organG*rec[n]/rawTot);
        put(cfg.organ.fd, fdG[key]);
        if(bloodG[key]) put(cfg.organ.blood, bloodG[key]);
        for(const n in cfg.veg) put(n, vegG*cfg.veg[n]/vegTot);
        addSupp(t,{foCap:dog.foCapPerDay});
        const sol = solveMain(F,cfg,key,t,mealKcal(cfg,key,d));
        put(cfg.meat, sol.gM); for(const [n,fr] of carbParts(F,cfg)) put(n, sol.gC*fr);
        finalize(t);
        rows[d] = {g, t, ok:sol.ok, organG:organ.organG, fishG, vegG, fdG:fdG[key]};
        wk = sumT(wk,t);
      });
      return {rows, wk};
    };
    const vegCap = V.fiber>0 ? dog.vegFiberMax*dog.meals/V.fiber*100 : Infinity;
    let vegG = 0, B = build(0);
    for(let it=0; it<4; it++){
      const gap = (needFor('mg',dog.kcal*7)*(tgt('mg')+0.02) - (B.wk.mg - V.mg*vegG/100*7))/7;
      vegG = Math.min(vegCap, Math.max(0, gap/V.mg*100));
      B = build(vegG);
    }
    const scale = cfg.vegScale==null ? 1 : cfg.vegScale;   // 菜泥适应期：先给一部分
    if(scale!==1) B = build(vegG*scale);
    out.dogs[key].days = B.rows;
    out.dogs[key].vegCapped = vegG>=vegCap-1e-9 && vegCap<Infinity;
    out.dogs[key].vegFull = vegG;
    const wk = B.wk;
    // ── 本周补充剂（整数片/粒，定位到具体哪天） ──
    const kcW = dog.kcal*7;
    const caNeed = Math.max(needFor('ca',kcW), wk.ph*CAP_TARGET) - wk.ca;
    const caPerDay = Math.ceil(Math.max(0,caNeed)/7/SUPP.ca.mgPerG*20)/20;     // 0.05g 一档
    const so = cfg.suppOff ? 0 : 1;
    const znTabs = so*Math.max(0,Math.ceil((needFor('zn',kcW)*MARGIN - wk.zn)/SUPP.zn.mgPerTab));
    const iTabs  = so*Math.max(0,Math.ceil((needFor('i',kcW)*MARGIN - wk.i)/SUPP.i.ugPerTab));
    const veCaps = so*Math.max(0,Math.ceil((veNeed(kcW,foG*7)*MARGIN - wk.vite)/SUPP.ve.iuPerCap));
    // 维D：食物（主要是鱼、蛋）不够需要量时才补，按 1.3 倍补到整粒；吃鱼的狗一般是 0
    const vdNeed = needFor('vitd',kcW);
    const vdCaps = (so && wk.vitd < vdNeed) ? Math.ceil((vdNeed*MARGIN - wk.vitd)/SUPP.vd.iuPerCap) : 0;
    const box = {};
    days.forEach(d=>box[d]={caG:caPerDay, iTab:0, znTab:0, veCap:0, vdCap:0, foCap:dog.foCapPerDay});
    spreadEven(days, box, 'iTab', iTabs);
    spread(days, box, 'znTab', znTabs, cfg.supp.znDays);
    spread(days, box, 'veCap', veCaps, [cfg.supp.veDay]);
    spread(days, box, 'vdCap', vdCaps, (cfg.supp.vdDays||[1,4]).slice(0, Math.max(1,vdCaps)));
    out.dogs[key].box = box;
    out.dogs[key].suppWeek = {caPerDay, znTabs, iTabs, veCaps, vdCaps};
    days.forEach(d=>{ const r=out.dogs[key].days[d]; r.tAll = finalize(addSupp(Object.assign(zero(),r.t), Object.assign({},box[d],{foCap:0}))); });
  }
  delete out._fishMissy;
  return out;
}

// 鸡内脏周掺多少冻干内脏补铜：
// 一个“鸡周+猪周”的两周里，铜平均达到 1.3 倍；Missy 每天不超过铜关注线。
// 两只狗按热量比分（内脏块统一配方，Doctor 1 块、Missy 2 块）。
function fdPerDay(F, cfg, wsDate){
  const FD = F[cfg.organ.fd]; if(!FD || !FD.cu) return {doctor:0,missy:0};
  const kD=cfg.dogs.doctor.kcal, kM=cfg.dogs.missy.kcal;
  if(cfg.organ.fdBatchG!=null){
    const perDay = cfg.organ.fdBatchG/14;
    return {doctor:perDay*kD/(kD+kM), missy:perDay*kM/(kD+kM)};
  }
  const avgCu = (P,k)=>{let c=0,n=0;for(const d in P.dogs[k].days){c+=P.dogs[k].days[d].tAll.cu;n++}return c/n};
  const maxCu = (P,k)=>Math.max(...Object.values(P.dogs[k].days).map(r=>r.tAll.cu));
  const Pc = planWeek(F,cfg,wsDate,{type:'chicken',noFd:true});
  const Pp = planWeek(F,cfg,wsDate,{type:'pork'});
  // 以 Missy 为准算每千卡的剂量（她有关注线），Doctor 同比例
  const m='missy', need=AAFCO.cu*kM/1000;
  const want = Math.max(0, 2*MARGIN*need - avgCu(Pc,m) - avgCu(Pp,m));
  const cap  = Math.max(0, CU_SOFT*kM/1000 - maxCu(Pc,m));
  const gM = Math.min(want,cap)/FD.cu*100;
  return {doctor:gM*kD/kM, missy:gM, capped: want>cap};
}

// 把 n 片平均撒在 7 天里：每天 floor(n/7) 片，余下的隔开放
function spreadEven(days, box, field, n){
  const base=Math.floor(n/7), extra=n%7;
  days.forEach(d=>box[d][field]+=base);
  for(let j=0;j<extra;j++) box[days[Math.floor(j*7/extra)]][field]+=1;
}
// 把 n 片尽量平均放在优先的星期几；放不下再轮到其他天
function spread(days, box, field, n, prefWd){
  if(n<=0) return;
  const order = [];
  prefWd.forEach(w=>{ const d=days.find(x=>weekdayOf(x)===w); if(d) order.push(d); });
  days.forEach(d=>{ if(!order.includes(d)) order.push(d); });
  // 先每个优先日一片，循环加
  let i=0; const base = prefWd.length;
  while(n>0){ box[order[i % Math.max(base,1)] || order[i%order.length]][field]+=1; n--; i++; }
}

// ───────────────────────── 恢复期 ─────────────────────────
// 清淡饮食：瘦肉 + 白米饭 + 钙粉；按顺序一档一档加回（脂肪少、吃过没问题的在前，蛋黄和鱼在后）。
const RECOVERY_STEPS = [
  {k:'organ', n:'内脏块',          tiers:[0.5,1],      tn:['半量','全量'],            how:'先不放冻干牛肝；半量就是平时一半的量'},
  {k:'supp',  n:'药盒',            tiers:[1],          tn:['碘、锌、维E、维D'],         how:'锌随饭喂；维D 只给不吃鱼的狗；鱼油先不给'},
  {k:'fd',    n:'冻干牛肝',        tiers:[1],          tn:['放回'],                   how:'下一批鸡内脏块里放回去'},
  {k:'veg',   n:'菜泥（西葫芦）',  tiers:[0.25,0.5,1], tn:['25%','50%','全量'],       how:'一次做两天；量少就蒸软用叉子压成泥'},
  {k:'eggw',  n:'蛋白',            tiers:[0.5,1],      tn:['半量','全量'],            how:'白煮蛋只给蛋白，几乎不含脂肪'},
  {k:'eggy',  n:'蛋黄',            tiers:[0.25,0.5,1], tn:['¼','½','全量'],          how:'和蛋白一起给；蛋黄最油，慢慢加'},
  {k:'fish',  n:'鱼块',            tiers:[0.5,1],      tn:['半量','全量 + 鱼油'],     how:'晚餐给；全量时 Doctor 恢复每天的鱼油'},
  {k:'kcal',  n:'热量回到平时',    tiers:null,         tn:null,                       how:'每次加 10%，可以分几次点'},
];
const RECOVERY_GAP = 2;     // 两档之间至少隔几天
// 冻干内脏模式：内脏块换成冻干牛肝，紧接着冻干兔血（Missy 吃过没问题）；去掉“冻干牛肝放回内脏块”
function recSteps(cfg){
  if(!cfg || cfg.organMode!=='fd') return RECOVERY_STEPS;
  const out = [], kcalStep = RECOVERY_STEPS.find(s=>s.k==='kcal');
  for(const s of RECOVERY_STEPS){
    if(s.k==='fd' || s.k==='kcal') continue;
    if(s.k==='organ'){ out.push({k:'organ', n:'冻干牛肝', tiers:[0.5,1], tn:['半量','全量'], how:'晚餐剪碎拌进饭里'});
      out.push({k:'blood', n:'冻干兔血', tiers:[0.5,1], tn:['半量','全量'], how:'补铁，晚餐和牛肝一起给；便便颜色会变深，属正常'}); continue; }
    out.push(s);
    if(s.k==='supp') out.push(kcalStep);      // 先把热量加回来（同样的肉和米饭多一点），再加菜、蛋、鱼
  }
  return out;
}
// 旧版记录（done）不再沿用：从头开始
function recState(cfg){
  const r = cfg.recovery; if(!r) return null;
  if(r.v===2) return {lv:r.lv||{}, hist:r.hist||[]};
  return {lv:{}, hist:[]};
}
function recFrac(st, k, cfg){
  const s = recSteps(cfg).find(x=>x.k===k) || RECOVERY_STEPS.find(x=>x.k===k), n = (st.lv[k]||0);
  return s && n>0 && s.tiers ? s.tiers[Math.min(n, s.tiers.length)-1] : 0;
}
function applyRecovery(cfg){
  const r = cfg.recovery; if(!r || !r.on) return cfg;
  const c = JSON.parse(JSON.stringify(cfg)), st = recState(cfg);
  c.carb = '大米(干)'; c.carb2 = '';
  const n = st.lv.kcal||0;
  const fishFull = recFrac(st,'fish',cfg)>=1;
  for(const k of ['doctor','missy']){
    const normal = cfg.dogs[k].kcal, base = (r.kcal&&r.kcal[k]) || normal;
    c.dogs[k].kcal = Math.min(normal, base*Math.pow(1.1,n));
    if(!fishFull) c.dogs[k].foCapPerDay = 0;
  }
  const fo = recFrac(st,'organ',cfg); if(fo>0) c.organScale = fo; else c.noOrgan = true;
  if(cfg.organMode==='fd'){ const fb = recFrac(st,'blood',cfg); if(fb>0) c.bloodScale = fb; else c.noBlood = true; }
  if(!(st.lv.supp>0)) c.suppOff = true;
  if(!(st.lv.fd>0)) c.noFd = true;
  c.vegScale = recFrac(st,'veg',cfg); c.eggInVeg = false;
  const w = recFrac(st,'eggw',cfg), y = recFrac(st,'eggy',cfg);
  if(w>0 || y>0) c.eggParts = {white:w, yolk:y};
  else c.egg = Object.assign({}, c.egg, {g:{doctor:0,missy:0}});
  const ff = recFrac(st,'fish',cfg); if(ff>0) c.fishScale = ff; else c.noFish = true;
  c.inRecovery = true;
  c.recLv = st.lv;
  return c;
}
function kcalDoneOf(cfg, st){
  const r = cfg.recovery, n = st.lv.kcal||0;
  return ['doctor','missy'].every(k=>{ const base=(r.kcal&&r.kcal[k])||cfg.dogs[k].kcal; return base*Math.pow(1.1,n) >= cfg.dogs[k].kcal-0.5; });
}
// 下一档是什么、最早哪天可以加
function recoveryNext(cfg, today){
  const r = cfg.recovery; if(!r || !r.on) return null;
  const st = recState(cfg);
  const last = st.hist.length ? st.hist.map(h=>h.date).sort().pop() : r.start;
  const STEPS = recSteps(cfg);
  const kcalDone = kcalDoneOf(cfg, st);
  let next = STEPS.find(s=>s.tiers ? (st.lv[s.k]||0) < s.tiers.length : !kcalDone);
  const earliest = addDays(last, RECOVERY_GAP);
  let label = '', tier = 0;
  if(next){
    if(next.tiers){ tier = (st.lv[next.k]||0); label = next.n + (next.tiers.length>1 ? ' ' + next.tn[tier] : ''); }
    else label = '热量加 10%';
  }
  return {next, tier, label, earliest, ready: today>=earliest, finished: !next, lv: st.lv, hist: st.hist, kcalDone};
}
// 加一档 / 退一档：返回新的 recovery 对象
function recoveryStep(cfg, today, dir){
  const r = JSON.parse(JSON.stringify(cfg.recovery)), st = recState(cfg);
  r.v = 2; r.lv = Object.assign({}, st.lv); r.hist = st.hist.slice(); delete r.done;
  if(dir>0){
    const N = recoveryNext(cfg, today); if(!N || !N.next) return {r, k:null};
    r.lv[N.next.k] = (r.lv[N.next.k]||0)+1; r.hist.push({k:N.next.k, date:today});
    return {r, k:N.next.k, label:N.label};
  }
  const h = r.hist.pop(); if(!h) return {r, k:null};
  r.lv[h.k] = Math.max(0,(r.lv[h.k]||0)-1); if(!r.lv[h.k]) delete r.lv[h.k];
  return {r, k:h.k};
}
// 菜在适应期（不到全量）时鸡蛋单独给：菜泥里菜少蛋多，而且中途加菜量后蛋菜比例就不对了
function applyVegRamp(cfg){
  const sc = cfg.vegScale==null ? 1 : cfg.vegScale;
  if(!cfg.eggInVeg || sc>=1) return cfg;
  const c = JSON.parse(JSON.stringify(cfg)); c.eggInVeg = false; c.eggHeld = true;
  return c;
}
// 现在吃着的：每一样到哪一档
function recoveryAdded(cfg){
  const st = recState(cfg); if(!st) return [];
  const out = recSteps(cfg).filter(s=>s.tiers && st.lv[s.k]>0).map(s=>s.n + (s.tiers.length>1 ? ' ' + s.tn[Math.min(st.lv[s.k],s.tiers.length)-1] : ''));
  if(st.lv.kcal>0) out.push(kcalDoneOf(cfg, st) ? '热量已回到平时' : `热量加了 ${st.lv.kcal} 次 10%`);
  return out;
}

// ───────────────────────── 实际 + 预测 ─────────────────────────
// logs: { 'YYYY-MM-DD': { doctor:{g:{食材:克}, s:{caG,iTab,znTab,veCap,foCap}}, missy:{...} } }
function dayTotal(F, entry){
  const t = zero(); if(!entry) return t;
  for(const n in (entry.g||{})) addFood(t,F,n,entry.g[n]);
  addSupp(t, entry.s);
  return finalize(t);
}
// “照做了”：把计划写成当天记录
function planToLog(plan, d){
  const r = {};
  for(const key of ['doctor','missy']){
    const p = plan.dogs[key].days[d]; if(!p) continue;
    r[key] = {g:Object.assign({},p.g), s:Object.assign({},plan.dogs[key].box[d]), fromPlan:true};
  }
  return r;
}

// 一段日期内某只狗：已记录的用实际，未来的用计划（today 之后、或今天未记录）
function periodTotals(F, cfg, logs, dogKey, from, to, today, planCache){
  let act = zero(), fc = zero(), nAct=0, nPlan=0;
  for(const d of range(from,to)){
    const L = logs[d] && logs[d][dogKey];
    if(L){ act = sumT(act, dayTotal(F,L)); nAct++; }
    else if(d >= today){
      const ws = weekStart(d);
      const P = planCache[ws] || (planCache[ws]=planWeek(F,cfg,ws));
      fc = sumT(fc, P.dogs[dogKey].days[d].tAll); nPlan++;
    }
  }
  const nDays=range(from,to).length;
  return {act, fc, all:sumT(act,fc), nAct, nPlan, nDays:nAct+nPlan, nMissing:nDays-nAct-nPlan};
}

// ───────────────────────── 检查 ─────────────────────────
function status(k,r){ return r>=tgt(k)-0.005?'ok' : r>=1?'thin' : 'low'; }

function checkDay(F, cfg, dogKey, t, target){
  const dog=cfg.dogs[dogKey], kc=t.kcal||1, out=[], tg = target||dog.kcal;
  out.push({k:'kcal', v:t.kcal, target:tg, s: Math.abs(t.kcal/tg-1)<=0.08?'ok':'warn'});
  const km=t.kmod||kc, pP=t.p*3.5/km*100, pF=t.f*8.5/km*100;
  out.push({k:'p', v:pP, unit:'%ME', s: pP>=cfg.pctP-3?'ok':'warn'});
  out.push({k:'f', v:pF, unit:'%ME', s: pF>30||pF<12?'warn':'ok'});
  const cap = t.ph? t.ca/t.ph : 0;
  out.push({k:'cap', v:cap, s: cap<CAP_MIN||cap>CAP_MAX?'warn':'ok'});
  out.push({k:'fiber', v:t.fiber/dog.meals, unit:'g/餐', s:'info'});
  if(dog.cuSoft){ const lim=CU_SOFT*dog.kcal/1000;
    out.push({k:'cu', v:t.cu, limit:lim, s: t.cu>lim*1.02?'warn':'ok'}); }
  return out;
}

function checkPeriod(F, cfg, dogKey, P, keys){
  const dog=cfg.dogs[dogKey], kcTot = dog.kcal*P.nDays, foG = dog.foCapPerDay*SUPP.fo.gPerCap*P.nDays;
  return keys.map(k=>{
    const need = k==='vite' ? veNeed(kcTot,foG) : needFor(k,kcTot);
    const r = P.all[k]/need;
    const row = {k, ratio:r, target:tgt(k), ratioActual: P.nAct? P.act[k]/(need*P.nAct/P.nDays):null, s:status(k,r)};
    if(AAMAX[k]){ const mx = AAMAX[k]*P.all.kcal/1000; row.ofMax = P.all[k]/mx; if(row.ofMax>0.7) row.s='high'; }
    if(k==='ca'||k==='ph'){ row.cap = P.all.ca/P.all.ph; if(row.s==='thin') row.s='ok';
      if(row.cap<CAP_MIN||row.cap>CAP_MAX) row.s='warn'; }
    return row;
  });
}

// 总入口：某天的全部指导与检查
function report(F, cfg, logs, today){
  const cache = {};
  const ws = weekStart(today), we = addDays(ws,6), ms = monthStart(today), me = monthEnd(today);
  const plan = cache[ws] = planWeek(F,cfg,ws);
  const res = {today, weekStart:ws, organType:plan.organType, plan, dogs:{}};
  for(const key of ['doctor','missy']){
    const W = periodTotals(F,cfg,logs,key,ws,we,today,cache);
    const M = periodTotals(F,cfg,logs,key,ms,me,today,cache);
    const todayT = logs[today]&&logs[today][key] ? dayTotal(F,logs[today][key]) : plan.dogs[key].days[today].tAll;
    res.dogs[key] = {
      todayPlan: plan.dogs[key].days[today], box: plan.dogs[key].box[today],
      day: checkDay(F,cfg,key,todayT,mealKcal(cfg,key,today)),

      month: checkPeriod(F,cfg,key,M,MONTHLY_K.concat(['se','i'])), monthN:{act:M.nAct,plan:M.nPlan},

      meat: meatAdvice(F,cfg,logs,key,today,cache),

  }

}

// 某天的主力肉（记录里克数最多的蛋白类）
function mainMeat(F, entry){
  let best=null,bg=0; for(const n in (entry&&entry.g)||{}) if(F[n]&&F[n].cat==='protein'&&entry.g[n]>bg){best=n;bg=entry.g[n]}
  return best;
}
// 换肉提示：连续多天、或本月次数多 → 铁（和铜）会不够
function meatAdvice(F, cfg, logs, key, today, cache){
  const ms=monthStart(today), me=monthEnd(today);
  const meatOf = d => (logs[d]&&logs[d][key]) ? mainMeat(F,logs[d][key]) : (d>=today?cfg.meat:null);
  const low = n => n && F[n].fe < LOW_FE;
  // 连续天数：从今天往前数
  let streak=0; for(let d=today; low(meatOf(d)); d=addDays(d,-1)) streak++;
  const monthDays = range(ms,me);
  const lowDone = monthDays.filter(d=>d<today && low(meatOf(d))).length;
  const M = periodTotals(F,cfg,logs,key,ms,me,today,cache);
  const kc = cfg.dogs[key].kcal*M.nDays;
  const fe = M.all.fe/needFor('fe',kc), cu = M.all.cu/needFor('cu',kc);
  const res = {streak, lowDone, fe, cu, currentLow: low(cfg.meat), suggest:[], switchDays:0};
  if(!res.currentLow && cu>=1.0){ res.warn=false; return res; }
  // 推荐：铁最高的几种常用肉
  const alts = Object.keys(F).filter(n=>F[n].cat==='protein' && F[n].fe>=LOW_FE && F[n].f<7)
               .sort((a,b)=>F[b].fe-F[a].fe);
  res.suggest = alts.slice(0,3);
  // 还能再吃几天这种低铁肉：之后换成首选肉，本月铁仍能到目标（逐天按各自那周的计划算）
  if(alts.length){
    const cAlt = Object.assign({},cfg,{meat:alts[0]}), pc={}, pa={};
    const feOn = (c,cache,d)=>{const w=weekStart(d);return (cache[w]||(cache[w]=planWeek(F,c,w))).dogs[key].days[d].tAll.fe};
    const future = monthDays.filter(d=>d>=today && !(logs[d]&&logs[d][key]));
    const A = future.map(d=>feOn(cfg,pc,d)), B = future.map(d=>feOn(cAlt,pa,d));
    const past = M.act.fe, target = MARGIN*needFor('fe',kc);
    let k=-1;
    for(let x=0;x<=future.length;x++){
      let s=past; for(let i=0;i<future.length;i++) s += i<x ? A[i] : B[i];
      if(s>=target) k=x; else break;
    }
    res.daysLeft = k;                      // -1 = 本月已经补不回来
    res.ifSwitchNow = (past + B.reduce((p,q)=>p+q,0))/needFor('fe',kc);
  }
  res.cuLow = cu < 1.0;
  res.warn = streak>=STREAK_MAX || (res.currentLow && res.daysLeft<=3) || res.cuLow;
  return res;
}

// 周中如果实际偏离计划，重算本周剩余几天补充剂（锌、碘）需不需要调整药盒
function boxAdjust(F, cfg, logs, key, ws, today, plan){
  const dog=cfg.dogs[key], days=range(ws,addDays(ws,6)), kcW=dog.kcal*7;
  let t=zero(); const rest=[];
  days.forEach(d=>{
    const L=logs[d]&&logs[d][key];
    if(L) t=sumT(t,dayTotal(F,L));
    else { rest.push(d); const p=plan.dogs[key].days[d]; t=sumT(t,addSupp(Object.assign(zero(),p.t),{})); }
  });
  // t = 已吃的(含已给补充剂) + 剩余天的食物(不含补充剂)
  const restBox = rest.reduce((a,d)=>{const b=plan.dogs[key].box[d];a.zn+=b.znTab;a.i+=b.iTab;return a},{zn:0,i:0});
  const znNeed = Math.max(0,Math.ceil((needFor('zn',kcW)*MARGIN - t.zn)/SUPP.zn.mgPerTab));
  const iNeed  = Math.max(0,Math.ceil((needFor('i',kcW)*MARGIN - t.i)/SUPP.i.ugPerTab));
  const notes=[];
  if(znNeed!==restBox.zn) notes.push({k:'zn', boxed:restBox.zn, need:znNeed});
  if(iNeed!==restBox.i)   notes.push({k:'i',  boxed:restBox.i,  need:iNeed});
  return notes;
}

// ───────────────────────── 做块：批次 ─────────────────────────
// 推荐冰格块数：让 Doctor 每天 1 块
function batchSheet(F, cfg, wsDate){
  const P = planWeek(F,cfg,wsDate), dD=P.dogs.doctor.days[wsDate], dM=P.dogs.missy.days[wsDate];
  const type = P.organType;
  const organDay = dD.organG + dM.organG, fishDay = dD.fishG + dM.fishG;
  const mk = (perDayD, perDayM, days) => {
    const per = perDayD;                         // 一块 = Doctor 一天的量
    const cubesM = Math.max(1,Math.round(perDayM/per));
    return {cubeRaw:per, cubesPerDay:{doctor:1, missy:cubesM}, cubes:(1+cubesM)*days};
  };
  const rec = type==='pork'?cfg.organ.pork:cfg.organ.chicken;
  const rawPack = Object.values(rec).reduce((a,b)=>a+b,0);
  const organDays = type==='pork'?7:14;
  const used = organDay*organDays;
  const fd = type==='chicken' ? fdPerDay(F,cfg,wsDate) : {doctor:0,missy:0};
  const fdBatch = Math.round((fd.doctor+fd.missy)*14);
  return {
    organType:type,
    organ: Object.assign({recipe:rec, pack:rawPack, use:Math.min(rawPack,used), discard:Math.max(0,rawPack-used), days:organDays,
             fd: type==='chicken'?{name:cfg.organ.fd, g:fdBatch, capped:!!fd.capped}:null}, mk(dD.organG,dM.organG,organDays)),
    fish:  (()=>{ const dF=dD.fishG, mF=dM.fishG, both=dF+mF;
             const alt = cfg.fishAlt===true && dF>0;
             const cube = alt ? 2*dF : (dF>0 ? dF : mF);
             const cm = mF>0 ? Math.max(1, Math.round(mF/(cube||1))) : 0;
             const dWeek = dF>0 ? (alt ? FISH_DAYS.size : 7) : 0;
             return {name:cfg.fish, days:7, cubeRaw:cube, cubes:dWeek+7*cm, raw: alt ? cube*(dWeek+7*cm) : both*7,
                     share: both>0 ? {doctor:dF/both, missy:mF/both} : {doctor:0, missy:0},
                     cubesPerDay:{doctor: dF>0 ? (alt?dWeek/7:1) : 0, missy:cm}, doctorDays: alt?[...FISH_DAYS]:null}; })(),
    veg:   (()=>{ const both=dD.vegG+dM.vegG, days=cfg.vegDays||VEG_DAYS;
             const tot=Object.values(cfg.veg).reduce((a,b)=>a+b,0)||1, mix={};
             for(const n in cfg.veg) mix[n]=both*days*cfg.veg[n]/tot;
             return {mix, perDay:{doctor:dD.vegG, missy:dM.vegG}, batchDays:days, maxBatchRaw:VEG_MAX_RAW, over: both*days>VEG_MAX_RAW+0.5}; })(),
  };
}

function cubesOn(b, dog, date){

function splitDay(g){
  const r = {meat:null, meatG:0, carb:null, carbG:0, carbs:[], organ:{}, fish:null, fishG:0, veg:{}, egg:0, other:{}};
  for(const n in g){
    const c = F[n] ? F[n].cat : '';

// 每一类：还够几天、什么时候要做
function prepStatus(X){
  const {R, cfg, sheet} = X, out = [];
  const rd = cfg.inRecovery ? (cfg.recLv||{}) : null;
  const type = R.organType, nextType = C.organTypeOfWeek(ST.cfg, C.addDays(R.weekStart,7));
  const daysLeftOf = (kind, t) => { const ab = activeBatch(kind, t); return ab ? Math.floor(ab.left/ab.b.perDay+1e-6) : 0; };
  const item = (key, name, paused, left, need, notNeeded, noDate) => {
    let level, text;
    if(paused){ level='paused'; text='恢复期暂停，加回这一步时再做'; }
    else if(notNeeded){ level='ok'; text='这几天不用做'; }
    else if(left<=0){ level='now'; text='没有了，今天要做'; }
    else if(left<=need){ level='soon'; text=noDate?`还够 ${left} 天，快做下一批`:`还够 ${left} 天，${md(C.addDays(TODAY,left))} 前要做`; }
    else { level='ok'; text=`还够 ${left} 天`; }
    out.push({key, name, level, text, left});
  };
  const pd2 = DOGS.map(k=>splitDay(R.plan.dogs[k].days[TODAY].g));
  const pureeToday = pd2.reduce((s,x)=>s+sum(x.veg)+(cfg.eggInVeg?x.egg:0),0);
  // 内脏块：只在对应的周吃；猪肝周每周都要新做
  const organName = type==='pork'?'猪肝块':'鸡内脏块';
  if(cfg.organMode==='fd'){
    const fdDay = (n) => DOGS.reduce((a,k)=>a+(R.plan.dogs[k].days[TODAY].g[n]||0),0);
    const l = fdDay(cfg.organ.fd), b = fdDay(cfg.organ.blood);
    if(rd && !rd.organ) out.push({key:'organ', name:'冻干内脏', level:'paused', text:'恢复期暂停，加回这一步时再给'});
    else out.push({key:'organ', name:'冻干内脏', level:'ok', text: l>0 ? `每天牛肝 ${g1(l)} g${b>0?`、兔血 ${g1(b)} g`:''}（两只合计）。一包牛肝 70 g 约够 ${Math.floor(70/l)} 天${b>0?`，兔血 50 g 约够 ${Math.floor(50/b)} 天`:''}` : '这几天不用给'});
  } else
  item('organ', organName, rd && !rd.organ, daysLeftOf('organ', type), 2, false, true);
  item('fish', '鱼块', rd && !rd.fish, daysLeftOf('fish', null), 2, sheet.fish.raw<1);
  item('veg', cfg.eggInVeg?'菜蛋泥':'菜泥', rd && !rd.veg, daysLeftOf('veg', null), 1, pureeToday<1);
  // 药盒：周四起提醒装下周
  const wdNow = C.weekdayOf(TODAY);
  if(!(cfg.inRecovery && cfg.suppOff)) out.push({key:'box', name:'药盒', level:(wdNow===4||wdNow===5)?'soon':'ok', text:(wdNow===4||wdNow===5)?`周六前装好下周（${md(C.addDays(R.weekStart,7))} 起）`:'本周已按表装好就行'});
  else out.push({key:'box', name:'药盒', level:'paused', text:'恢复期只单独给钙粉'});
  return out;
}
// 做下一批要准备的食材
function shoppingList(X, st){
  const {sheet, cfg, R} = X, list = [];
  const want = k => st.find(s=>s.key===k && (s.level==='now'||s.level==='soon'));
  if(want('organ')){
    const O = sheet.organ;
    for(const [n,g] of Object.entries(O.recipe)) list.push(`${short(n)} ${g} g${O.organType==='pork'?'（一盒）':''}`);
    if(O.fd && !cfg.noFd) list.push(`${O.fd.name} ${O.fd.g} g`);
  }
  if(want('fish') && sheet.fish.raw>=1) list.push(`${short(sheet.fish.name)} 约 ${Math.round(sheet.fish.raw)} g（生）`);
  if(want('veg')){
    for(const [n,g] of Object.entries(sheet.veg.mix)) if(g>=1) list.push(`${short(n)} ${Math.round(g)} g`);
    const eggDay = DOGS.reduce((s,k)=>s+(R.plan.dogs[k].days[TODAY].g['水煮蛋(全蛋)']||0),0);
    if(cfg.eggInVeg && eggDay>0) list.push(`鸡蛋 ${Math.max(1,Math.round(eggDay*sheet.veg.batchDays/50))} 个`);
  }
  return list;
}
// 冻干内脏：一周每天的克数（按今天的计划），可以一次分装好
function fdCard(X){
  const {R, cfg} = X, P = R.plan, L = cfg.organ.fd, B = cfg.organ.blood;
  const days = C.range(R.weekStart, C.addDays(R.weekStart,6));
  const g = (k,d,n) => P.dogs[k].days[d].g[n]||0;
  const tot = (k,n) => days.reduce((a,d)=>a+g(k,d,n),0);
  const row = k => `<li><span><b>${DOGN[k]}</b></span><span>牛肝 <span class="num">${g1(g(k,TODAY,L))}</span> g${g(k,TODAY,B)>0?` · 兔血 <span class="num">${g1(g(k,TODAY,B))}</span> g`:''}</span></li>`;
  return `<section class="card batch">
    <ul class="recipe">${DOGS.map(row).join('')}</ul>
    <ol class="steps">
      <li>每天<b>晚餐</b>给一次，剪碎拌进饭里。用 0.1 g 的小秤称；或者先称几块的总重，算出一块多重，之后数块数。</li>
      <li>克数是按铜、维A、B12（牛肝）和铁（兔血）的缺口算的，换肉、换热量会跟着变。Missy 的牛肝不会超过她的铜上限。</li>
      <li>可以一周分装一次：本周 Doctor 牛肝 ${g1(tot('doctor',L))} g${tot('doctor',B)>0?`、兔血 ${g1(tot('doctor',B))} g`:''}，Missy 牛肝 ${g1(tot('missy',L))} g${tot('missy',B)>0?`、兔血 ${g1(tot('missy',B))} g`:''}。</li>
      <li>开封后密封、放冰箱，尽快吃完。兔血会让便便颜色变深，属正常；但如果便便黑得像柏油、还很稀，要看兽医。</li>
    </ol>
  </section>`;
}

    <details class="fold"><summary>健身零食：鸡胸脆片</summary><section class="card batch">
      <ul class="recipe"><li><span>生鸡胸肉（去皮、去筋膜和肥油）</span><span><span class="num">300</span> g</span></li><li><span>清水</span><span><span class="num">30–50</span> ml</span></li></ul>

/* ───────────── 两只狗 ───────────── */
function nutriSummary(D){
  const rows = [...D.week.filter(r=>r.k!=='ca'&&r.k!=='ph').map(r=>Object.assign({p:'本周'},r)), ...D.month.map(r=>Object.assign({p:'本月'},r))];
  const bad = rows.filter(r=>r.s==='low'||r.s==='high');
  const thin = rows.filter(r=>r.s==='thin');
  const ca = D.week.find(r=>r.k==='ca'), capBad = ca && (ca.cap<1||ca.cap>2);
  if(!bad.length && !capBad) return {cls:'ok', text: thin.length?`都够，${thin.map(r=>C.NM[r.k]).join('、')}略低于目标`:'都够'};
  return {cls:'bad', text: [...bad.map(r=>`${r.p}${C.NM[r.k]}${r.s==='high'?'接近上限':'不够'}（${r.ratio.toFixed(2)} 倍）`), capBad?`钙磷比 ${ca.cap.toFixed(2)}`:''].filter(Boolean).join('；')};
}

}

function stockHtml(kind, type, unit){

  const b = ab.b, left = ab.left, perDay = b.perDay;
  const days = Math.floor(left/perDay+1e-6);
  const cellsBtn = (kind!=='veg' && b.days && !(b.cells && b.cells.doctor>0 && b.cells.missy>0)) ? `<button class="btn small" data-cells="${b.id}">填格数</button>` : '';
  const cellsTxt = (b.cells && b.cells.doctor>0) ? ` · Doctor ${b.cells.doctor} 格、Missy ${b.cells.missy} 格` : '';
  return `<div class="stock"><span>${md(b.made)}做的 · 还能吃 <span class="num">${days}</span> 天${cellsTxt}</span>

    <span class="gauge" aria-hidden="true"><i style="width:${Math.min(100,left/b.total*100)}%"></i></span></div>`;
}

    if(b.znTab) t.push(`<b>锌 <span class="num">${b.znTab}</span> 片</b>`);

  const tD = tot('doctor'), tM = tot('missy');
  const totTxt = t => `钙粉 ${t.ca.toFixed(2)} g · 碘 ${t.i} 片 · 锌 ${t.zn} 片 · 维E ${t.ve} 粒${t.vd?` · 维D ${t.vd} 粒`:''}`;
  const anyVd = tD.vd+tM.vd>0;

      <tbody>${days.map(d=>`<tr${d===TODAY?' class="now"':''}><th>${wd(d)}<small>${md(d)}</small></th><td>${cell(P.dogs.doctor.box[d])}</td><td>${cell(P.dogs.missy.box[d])}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="note" style="margin-top:8px"><b>Doctor 一周</b>：${totTxt(tD)}<br><b>Missy 一周</b>：${totTxt(tM)}</div>

const ST_N = {ok:'够', thin:'偏少', low:'不够', high:'接近上限', warn:'注意', info:''};
function meterRow(r){
  const nm = C.NM[r.k]||r.k, scale = 2;
  const w = Math.min(1, r.ratio/scale)*100, t = Math.min(1,(r.target||1)/scale)*100;
  const extra = r.ofMax!=null ? `上限的 ${Math.round(r.ofMax*100)}%` : (r.target&&r.target!==1?`目标 ${r.target} 倍`:'');
  return `<div class="meter"><span class="nm">${esc(nm)}</span>
    <span class="bar" role="img" aria-label="${esc(nm)} ${r.ratio.toFixed(2)} 倍"><span class="fill ${r.s}" style="width:${w}%"></span><span class="tick" style="left:calc(${t}% - 1px)"></span></span>
    <span class="v"><span class="num">${r.ratio.toFixed(2)}</span><span class="unit">倍</span><small>${extra||ST_N[r.s]}</small></span></div>`;
}
function capRow(rows){
  const ca = rows.find(r=>r.k==='ca'); if(!ca) return '';
  const s = ca.cap<1||ca.cap>2?'warn':'ok';
  return `<div class="meter"><span class="nm">钙磷比</span><span class="note">AAFCO 要求 1.0–2.0，目标 1.3</span>
    <span class="v"><span class="num">${ca.cap.toFixed(2)}</span><small><span class="st ${s}">${s==='ok'?'正常':'超出范围'}</span></small></span></div>`;
}
function dayChecks(rows, dog){
  const lab = {kcal:'热量', p:'蛋白质', f:'脂肪', cap:'钙磷比', fiber:'纤维', cu:'铜'};
  return rows.map(r=>{
    let v;
    if(r.k==='kcal') v = `${Math.round(r.v)} kcal`;
    else if(r.k==='p'||r.k==='f') v = `${r.v.toFixed(1)}%`;
    else if(r.k==='cap') v = r.v.toFixed(2);
    else if(r.k==='fiber') v = `${r.v.toFixed(2)} g/餐`;
    else if(r.k==='cu') v = `${r.v.toFixed(2)} / ${r.limit.toFixed(2)} mg`;
    return `<div class="field"><span class="l">${lab[r.k]}${r.k==='cu'?'<small>Missy 的个体关注线</small>':''}${r.k==='f'?'<small>12–30% 之间</small>':''}</span><span><span class="num">${v}</span> ${r.s!=='info'?`<span class="st ${r.s==='warn'?'warn':'ok'}">${r.s==='warn'?'注意':'正常'}</span>`:''}</span></div>`;
  }).join('');
}

// 这只狗“一天的量”由哪些食材、各多少克组成：有批次按批次，没有按计划

  const ab = activeBatch(kind, kind==='organ'?P.organType:null, date);
  if(ab && ab.b.days && ab.b.share) return batchDayMap(ab.b, dog);
  const sp = splitDay(P.dogs[dog].days[date].g);
  return kind==='organ' ? sp.organ : (sp.fish?{[sp.fish]:sp.fishG}:{});
}

function saveMake(kind){
  const X = LAST, {R, sheet} = X, type = R.organType;
  const val = id => Math.max(0, parseFloat(($('#'+id)||{}).value)||0);
  const recipe = {};
  document.querySelectorAll('#sheetHost [data-rn]').forEach(el=>{ const x=Math.max(0,parseFloat(el.value)||0); if(x>0) recipe[el.dataset.rn]=x; });
  const id = 'b'+Date.now().toString(36);
  let b;
  const share = shareOf(X.cfg);
  if(kind==='organ'){
    const O = sheet.organ, fdG = val('m_fd');
    if(O.fd && fdG>0) recipe[O.fd.name] = fdG;
    const days = O.days;
    b = {id, kind, type, made:TODAY, recipe, fdG: O.fd?fdG:0, days, share, cells: readCells(), total:days, perDay:1};
  } else if(kind==='fish'){
    const Fi = sheet.fish, g = val('m_fishg');
    recipe[Fi.name] = g;
    b = {id, kind, made:TODAY, recipe, days:7, share: (Fi.share && Fi.share.doctor+Fi.share.missy>0.99) ? Fi.share : share, cells: readCells(), total:7, perDay:1};
  } else {
    const V = sheet.veg, tot = sum(recipe), both = Math.max(1, V.perDay.doctor+V.perDay.missy);
    if(X.cfg.eggInVeg && val('m_egg')>0) recipe['水煮蛋(全蛋)'] = val('m_egg')*50;
    const vegOnly = Object.entries(recipe).filter(([n])=>F[n]&&F[n].cat==='veg').reduce((s,[,g])=>s+g,0);
    const vegBoth = V.perDay.doctor+V.perDay.missy;
    const days = vegBoth>=1 && vegOnly>0 ? Math.max(1, Math.round(vegOnly/vegBoth)) : V.batchDays;
    b = {id, kind, made:TODAY, recipe, days, share, total:days, perDay:1};
  }
  ST.batches.push(b);
  // 旧批次只留最近 60 天
  const cut = C.addDays(TODAY,-60); ST.batches = ST.batches.filter(x=>x.made>=cut);
  saveCfg(); closeSheet(); render(); toast('这批已记下');
}

/* ───────────── 记录 ───────────── */
function follow(date, quiet){
  const X = LAST, P = planFor(X.cfg, date), logs = X.logs[date]||{};
  const rec = C.planToLog(P, date);
  for(const k of DOGS){ if(!logs[k]) setLog(date, k, Object.assign(rec[k], {at:new Date().toISOString()})); }
  if(!quiet){ render(); toast(`${md(date)} 已记录`); }
}
function undoDay(date){ for(const k of DOGS) setLog(date, k, null); render(); toast('已撤销'); }

/* ───────────── 主渲染 ───────────── */
let LAST = null;
function render(){
  const now = C.ds(new Date()); if(now!==TODAY){ TODAY = now; }
  let X;
  try{ X = compute(); }
  catch(e){ $('#view').innerHTML = `<section><div class="err">计算出错：${esc(e.message||e)}。请把这句话发给 Claude。</div></section>`; console.error(e); return; }
  LAST = X;
  paintHdr(X);
  const html = UI.tab==='today'?viewToday(X):UI.tab==='prep'?viewPrep(X):viewDogs(X);
  $('#view').innerHTML = html;
  document.querySelectorAll('#tabs button').forEach(b=>{
    if(b.dataset.tab===UI.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
}
function go(tab){ UI.tab = tab; try{ history.replaceState(null,'','#'+tab) }catch(e){} render(); window.scrollTo(0,0); }

/* ───────────── 事件 ───────────── */
document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-close]'); if(!t) return;
  const d = t.dataset;
  if(d.close && e.target!==t && !e.target.closest('button')) return;   // 只有点到遮罩本身或取消按钮才关
  if(d.close){ closeSheet(); return; }
  if(d.tab) return go(d.tab);
  if(d.go) return go(d.go);
  if(d.export) return exportData();
  if(d.follow) return follow(d.follow);
  if(d.followAll){ const X=LAST; C.range(X.R.weekStart, C.addDays(TODAY,-1)).forEach(dd=>{ const l=X.logs[dd]||{}; if(!(l.doctor&&l.missy)) follow(dd,true); }); render(); toast('已按建议补记'); return; }
  if(d.train!=null){
    const tr = ST.cfg.train = Object.assign({days:{}, pct:{doctor:0.1, missy:0.1}}, clone(ST.cfg.train||{}));
    tr.days = Object.assign({}, tr.days);
    if(d.train==='1') tr.days[TODAY]=true; else delete tr.days[TODAY];
    const cut = C.addDays(TODAY,-60); for(const k in tr.days) if(k<cut) delete tr.days[k];
    saveCfg(); render(); toast(d.train==='1'?'今天健身：正餐已减掉零食的热量':'今天不健身'); return;
  }
  if(d.mode){ UI.mode = d.mode; try{ localStorage.setItem('dmk2mode', d.mode) }catch(e){} return render(); }
  if(d.status){
    const on = ST.cfg.recovery && ST.cfg.recovery.on;
    if(d.status==='recovery' && !on){ ST.cfg.recovery = {on:true, start:TODAY, v:2, lv:{}, hist:[], kcal:Object.fromEntries(DOGS.map(x=>[x, Math.round(ST.cfg.dogs[x].kcal*0.85/5)*5]))}; saveCfg(); render(); toast('进入恢复期'); }
    if(d.status==='normal' && on){ ST.cfg.recovery = Object.assign(clone(ST.cfg.recovery), {on:false}); saveCfg(); render(); toast('回到正常饮食'); }
    return;
  }
  if(d.undo) return undoDay(d.undo);
  if(d.edit) return openEdit(d.edit, d.date);
  if(d.saveedit) return saveEdit();
  if(d.clearlog){ setLog(d.date, d.clearlog, null); closeSheet(); render(); toast('已删除'); return; }
  if(d.make) return openMake(d.make);
  if(d.savemake) return saveMake(d.savemake);
  if(d.delbatch){
    if(t.dataset.armed){ ST.batches = ST.batches.filter(b=>b.id!==d.delbatch); saveCfg(); render(); toast('这批已删除'); }
    else { t.dataset.armed='1'; t.textContent='再点一次删除'; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent='删除'; } },4000); }
    return;
  }
  if(d.dog){ UI.dog = d.dog; return render(); }
  if(d.setdog){ UI.setDog = d.setdog; return render(); }
  if(d.thisweek){ ST.cfg.organ.anchor = {week:C.weekStart(TODAY), type:d.thisweek}; ST.cfg.anchorConfirmed = true; saveCfg(); render(); toast('已改为'+TYPE_N[d.thisweek]); return; }
  if(d.veg){
    const n = d.veg, v = nextVeg(), on = v[n]>0;
    if(on){ if(Object.values(v).filter(x=>x>0).length<=1){ toast('至少留一种菜'); return; } delete v[n]; } else v[n]=1;
    ST.cfg.veg = v; ST.cfg.vegAuto = false; saveCfg(); render(); return;
  }
  if(d.organmode){ ST.cfg.organMode = d.organmode; saveCfg(); render(); toast(d.organmode==='fd'?'内脏改用冻干':'内脏改回内脏块'); return; }
  if(d.vegauto){ ST.cfg.vegAuto = true; saveCfg(); render(); toast('菜泥回到建议轮换'); return; }
  if(d.rec){
    const r = ST.cfg.recovery = ST.cfg.recovery ? clone(ST.cfg.recovery) : null;
    if(d.rec==='start'){
      ST.cfg.recovery = {on:true, start:TODAY, v:2, lv:{}, hist:[], kcal:Object.fromEntries(DOGS.map(x=>[x, Math.round(ST.cfg.dogs[x].kcal*0.85/5)*5]))};
      saveCfg(); go('today'); toast('恢复期开始了'); return;
    }
    if(!r) return;
    if(d.rec==='end'){ r.on=false; ST.cfg.recovery=r; if(C.recFrac(C.recState(ST.cfg),'veg')>=1) ST.cfg.vegScale=1; saveCfg(); render(); toast('恢复期结束，回到平时的配方'); return; }
    if(d.rec==='add' || d.rec==='back'){
      const st = C.recoveryStep(ST.cfg, TODAY, d.rec==='add'?1:-1); if(!st.k) return;
      ST.cfg.recovery = st.r;
      if(st.k==='veg'){ const f = C.recFrac(C.recState(ST.cfg),'veg'); if(f>0) ST.cfg.vegScale = f; }
      saveCfg(); render();
      toast(d.rec==='add' ? (st.k==='kcal'?'热量加了 10%':'已加到：'+st.label) : '已退一档'); return;
    }
    return;
  }
  if(d.egginveg){ ST.cfg.eggInVeg = d.egginveg==='1'; saveCfg(); render(); return; }
  if(d.cells) return openCells(d.cells);
  if(d.savecells){ const b=ST.batches.find(x=>x.id===d.savecells); if(b){ b.cells=readCells(); saveCfg(); } closeSheet(); render(); toast('格数已记下'); return; }
  if(d.carbsplit){ ST.cfg.carbSplit = parseFloat(d.carbsplit); saveCfg(); render(); return; }
  if(d.boxweek){ UI.boxWeek = d.boxweek; return render(); }
  if(d.vegscale){ ST.cfg.vegScale = parseFloat(d.vegscale); saveCfg(); render(); return; }
  if(d.dogflag){ ST.cfg.dogs[d.who][d.dogflag] = d.val==='1'; saveCfg(); render(); toast(`${DOGN[d.who]}：${d.dogflag==='noEgg'?'鸡蛋':'鱼块'}${d.val==='1'?'不吃了':'恢复'}`); return; }
});
document.addEventListener('change', e=>{
  if(e.target.dataset && e.target.dataset.import){ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) importData(f); return; }
  const t = e.target, d = t.dataset;
  if(d.cookdry || d.cooktot){
    const n = d.cookdry || d.cooktot, x = parseFloat(t.value);
    if(!COOK || COOK.date!==TODAY) COOK = {date:TODAY, items:{}};
    const it = COOK.items[n] = Object.assign({}, COOK.items[n]);
    if(d.cookdry) it.dry = x>0 ? x : 0; else it.total = x>0 ? x : 0;
    if(!(it.dry>0)){ const inp = document.getElementById('ckd_'+n); it.dry = inp ? parseFloat(inp.value)||0 : 0; }
    saveCook(); render(); return;
  }
  if(d.cfg){ ST.cfg[d.cfg] = t.type==='number' ? (parseFloat(t.value)||ST.cfg[d.cfg]) : t.value;
    if(ST.cfg.carb2 && ST.cfg.carb2===ST.cfg.carb) ST.cfg.carb2='';
    saveCfg(); render(); return; }
  if(d.cfg2){ const [a,b] = d.cfg2.split('.'); ST.cfg[a][b] = t.value; saveCfg(); render(); return; }
  if(d.trainpct){ const x=parseFloat(t.value); if(x>=0){ const tr = ST.cfg.train = Object.assign({days:{}, pct:{doctor:0.1, missy:0.1}}, clone(ST.cfg.train||{})); tr.pct = Object.assign({}, tr.pct, {[d.trainpct]: x/100}); saveCfg(); } render(); return; }
  if(d.reck){ const x=parseFloat(t.value); if(x>0){ ST.cfg.recovery = clone(ST.cfg.recovery); ST.cfg.recovery.kcal[d.reck]=x; saveCfg(); } render(); return; }
  if(d.dogf){
    const x = parseFloat(t.value); if(!(x>=0)) { render(); return; }
    ST.cfg.dogs[d.who||UI.setDog][d.dogf] = x; saveCfg(); render(); return;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && EDIT!==null) closeSheet(); if(e.key==='Escape') closeSheet(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
setInterval(()=>{ if(C.ds(new Date())!==TODAY) render(); }, 60000);
window.addEventListener('error', ev=>{ try{ $('#toastHost').innerHTML = `<div class="toast" role="alert">出错了：${esc(ev.message)}</div>` }catch(_){} });

render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
